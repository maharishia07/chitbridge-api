# E02 — secret scanning. Default ruleset plus an allow-list that NAMES FILES (no wildcards, no directories).
# Add a file here only when it holds a documented dev/test fixture, with the reason beside it.
[extend]
useDefault = true

[allowlist]
description = "Named dev/test fixtures only"
paths = [
  # CI-only throwaway JWT secret + DEV_OTP for the throwaway Postgres (integration job env block)
  '''^\.github/workflows/ci\.yml$''',
  # test-case definitions: "case_key" identifiers (e.g. names of cases), not credentials
  '''^data/test-cases\.json$''',
  # installation_key identifiers ('platform-0' ...) in the governance seed, not credentials
  '''^migrations/b74_platform_governance\.sql$''',
]
