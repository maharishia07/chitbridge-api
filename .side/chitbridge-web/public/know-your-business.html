     CALLED BY Home's Running area (manifest id kyb, /know-your-business.html), the shell's licence "finish" link (app/shell.js, fix_url default) and standards.html (its area-to-page map, the identity entry).

     CARD 28-platform-and-operations/know-your-business -->

<style>
  :root{ --ink:#1b2431; --grey:#5a6678; --line:#e5e8ee; --paper:#f5f6f9; --bg:var(--paper); --card:#fff; --blue:#3F66A6;
    --ok:#2f7a45; --warn:#b4832a; --bad:#c0453b; --verified:#1f6e42; --documented:#8a5a06; --declared:#5a6578; --wall:#5f5446; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:var(--f-ui,'IBM Plex Sans',system-ui,sans-serif); background:var(--bg); color:var(--ink); }   /* SYSTEM.md §2: one face on every page (SHELL-ONE) */
  .wrap{ max-width:820px; margin:0 auto; padding:16px; }
  h1{ font-size:20px; margin:4px 0 2px; } .sub{ font-size:12.5px; color:var(--grey); margin-bottom:14px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:13px; padding:14px 15px; margin-bottom:12px; }
  label{ font-size:11px; font-weight:700; color:var(--grey); display:block; margin:8px 0 3px; }
  input,select{ width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; font-size:13px; }
  input{ min-width:0; text-overflow:ellipsis; }   /* UX-6: the library's input sizing (as network-shop .srch input) - a long placeholder ends in an ellipsis, never a hard cut */
  button{ font-size:13px; font-weight:700; border:0; border-radius:9px; padding:9px 15px; cursor:pointer; }
  .pri{ background:var(--blue); color:var(--paper,#fff); } .gh{ background:var(--card,#fff); color:var(--ink); border:1px solid var(--line); }
  .row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .tabs{ display:flex; gap:4px; margin:6px 0 12px; flex-wrap:wrap; }
  .tab{ font-family:inherit; font-size:12.5px; font-weight:700; padding:8px 13px; border-radius:9px; cursor:pointer; background:var(--neutral-tint,#eef1f6); color:var(--grey); border:1px solid transparent; }
  .tab:focus-visible,.pri:focus-visible,.gh:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }
  .tab.on{ background:var(--card,#fff); color:var(--blue); border-color:var(--blue); }
  .sec{ font-size:11px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--grey); margin:14px 2px 8px; }
  .cred{ display:flex; align-items:center; gap:9px; padding:9px 0; border-top:1px solid var(--line); }
  .cred .nm{ flex:1; min-width:0; font-weight:600; font-size:13px; }
  .rung{ font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; border-radius:6px; padding:2px 7px; }
  .r-verified{ background:#eaf6ee; color:var(--verified); } .r-documented{ background:#faf3dd; color:var(--documented); }
  .r-declared{ background:var(--neutral-tint,#eef0f3); color:var(--declared); } .r-null{ background:var(--neutral-tint,#f3f4f6); color:var(--declared); }
  .exp{ font-size:10px; font-weight:700; border-radius:5px; padding:2px 6px; }
  .exp.soon{ background:#fdf3e3; color:var(--warn); } .exp.gone{ background:#fbeaea; color:var(--bad); }
  .bucket{ border-radius:10px; padding:11px 12px; margin-bottom:9px; }
  .bucket.now{ background:#eaf6ee; border:1px solid #bfe3cb; } .bucket.step{ background:#eef3fb; border:1px solid #cfe0f4; } .bucket.struct{ background:#f5f2ee; border:1px solid #e3dbc9; }
  .bucket .bh{ font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; margin-bottom:5px; }
  .pill{ display:inline-block; font-size:11.5px; background:var(--card,#fff); border:1px solid var(--line); border-radius:999px; padding:3px 10px; margin:3px 5px 0 0; }
  .lane{ border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
  .bar{ height:7px; background:var(--neutral-tint,#eef1f6); border-radius:4px; overflow:hidden; margin:5px 0; }
  .bar > i{ display:block; height:100%; background:var(--ok); }
  .gap{ font-size:11.5px; padding:3px 0; }
  .gap .k{ font-size:9px; font-weight:800; border-radius:4px; padding:1px 5px; margin-inline-end:5px; }
  .gap .closeable{ background:#eef3fb; color:var(--blue); } .gap .structural{ background:#f5f2ee; color:var(--wall); }
  .expo{ border-inline-start:3px solid var(--warn); background:#fdfaf4; border-radius:8px; padding:9px 12px; margin-bottom:8px; }
  .expo.high{ border-inline-start-color:var(--bad); background:#fdf5f4; }
  .expo .f{ font-weight:700; font-size:13px; } .expo .d{ font-size:11.5px; color:var(--grey); margin-top:3px; }
  .disclaim{ font-size:11px; color:var(--grey); font-style:italic; margin-top:8px; }
  /* Field — WALLED OFF */
  .wallcard{ background:#faf8f4; border:1px dashed #d8cdbb; border-radius:13px; padding:15px; }
  .wallbanner{ font-size:11.5px; font-weight:700; color:var(--wall); background:#f3ecdf; border:1px solid #e3d6bf; border-radius:8px; padding:8px 11px; margin-bottom:10px; }
  .fres{ border-top:1px solid var(--line); padding:8px 0; font-size:12.5px; }
  .fres a{ color:var(--blue); font-size:11px; } .asof{ font-size:10px; color:var(--grey); }
  .empty{ text-align:center; color:var(--grey); font-size:13px; padding:22px; } .err{ color:var(--bad); font-size:12px; margin-top:6px; }
  .note{ font-size:10.5px; color:var(--grey); }
  .netpill{ position:fixed; top:62px; right:12px; font-size:11px; font-weight:700; border-radius:999px; padding:4px 11px; z-index:50; border:1px solid var(--line); background:var(--card,#fff); color:var(--ok); }
  .netpill.off{ background:#fdf6e9; color:var(--warn); border-color:#e8d9b8; }
  @media print{ #shell{ display:none; } }
</style>

<body>
<div class="wrap">
  <h1>📊 Know your business</h1>
  <div class="sub">What we can tell you from data you&rsquo;ve already given &mdash; each fact with how much to trust it. Not a governance feature; the outward panel always says &ldquo;verify at the source.&rdquo;</div>
  <div id="app"><div class="card"><div class="empty">Loading…</div></div></div>
</div>
<div id="netpill" class="netpill"></div>
<script src="/engine/screen.js"></script>
<script src="/app/edition.js"></script>   <!-- CBEdition (AX1): the showing this person chose — the switcher, the bell and the avatar's Edition choice follow it -->
<script src="/app/avatar.js"></script>

<script src="/app/signin-ui.js"></script>

<script src="/app/accounts-shell.js"></script>

<script src="/app/screen-id.js"></script>   <!-- CBScreenId: this screen's name · code in the header, and every sheet's own (SCREEN-ID) -->
<script src="/app/ui.js"></script>   <!-- CMP023 Home: the shell draws its ⌂ Home link from the standard components -->
<script src="/app/shell-facts.js"></script><script src="/app/shell.js"></script>

<script>
var API = new URLSearchParams(location.search).get('api') || (window.CBShell && CBShell.apiBase && CBShell.apiBase()) || window.CB_API;
var TOK = null,
  TAB = 'yourself',
  _stage = 'email';
function paintPill(s) {
  var node = el('netpill');
  if (!node) return;
  if (s.online) {
    node.className = 'netpill';
    node.textContent = s.pending ? '● Online · syncing ' + s.pending : '● Online';
  } else {
    node.className = 'netpill off';
    node.textContent = '⚠ Offline · ' + (s.pending ? s.pending + ' pending' : 'work saved locally');
  }
}
function saveKyb() {
  if (window.CBOffline) CBOffline.saveDraft('kyb.cred', { title: (el('nc_title') || {}).value || '' });
}
function el(id) {
  return document.getElementById(id);
}
async function api(m, p, body) {
  var h = { 'Content-Type': 'application/json' };
  if (TOK) h.Authorization = 'Bearer ' + TOK;
  var reply = await fetch(API + p, { method: m, headers: h, body: body ? JSON.stringify(body) : undefined });
  var j = null;
  try {
    j = await reply.json();
  } catch (e) {}
  return { status: reply.status, j: j };
}
function rungChip(r) {
  var c = r ? 'r-' + r : 'r-null';
  return '<span class="rung ' + c + '">' + esc(r || 'not held') + '</span>';
}

/* H23/H24: ONE sign-in. The shell above holds the one sign-in window; a session that ended is dropped and the window shows again (CBFrame.ended) - no second e-mail code here. */
function loginView() {
  CBFrame.ended();
}
function shell() {
  var hadFocus = document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('tab');
  el('app').innerHTML =
    '<div class="tabs" role="tablist" aria-label="Know your business" onkeydown="tabKey(event)">' +
    ['yourself|Yourself', 'position|Position', 'risk|Risk', 'field|Field']
      .map(function (item) {
        var k = item.split('|')[0],
          l = item.split('|')[1];
        return '<button type="button" role="tab" id="kyb_tab_' + k + '" aria-selected="' + (TAB === k) + '" tabindex="' + (TAB === k ? 0 : -1) + '" data-cbsid="KYB001-C01" class="tab' + (TAB === k ? ' on' : '') + '" onclick="go(\'' + k + '\')">' + l + '</button>';
      })
      .join('') +
    '</div><div id="body" role="tabpanel" aria-labelledby="kyb_tab_' + TAB + '"><div class="card"><div class="empty">Loading…</div></div></div>';
  if (hadFocus) el('kyb_tab_' + TAB).focus(); /* the tabs are drawn again: the keyboard keeps its place */
}
/** the tab strip by keyboard: arrows move to the next or previous tab (and wrap), Home and End to the first and last; Enter and Space are the button's own */
function tabKey(event) {
  var at = TAB_NAMES.indexOf(TAB),
    to = -1;
  if (event.key === 'ArrowRight') to = (at + 1) % TAB_NAMES.length;
  else if (event.key === 'ArrowLeft') to = (at + TAB_NAMES.length - 1) % TAB_NAMES.length;
  else if (event.key === 'Home') to = 0;
  else if (event.key === 'End') to = TAB_NAMES.length - 1;
  if (to < 0) return;
  event.preventDefault();
  go(TAB_NAMES[to]);
}
var TAB_NAMES = ['yourself', 'position', 'risk', 'field'];
function hashName() {
  return (location.hash || '').replace(/^#\/?/, '');
}
/** UX-102: the tab the address names (#position); anything else is Yourself, so Back and a shared link land where they were */
function tabFromHash() {
  var named = hashName();
  return TAB_NAMES.indexOf(named) >= 0 ? named : 'yourself';
}
function showTab(tabName) {
  TAB = tabName;
  shell();
  load();
}
/** a tap on a tab writes the address; the hashchange below paints it, so the tap and Back take the same road */
function go(tabName) {
  if (hashName() === tabName) return showTab(tabName);
  location.hash = tabName;
}
window.addEventListener('hashchange', function () {
  if (TOK && tabFromHash() !== TAB) showTab(tabFromHash());
});
async function load() {
  var node = el('body');
  node.innerHTML = '<div class="card"><div class="empty">Computing from your data…</div></div>';
  if (TAB === 'yourself') return renderYourself(node);
  if (TAB === 'position') return renderPosition(node);
  if (TAB === 'risk') return renderRisk(node);
  if (TAB === 'field') return renderField(node);
}

// ── YOURSELF ──
async function renderYourself(node) {
  var reply = await api('GET', '/api/kyb/yourself');
  if (reply.status === 401) {
    TOK = null;
    return loginView('Session expired');
  }
  var f = (reply.j && reply.j.facts) || {},
    cr = f.credentials || [],
    s = f.summary || {};
  var add =
    '<div class="card"><div class="sec" style="margin-top:0">Add a credential we don&rsquo;t know</div><div class="note" style="margin-bottom:6px">A village NOC, a municipal licence &mdash; anything. It lands <b>declared</b>; it rises to <b>documented</b> when you attach a real owned document. The list you add IS the roadmap.</div>' +
    '<div class="row"><input data-cbsid="KYB001-I01" id="nc_title" placeholder="Credential name, e.g. Village NOC" aria-label="Credential name" style="flex:1 1 260px;min-width:0" value="' +
    esc(((window.CBOffline && CBOffline.loadDraft('kyb.cred')) || {}).title || '') +
    '" oninput="saveKyb()"><button data-cbsid="KYB001-B01" class="pri" onclick="addCred()">Add</button></div><div id="nc_err" class="err"></div></div>';
  /* K4: what applies to THIS business first; the rest folded under "Other certificates" (the server says which: `applies`) */
  var mine = cr.filter(function (item) {
      return item.applies !== false;
    }),
    other = cr.filter(function (item) {
      return item.applies === false;
    });
  var one = function (c) {
    var exp = c.expired
      ? '<span class="exp gone">expired</span>'
      : c.expiring
        ? '<span class="exp soon">expires in ' + esc(String(c.days_left)) + 'd</span>'
        : '';
    return (
      '<div class="cred"><span class="nm">' +
      esc(c.title) +
      '</span>' +
      (c.valid_until ? '<span class="asof">to ' + esc(String(c.valid_until).slice(0, 10)) + '</span>' : '') +
      exp +
      rungChip(c.rung) +
      '</div>'
    );
  };
  var list =
    (mine.length ? mine.map(one).join('') : '<div class="empty">No credentials yet. Add one above.</div>') +
    (other.length
      ? '<details class="other" data-testid="kyb-other"><summary style="cursor:pointer;font-size:12.5px;font-weight:700;padding:9px 4px">Other certificates (' +
        other.length +
        ') &mdash; for other countries or trades</summary>' +
        other.map(one).join('') +
        '</details>'
      : '');
  node.innerHTML =
    '<div class="card"><div class="row" style="justify-content:space-between"><b style="font-size:14px">What you hold</b><span class="note">' +
    (s.held || 0) +
    ' held &middot; ' +
    (s.verified || 0) +
    ' verified &middot; ' +
    (s.documented || 0) +
    ' documented &middot; ' +
    (s.declared || 0) +
    ' declared' +
    (s.expiring ? ' &middot; ' + s.expiring + ' expiring' : '') +
    '</span></div>' +
    list +
    '</div>' +
    add +
    '<div class="note" style="padding:0 4px">' +
    esc((reply.j && reply.j.note) || '') +
    '</div>';
}
async function addCred() {
  var t = ((el('nc_title') || {}).value || '').trim();
  if (!t) {
    el('nc_err').textContent = 'Enter a name';
    return;
  }
  if (!window.CBOffline) {
    var reply = await api('POST', '/api/kyb/credential', { title: t });
    if (reply.status === 200) {
      load();
    } else {
      el('nc_err').textContent = (reply.j && reply.j.message) || 'Failed';
    }
    return;
  }
  var res = await CBOffline.submit({ method: 'POST', path: '/api/kyb/credential', body: { title: t } });
  CBOffline.clearDraft('kyb.cred');
  if (res.queued) {
    if (el('nc_title')) el('nc_title').value = '';
    el('nc_err').innerHTML = '<span class="note">⏳ Offline — queued; it\'ll be added when you\'re back online.</span>';
  } else if (res.ok) {
    load();
  } else {
    el('nc_err').textContent = 'Failed (' + res.status + ')';
  }
}

// ── POSITION (directional selling avenues) ──
async function renderPosition(node) {
  var reply = await api('GET', '/api/kyb/position'); /* CMP-1: the server's stated country and trade (readiness.laneOf), never paint / India */
  if (reply.status === 401) {
    TOK = null;
    return loginView('Session expired');
  }
  var f = (reply.j && reply.j.facts) || {},
    reach = f.reach || {},
    lanes = f.lanes || [];
  var buckets =
    '<div class="bucket now"><div class="bh" style="color:var(--ok)">✓ Reachable now</div>' +
    ((reach.reachable_now || []).length
      ? (reach.reachable_now || [])
          .map(function (x) {
            return '<span class="pill">' + esc(x.dest) + '</span>';
          })
          .join('')
      : '<span class="note">none yet</span>') +
    '</div>' +
    '<div class="bucket step"><div class="bh" style="color:var(--blue)"><span class=arw>→</span> One step away</div>' +
    ((reach.one_step || []).length
      ? (reach.one_step || [])
          .map(function (x) {
            return '<span class="pill">' + esc(x.dest) + ' <span class="note">&mdash; needs ' + esc(x.needs || '') + '</span></span>';
          })
          .join('')
      : '<span class="note">none</span>') +
    '</div>' +
    '<div class="bucket struct"><div class="bh" style="color:var(--wall)">■ Structural (not now)</div>' +
    ((reach.structural || []).length
      ? (reach.structural || [])
          .map(function (x) {
            return '<span class="pill">' + esc(x.dest) + ' <span class="note">&mdash; ' + esc((x.blocked_by || []).join(', ')) + '</span></span>';
          })
          .join('')
      : '<span class="note">none</span>') +
    '</div>';
  var laneHtml = lanes
    .map(function (item) {
      var gaps = (item.gaps || [])
        .map(function (entry) {
          return (
            '<div class="gap"><span class="k ' +
            entry.kind +
            '">' +
            esc(entry.kind) +
            '</span>' +
            esc(entry.title) +
            (entry.kind === 'closeable' ? ' <span class="note">(' + esc(String(entry.unlocks)) + ' market' + (entry.unlocks > 1 ? 's' : '') + ')</span>' : '') +
            (entry.kind === 'structural' ? ' <span class="note">&mdash; ' + esc(entry.note || '') + '</span>' : '') +
            '</div>'
          );
        })
        .join('');
      return (
        '<div class="lane"><div class="row" style="justify-content:space-between"><b>' +
        esc(item.dest_name) +
        '</b><span class="note">' +
        esc(String(item.readiness_pct)) +
        '% &middot; ' +
        item.met +
        '/' +
        item.total +
        ' met</span></div><div class="bar"><i style="width:' +
        Math.max(2, item.readiness_pct) +
        '%"></i></div>' +
        (gaps || '<span class="note">nothing missing</span>') +
        '</div>'
      );
    })
    .join('');
  node.innerHTML =
    '<div class="card"><b style="font-size:14px">Where you can sell &mdash; directionally</b>' +
    buckets +
    '</div><div class="card"><div class="sec" style="margin-top:0">Per market</div>' +
    (laneHtml || '<div class="empty">No lanes.</div>') +
    '</div><div class="note" style="padding:0 4px">' +
    esc((reply.j && reply.j.note) || '') +
    '</div>';
}

// ── RISK ──
async function renderRisk(node) {
  var reply = await api('GET', '/api/kyb/risk');
  if (reply.status === 401) {
    TOK = null;
    return loginView('Session expired');
  }
  var f = (reply.j && reply.j.facts) || {},
    list = f.exposures || [],
    conc = f.concentration || {};
  var exHtml = list.length
    ? list
        .map(function (e) {
          return (
            '<div class="expo ' +
            (e.severity === 'high' ? 'high' : '') +
            '"><div class="f">' +
            esc(e.fact) +
            '</div><div class="d">' +
            esc(e.detail || '') +
            '</div></div>'
          );
        })
        .join('')
    : '<div class="empty">No exposures flagged from your current data. Good &mdash; or too little history yet.</div>';
  var parties = (conc.parties || [])
    .map(function (item) {
      return '<div class="cred"><span class="nm">' + esc(item.counterparty) + '</span><span class="note">' + esc(String(item.pct)) + '%</span></div>';
    })
    .join('');
  node.innerHTML =
    '<div class="card"><b style="font-size:14px">Where your exposure sits</b><div style="margin-top:8px">' +
    exHtml +
    '</div><div class="disclaim">' +
    esc((reply.j && reply.j.note) || '') +
    '</div></div>' +
    (parties
      ? '<div class="card"><div class="sec" style="margin-top:0">Business by counterparty (' + (conc.chits || 0) + ' records)</div>' + parties + '</div>'
      : '');
}

// ── FIELD (walled off) ──
async function renderField(node) {
  node.innerHTML =
    '<div class="wallcard"><div class="wallbanner">⚠ Looks OUTWARD &mdash; unverified. Everything here is found on the web; verify at the source before you act. This never returns buyers to contact &mdash; only where demand is and whether you can reach it.</div>' +
    '<b style="font-size:14px">Where&rsquo;s the demand &mdash; and can you reach it?</b><div class="note" style="margin:5px 0 10px">One search, narrowed by your own profile (categories, credentials, appetite). Metered; the same profile the same day is free.</div>' +
    '<button data-cbsid="KYB001-B02" class="pri" onclick="runField()">Run field search</button><div id="fld" style="margin-top:12px"></div></div>';
}
async function runField() {
  var host = el('fld');
  host.innerHTML = '<div class="note">Searching (narrowed by your profile)…</div>';
  var reply = await api('POST', '/api/kyb/field');
  if (reply.status === 401) {
    TOK = null;
    return loginView('Session expired');
  }
  var j = reply.j || {};
  if (j.configured === false) {
    host.innerHTML = '<div class="note" style="font-style:italic">' + esc(j.note || 'Field search not connected yet.') + '</div>';
    return;
  }
  var res = j.results || [];
  var html = res.length
    ? res
        .map(function (x) {
          return (
            '<div class="fres"><b>' +
            esc(x.market) +
            '</b> ' +
            rungChip('declared') +
            '<div class="note">' +
            esc(x.demand || '') +
            '</div>' +
            (x.source_url
              ? '<a href="' +
                esc(x.source_url) +
                '" target="_blank" rel="noopener">source</a> <span class="asof">as of ' +
                esc(String(x.as_of).slice(0, 10)) +
                '</span>'
              : '') +
            '</div>'
          );
        })
        .join('')
    : '<div class="empty">No demand signals returned.</div>';
  host.innerHTML =
    html + '<div class="note" style="margin-top:8px;font-style:italic">' + esc(j.note || '') + (j.cached ? ' &middot; (cached &mdash; free)' : '') + '</div>';
}

if (window.CBOffline) {
  CBOffline.configure({
    apiBase: API,
    token: function () {
      return TOK;
    },
    onChange: paintPill
  });
  CBOffline.registerSW();
}
var FRAME = CBFrame.mount({ app: 'kyb', work: document.querySelector('.wrap') });
TOK = FRAME.token;
if (TOK) {
  TAB = tabFromHash();
  shell();
  load();
} else {
  el('app').innerHTML = '<div class="card"><div class="empty">Sign in above to continue.</div></div>';
}
</script>
</body>
</html>
