     FLOW  load → shopFrame (CBFrame bar) → the catalogue read → paint → cart → order (POST /api/orders)
     CARD storefront-and-catalogue/storefront -->

<script>
var API = new URLSearchParams(location.search).get('api') || window.CB_API;
/**
 * ⭐⭐ ?s= IS THE PUBLIC HANDLE (a User ID); ?bridge= IS THE OLD INTERNAL KEY, KEPT SO EXISTING LINKS STILL OPEN.
 *
 * ⚠️⚠️ THE APP HAS BEEN BUILDING LINKS AS /shop.html?s=<user_id> WHILE THIS READ ONLY ?bridge=. Every one of
 * those links landed on "No shop specified" — a dead link with a perfectly plausible shape, which is exactly
 * why it survived: the storefront row rendered, the URL looked right, and the failure was on a page nobody
 * opens while working on the app.
 *
 * The server resolves either form (resolveEntity in routes/catalogue.js), so this variable stays the one
 * "who is this shop" value and nothing downstream changes.
 */
/* ?item=<item_id>: ONE product, as the customer sees it — the product page's Storefront row frames this. Same
   renderer, same offers, same cart; only the shop header and the rest of the list are left out. Athi, 2026-09-05:
   "not the entire link — how this product will look in front of the user". */
var _ONLY = (new URLSearchParams(location.search).get('item') || '').trim();
/* ?preview=1: the OWNER looking at their own shop from the product page. The frame is same-origin with the app, so the
   session is in localStorage; it goes as a bearer and the API lets the owner through a private gate (preview:true). */
var _PREVIEW = (new URLSearchParams(location.search).get('preview') || '') === '1';
function _ownerToken() {
  try {
    var parsed = JSON.parse(localStorage.getItem('cb_sess') || 'null');
    return (parsed && parsed.token) || null;
  } catch (e) {
    return null;
  }
}
var BRIDGE = (new URLSearchParams(location.search).get('s') || new URLSearchParams(location.search).get('bridge') || '').trim();
var _FIN = [];
var _ord = null;
var _lg = {};
var _SHOPDATA = null;
// SPEC-negotiation-position — how this shop takes orders, from the API (never assumed). Decides what the customer is
// asked for and therefore what data the business gets back. Unknown/absent → 'cart' (every existing shop unchanged).
var _OI = {
  preset: 'cart',
  pipeline: 'commerce',
  showsPrice: true,
  negotiable: false,
  schema: { type: 'object', properties: { quantity: { type: 'number' } } }
};
var _METHOD = 'cart'; // the preset name, kept for readability
// ONE CATALOGUE ENTRY = ONE FORM. A store may offer ITR-2 and a Commercial Invoice; each item carries its OWN
// declaration, merge-patched over the catalogue's (RFC 7386 — the item wins, because it is the more specific one).
// The customer must see the fields of the template THEY picked. The server re-resolves the same way at submit.
var _OIC = null; // the declaration for the item currently open
function _mergePatch(nestedT, p) {
  if (p === null || typeof p !== 'object' || Array.isArray(p)) return p;
  var o = nestedT && typeof nestedT === 'object' && !Array.isArray(nestedT) ? Object.assign({}, nestedT) : {};
  for (var k in p) {
    if (!Object.prototype.hasOwnProperty.call(p, k)) continue;
    if (p[k] === null) delete o[k];
    else o[k] = _mergePatch(o[k], p[k]);
  }
  return o;
}
function _oiFor(it) {
  var d = it && it.order_input;
  return d ? _mergePatch(_OI, d) : _OI;
}
function _cur() {
  return _OIC || _OI;
}
function _isNegotiable() {
  return !!_cur().negotiable;
}
function _showsPrice() {
  return _cur().showsPrice !== false && _cur().pipeline !== 'payload';
}
function _isPayload() {
  return _cur().pipeline === 'payload';
}
function _submitLabel() {
  return _isPayload() ? (_cur().preset === 'form' ? 'Submit' : 'Send enquiry') : _isNegotiable() ? 'Make an offer' : t('order');
}
/* the declared field's kind: the page's own words for a type, the library's names for the part */
function _schemaKind(declared) {
  if (declared.type === 'boolean') return 'checkbox';
  if (declared.maxLength && declared.maxLength > 200) return 'long';
  return declared.type === 'number' || declared.type === 'integer' ? 'number' : 'text';
}
/* CMP055 (ui.field): the label, the Required word, the hint and the 44 px control come from the library; id, testid and value are the page's own, as before.
   The provenance chip ("from your <document>") is the hint now: a reader hears it with the field. */
function _schemaField(item, declared, current, required, provenance) {
  return ui.field({
    mount: 'SHP001-U01',
    kind: _schemaKind(declared),
    id: 'f_' + item,
    key: item,
    testid: 'shop-f-' + item,
    label: item.replace(/_/g, ' '),
    required: required,
    hint: provenance ? 'From your ' + provenance.from : undefined,
    value: declared.type === 'boolean' ? !!current : current,
    maxlength: declared.maxLength && declared.maxLength <= 200 ? declared.maxLength : undefined
  });
}
// ── render the DECLARED fields — same subset the server validates (type · enum · maxLength · required) ──
function _schemaFields(schema, vals) {
  var props = (schema && schema.properties) || {},
    req = (schema && schema.required) || [];
  var fld = 'style="width:100%;padding:9px;border:1px solid #e7e3d8;border-radius:8px;margin:3px 0 11px;font-size:14px"';
  return Object.keys(props)
    .map(function (item) {
      var p = props[item] || {},
        v = vals && vals[item] != null ? vals[item] : '';
      // PROVENANCE, shown to the customer: which document a value came from, and which line of it. They can still
      // change anything — a read value is a suggestion, not a fact, until they send it.
      var src = _read[item];
      var label =
        esc(item.replace(/_/g, ' ')) +
        (req.indexOf(item) >= 0 ? ' <span style="color:#b4453f">*</span>' : '') +
        (src
          ? ' <span style="font-size:10px;color:#2e7a45;background:#eef7ee;border:1px solid #cfe6cf;border-radius:9px;padding:1px 6px" title="' +
            esc(src.label) +
            '">from your ' +
            esc(src.from) +
            '</span>'
          : '');
      var inp;
      if (Array.isArray(p.enum) && p.enum.length) {
        inp =
          '<select data-cbsid="SHP001-S01" id="f_' +
          esc(item) +
          '" data-testid="shop-f-' +
          esc(item) +
          '" ' +
          fld +
          '><option value=""></option>' +
          p.enum
            .map(function (entry) {
              return '<option value="' + esc(entry) + '"' + (String(entry) === String(v) ? ' selected' : '') + '>' + esc(entry) + '</option>';
            })
            .join('') +
          '</select>';
      } else {
        return _schemaField(item, p, v, req.indexOf(item) >= 0, src);
      }
      return '<label style="font-size:12px;color:var(--grey-3,#6a707a)">' + label + '</label>' + inp;
    })
    .join('');
}
// ── CARRIED DOCUMENTS (SPEC-document-carrying) — the submission is the filled form AND its proof. The input appears
// ONLY when the catalogue declares it; the server re-validates and is the authority (these checks are a courtesy so
// the customer learns about a 7 MB scan before uploading it, not after).
var _docs = []; // [{name, mime, data_base64, size}]
function _docDecl() {
  var o = _cur();
  return (o && o.documents) || null;
} // per-item: this template's own proof requirement
function _docBlock() {
  var d = _docDecl();
  if (!d) return '';
  var mb = function (n) {
    return (n / 1048576).toFixed(1) + ' MB';
  };
  var rows = _docs
    .map(function (item, index) {
      return (
        '<div style="display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 8px;border:1px solid #e7e3d8;border-radius:8px;margin-bottom:5px;background:#fbfaf7"><span style="flex:1">📎 ' +
        esc(item.name) +
        '</span><span style="color:#8a949c">' +
        esc(mb(item.size)) +
        '</span><button data-cbsid="SHP001-B01" onclick="_docRemove(' +
        index +
        ')" style="border:0;background:none;color:#b4453f;cursor:pointer;font-size:15px">×</button></div>'
      );
    })
    .join('');
  var full = _docs.length >= d.max;
  return (
    '<label style="font-size:12px;color:var(--grey-3,#6a707a)">' +
    esc(d.label) +
    (d.required ? ' <span style="color:#b4453f">*</span>' : ' <span style="color:#9aa3a7">· optional</span>') +
    '</label>' +
    '<div style="margin:3px 0 11px">' +
    rows +
    (full
      ? '<div style="font-size:11px;color:#8a949c">Maximum ' + d.max + ' reached.</div>'
      : ui.field({
          mount: 'SHP001-U02',
          kind: 'file',
          label: 'Attach ' + d.label.toLowerCase(),
          testid: 'shop-doc',
          accept: d.accept.join(','),
          hint:
            d.accept
              .join(' · ')
              .replace(/application\//g, '')
              .replace(/image\//g, '') +
            ' · up to ' +
            d.max +
            ' file(s)',
          onChange: function (value, input, event) {
            _docPick(event);
          }
        })) +
    '</div>'
  );
}
// ── READ THE DOCUMENT (the handshake, in the browser) ────────────────────────────────────────────────────────
// The catalogue declares WHICH documents it can read and WHERE each value sits — as a LITERAL LABEL plus a type,
// never a regex, so a shop cannot ship catastrophic backtracking to its own customers. The reader escapes the label
// and builds the pattern itself.
//
// It runs HERE, in the customer's browser, on purpose: it is their own document, it never has to reach a server to
// be read, and the extracted values are their ASSERTION — exactly as if they had typed them. The document's sha256
// is the proof, and the shop can always open the PDF and check. Nobody is asked to trust an extractor.
var _pdfjs = null;
function _loadPdfjs() {
  if (_pdfjs) return Promise.resolve(_pdfjs);
  // ~1.8 MB, fetched ONLY when a customer attaches a readable document to a catalogue that declares a source.
  return import('/app/vendor/pdf.min.mjs').then(function (reply) {
    reply.GlobalWorkerOptions.workerSrc = '/app/vendor/pdf.worker.min.mjs';
    _pdfjs = reply;
    return reply;
  });
}
var _VALUE_RE = { number: '([0-9][0-9,]*\\.?[0-9]*)', code: '([A-Z0-9]{4,15})', year: '([0-9]{4}-[0-9]{2})', string: '([^\\n]{1,60}?)(?=\\s{2,}|$)' };
function _escRe(s) {
  return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}
function _srcsFor() {
  var o = _cur();
  return (o && o.sources) || null;
}
function _srcForMime(mime) {
  var ss = _srcsFor() || [];
  for (var index = 0; index < ss.length; index++) {
    if ((ss[index].accept || []).indexOf(mime) >= 0) return ss[index];
  }
  return null;
}

async function _readDocument(file, src) {

      }
      _SHOPDATA = res.j;
      var gated = (res.j.sign_in && res.j.sign_in.code === 'sign_in_first') || (!_MYTOK && res.j.shop && res.j.shop.storefront_access === 'login');
      if (gated) renderLoginGate(res.j.shop || {});
      else {
        _lg = {};
        render(res.j);
        shopScrollRestore(); /* a Back from an item page lands where the list was left */
      }
    })
    .catch(function (e) {
      el('app').innerHTML = '<div class="msg">Could not reach the shop. ' + esc(e.message || '') + '</div>';
    });
}
</script>
</body>
</html>
