  const item = NAV.find((entry) => entry[0] === 'gstclose');

function navPaint(active) {
  taxCloseWord(); /* the menu names the shop's own tax: GST · VAT · Consumption tax close & pay ("Tax close & pay" when no pack is known) */
  const byId = Object.fromEntries(NAV.map((item) => [item[0], item])),

  $('nav').innerHTML = NAV_GROUPS.map(([text, ids]) => {

  }).join('');

    )
    .join('');
}

/* ═══ BILLS — the two system folders (GET /api/folders → B-2100 Received, B-1300 Issued) as two tabs ═════════════ */
/* the step chip's colour by the step the SERVER names (bill.step); the words are the server's label — the page never decides a step */
const STEP_TONE = { received: '', goods_checked: 'blue', accepted: 'amber', disputed: 'red', issued: '', closed: 'green' };
/* a bill is a CBList row (list-ctl.js): Supplier / Customer · Bill no · Amount · Date · Step — the step chip is the server's word. Its click opens the sheet; its next level says who took it and when. */
function accBillCols() {
  const dash = '<span style="color:var(--muted)">—</span>',
    received = ACC.billTab === 'B-2100';
  return [
    {
      key: 'who',
      label: received ? 'Supplier' : 'Customer',
      prio: 1,
      sort: 'who',
      w: 300,
      html: true,
      cell: (c) => esc(c.counterparty_name || c.manual_subject || c.auto_subject || '') || dash
    },
    {
      key: 'no',
      label: 'Bill no',
      prio: 4,
      sort: 'no',
      w: 170,
      html: true,
      cell: (c) => (c.bill_no ? '<span class="mono">' + esc(c.bill_no) + '</span>' : dash)
    },
    {
      key: 'amount',
      label: 'Amount',
      prio: 3,
      sort: 'amount',
      num: true,
      w: 150,
      html: true,
      cell: (c) => (c.value != null && c.value !== '' ? esc(CBLocale.money(Number(c.value), c.currency || bkCur())) : dash)
    },
    {
      key: 'date',
      label: 'Date',
      prio: 5,
      sort: 'date',
      w: 130,
      html: true,
      cell: (c) => {
        const d = c.created_at || (c.bill || {}).at;
        return d ? esc(bkDate(d)) : dash;
      }
    },
    {
      key: 'step',
      label: 'Step',
      prio: 2,
      sort: 'step',
      w: 240,
      html: true,
      cell: (c) => {
        const b = c.bill || {};
        return b.label
          ? `<span class="step ${STEP_TONE[b.step] || ''}" data-testid="bill-step-${esc(c.chit_id)}" data-step="${esc(b.step || '')}">${esc(b.label)}</span>`
          : dash;
      }
    }
  ];
}
function accBillNext(c) {
  const b = c.bill || {};
  /* who accepted: the person's NAME (the field the other rows show), never their user id — the id is the last resort */
  const by =
    b.by_name ||
    b.by_display_name ||
    ((c.all_recipients || []).find((x) => x && [x.user_id, x.handle, x.entity_handle, x.bridge_id].indexOf(b.by) >= 0 && x.display_name) || {}).display_name ||
    b.by;
  const rows = [
    c.manual_subject || c.auto_subject ? [tx('Subject'), esc(c.manual_subject || c.auto_subject)] : null,
    by ? [tx('By'), esc(by)] : null,
    b.at ? [tx('Step on'), esc(bkDate(b.at))] : null
  ].filter(Boolean);
  return (
    '<div data-testid="bill-next-' +
    esc(c.chit_id) +
    '">' +
    (rows.length
      ? rows.map((item) => CBList.nextRow(['<span style="color:var(--muted)">' + item[0] + '</span> ' + item[1]], [])).join('')
      : '<div style="color:var(--muted);font-size:var(--fs-1)">' + esc(tx('Nothing more is recorded')) + '</div>') +
    '</div>'
  );
}
/** E19: the books' Dues beside the open bill chits - a party the books owe (or are owed) that holds no open chit is a row of its own ("In your books"); nothing is added up from chits */
/** the open bill chits of a folder read (api() may collapse {chits:[…]} to the array) */
function billChitList(rows) {
  return Array.isArray(rows) ? rows : (rows && (rows.chits || rows.rows || rows.data)) || [];
}
async function accBillsFromBooks(folder, list) {
  const supplierSide = folder.code === 'B-2100',
    owed = await api('booksDues', { query: { side: supplierSide ? 'supplier' : 'customer' } }).catch((failure) => {
      if (typeof cbQuiet === 'function') cbQuiet('accounts: the books dues were not read, the chit rows stand alone', failure);
      return null;
    }),
    dueParties = ((owed && owed.parties) || []).filter((p) => Number(p.balance_minor) !== 0),
    haveChit = new Set(list.map((c) => String(c.counterparty_name || '').trim().toLowerCase())),
    bookRows = dueParties
      .filter((p) => !haveChit.has(String(p.name || '').trim().toLowerCase()))
      .map((p) => ({ chit_id: 'books-' + p.party_id, books: true, counterparty_name: p.name, currency: owed.currency, value: Math.abs(Number(p.balance_minor)) / Math.pow(10, bkDec(owed.currency)), created_at: p.oldest_due, bill: { label: tx('In your books') } })),
    rowsAll = list.concat(bookRows),
    booksSide = !list.length && dueParties.length ? { n: dueParties.length, minor: Math.abs(Number(owed.total_minor) || 0), cur: owed.currency, supplier: supplierSide } : null,
    booksLine = dueParties.length
      ? '<p data-testid="bills-books-total" style="margin:8px 0;color:var(--muted)">' + esc(bkMoney(Math.abs(Number(owed.total_minor) || 0), owed.currency) + ' ' + (supplierSide ? tx('is owed to suppliers in your books') : tx('is owed to you in your books')) + ' (' + dueParties.length + ')') + '</p>'
      : '';
  return { rowsAll, booksSide, booksLine };
}
async function accBills(body) {
  try {
    /* the folder list arrives through cap-folders.js's own splitter (_foldersFrom → UI.sysFolders), as the app reads it */
    _foldersFrom(await api('foldersList'));
    const sys = (UI.sysFolders || [])
      .filter((item) => item.code === 'B-2100' || item.code === 'B-1300')
      .sort((first, second) => (first.code === 'B-2100' ? -1 : 1) - (second.code === 'B-2100' ? -1 : 1));
    if (!sys.length) {
      body.innerHTML = emptyState('🧾', tx('No bills folders'), '');
      return;
    }
    if (!sys.some((item) => item.code === ACC.billTab)) ACC.billTab = sys[0].code;
    const cur = sys.find((item) => item.code === ACC.billTab);
    const rows = await api('folderChits', { params: { id: cur.folder_id }, query: { state: 'open' } });
    /* ⚠️ api() collapses {chits:[…]} to the array (see loadFolderChits) */
    const list = billChitList(rows);
    /* E19 (decided by practice: Xero's Bills to pay reads the payables ledger): the figure and the rows come from the BOOKS, the one GET /dues Dues paints (nothing is added up from chits).
       A party with an open bill CHIT keeps its chit rows (pay, open the chit); a party the books owe or are owed that holds no open chit is a row of its own ("In your books"), so a loader's or a move-in's bills show here as they do in Dues. */
    const { rowsAll, booksSide, booksLine } = await accBillsFromBooks(cur, list);
    const word = (f) => (f.code === 'B-2100' ? 'Received' : 'Issued');
    const tabs =
      '<div class="tabs" role="group">' +
      sys
        .map(
          (item) =>
            `<button data-cbsid="BKS001-B04" type="button" class="tab" data-testid="bills-tab-${esc(item.code)}" data-code="${esc(item.code)}" aria-pressed="${item.code === ACC.billTab}">${word(item)}<span class="n">${Number(item.count) || 0}</span></button>`
        )
        .join('') +
      '</div>';
    const by = (f, num) => (a, b) => (num ? f(a) - f(b) : String(f(a)).localeCompare(String(f(b)), undefined, { numeric: true }));
    body.innerHTML = tabs + booksLine + '<div id="bkl_bills" data-testid="bills-list"></div>';
    CBList.reset('bills'); /* the Received and the Issued tab are two lists: a search or an open row does not carry across */
    CBList.mount($('bkl_bills'), {
      key: 'bills',
      t: tx,
      rows: () => rowsAll,
      id: (c) => c.chit_id,
      columns: accBillCols(),
      rowTid: (c) => 'bill-' + c.chit_id,
      /* WX-O2C (2026-10-13): all five by default — the top-3-by-prio default hid the Bill no and the Date at 1366 beside empty space,
         and the number is what a shopkeeper reads a bill by. Narrower containers still drop to cards (CBList). */
      defaultCols: ['who', 'no', 'amount', 'date', 'step'],
      /* a bill's row opens its sheet; its caret opens who took it and when */
      onOpen: (c) => (c.books ? undefined : openChitSheet(c.chit_id)),
      search: (c) => [c.counterparty_name, c.bill_no, c.manual_subject, c.auto_subject, (c.bill || {}).label, c.value].join(' '),
      sorts: [
        { key: 'date', label: tx('Newest first'), cmp: (a, b) => String(b.created_at || '').localeCompare(String(a.created_at || '')) },
        { key: 'who', label: tx('Name'), cmp: by((c) => c.counterparty_name || '') },
        { key: 'no', label: tx('Bill no'), cmp: by((c) => c.bill_no || '') },
        { key: 'amount', label: tx('Amount'), cmp: by((c) => Number(c.value) || 0, true) },
        { key: 'step', label: tx('Step'), cmp: by((c) => (c.bill || {}).label || '') }
      ],
      next: accBillNext,
      empty: booksSide
        ? { title: tx('No bill chits are open'), sub: ' ' + bkMoney(booksSide.minor, booksSide.cur) + ' ' + (booksSide.supplier ? tx('is owed to suppliers in your books') : tx('is owed to you in your books')) + ' (' + booksSide.n + '). ' + tx('See') + ' ' + tx(booksSide.supplier ? 'Payables' : 'Receivables') + '.' }
        : { title: tx('Nothing open') }
    });
  } catch (e) {
    body.innerHTML = bkErr(e);
  }
}

/* ═══ TO DO — what the owner has to do next. GET /api/books/todo lists the checks (docs/design/cb-accounts-ia §1): a row is a symbol · a count · the server's sentence · ONE button.
   The page decides nothing: it draws what the API sends, and opens the page the row's action names. ═══ */
/* the API's `action.screen` → the tab that opens it. A screen with no page yet is not in here: its button says it starts after an update. */
const TODO_SCREEN = {
  waiting: 'waiting',
  ledgers: 'ledgers',
  periods: 'lock',
  daybook: 'daybook',
  dues: 'receivables',
  cheques: 'cheques',
  bills: 'bills',
  packs: 'packs',
  opening: 'opening',
  'closing-stock': 'closingstock',
  gst: 'gstclose',
  recurring: 'accruals',
  accruals: 'accruals',
  'year-close': 'yearclose',
  assets: 'assets',
  bank: 'bank'
};
/* an item the server could not check (503 · not migrated yet) is not a task: it says so, and its button waits */
const todoOff = (it) => it && (it.status === 503 || it.not_migrated === true || it.migrated === false || it.available === false);
function todoGo(i) {
  const it = ACC.todo && ACC.todo[i];
  if (!it) return;
  const tab = TODO_SCREEN[(it.action || {}).screen];
  if (tab) show(tab);
  else toast(tx('This starts after an update'));
}
/* the row's one button — only when the server named an action; a row with none (bills not in the books) is a count and a sentence, no dead button */
function todoButton(item, index, notChecked) {
  const action = item.action || {};
  if (!action.screen && !action.label) return '';
  return `<button data-cbsid="BKS001-B05" type="button" class="act todo-go" data-testid="todo-go-${esc(item.kind)}" data-i="${index}"${notChecked ? ' disabled' : ''}>${esc(action.label || tx('Open'))}</button>`;
}
/* one To do row: symbol · count · sentence · the button when there is one */
function todoRow(item, index) {
  const notChecked = todoOff(item);
  return `<div class="todo-row${notChecked ? ' off' : ''}" data-testid="todo-row-${esc(item.kind)}" data-kind="${esc(item.kind)}">
    <span class="todo-sym" aria-hidden="true">${notChecked ? '⏳' : '⚠'}</span>
    <span class="todo-n mono" data-testid="todo-n-${esc(item.kind)}">${notChecked ? '' : Number(item.count) || 0}</span>
    <span class="todo-words" data-testid="todo-words-${esc(item.kind)}">${esc(notChecked ? tx('Starts after an update') : item.words)}</span>
    ${todoButton(item, index, notChecked)}
  </div>`;
}
async function accTodo(body) {
  const g = ACC.gen;
  try {
    const reply = await api('booksTodo');
    if (g !== ACC.gen) return;
    const list = (Array.isArray(reply) ? reply : (reply && (reply.items || reply.todo)) || []).slice();
    /* BR1: the bank lines that need a person — counted on THIS device (the statement never reaches the server), drawn by the same row */
    const bank = typeof bankTodoItem === 'function' && !CBBooksActing.hides('bank') ? bankTodoItem() : null;
    if (bank && !list.some((x) => x.kind === 'bank')) list.push(bank);
    ACC.todo = list;
    body.innerHTML = list.length
      ? '<div class="todo" data-testid="todo-list">' + list.map(todoRow).join('') + '</div>'
      : '<div class="todo-ok" data-testid="todo-none">✓ ' + esc(tx('Books up to date')) + '</div>';
    body.querySelectorAll('.todo-go').forEach((item) => {
      item.onclick = () => todoGo(+item.getAttribute('data-i'));
    });
  } catch (e) {
    body.innerHTML = e && e.status === 503 ? '<div class="todo-ok off" data-testid="todo-503">⏳ ' + esc(tx('Starts after an update')) + '</div>' : bkErr(e);
  }
}

/* a table becomes one card per row on a phone: each cell is named by its column head (SYSTEM rule 8) */
function cardLabels(root) {
  root.querySelectorAll('table.bktab').forEach((item) => {
    const heads = Array.from(item.querySelectorAll('thead th')).map((node) => node.textContent.trim());
    item.querySelectorAll('tbody tr, tfoot tr').forEach((tr) => {
      let col = 0;
      Array.from(tr.children).forEach((td) => {
        if (!td.hasAttribute('data-l') && heads[col]) td.setAttribute('data-l', heads[col]);
        col += td.colSpan || 1;
      });
    });
  });
}
new MutationObserver(() => cardLabels($('content'))).observe($('content'), { childList: true, subtree: true });

    });
}
/* the Ledger is off: ONE card. The owner switches it on here (CBLedger — the same words, confirm and call as Settings and the
   index tile); anyone else is told whom to ask. */
function offCard() {
  ON = false;
  navPaint('');
  $('nav').innerHTML = '';
  card(
    `<h2 data-testid="acc-off">Accounts is not switched on</h2>` +
      (isOwner()
        ? `<button data-cbsid="BKS001-B07" type="button" class="act" data-testid="acc-switch-on" id="switchOn">Switch on</button>`
        : `<p data-testid="acc-ask-owner">Ask the owner to switch it on</p>`)
  );
  const node = $('switchOn');
  if (node)
    node.onclick = () =>
      CBLedger.run(true, {
        ask: confirmAsk,
        working: () => {
          node.disabled = true;
          node.textContent = 'Working…';
        },
        call: (on) => CBLedger.call({ api: api }, on),
        done: () => start(),
        failed: (e) => {
          node.disabled = false;
          node.textContent = 'Switch on';
          toast(tx('Could not switch it on.') + ' ' + friendlyErr(e));
        }
      });
}
function failedCard(failure) {
  card('<div id="retry" data-testid="acc-failed"></div>', true);
  CBShell.readFailed($('retry'), { what: tx('Accounts'), status: failure && failure.status, detail: failure && failure.status === 403 && failure.data ? failure.data.detail || failure.data.message : '', retry: () => start() });
}
/* ⭐ CS1: the country decides whether books may open here — a country with no pack (or no country, or the setup still to do) is SAID in the
   server's own sentence (engines regulation.status, 422 with a code), never the quiet 404 and never India's rules by default. The one button
   that fixes it is the Country setup step; a co-assist is told whom to ask. Selling and the rail still work. */
function countryCard(d) {
  ON = false;
  navPaint('');
  $('nav').innerHTML = '';
  const pending = d && d.code === 'COUNTRY_SETUP_PENDING';
  card(
    `<h2 data-testid="acc-country">${pending ? 'Country setup first' : 'No books here yet'}</h2>
    <p data-testid="acc-country-why">${esc((d && d.message) || '')}</p>` +
      (isOwner()
        ? `<a class="act" data-testid="acc-country-setup" href="/settings.html#/country">${pending ? 'Country setup' : 'See country setup'}</a>`
        : `<p data-testid="acc-ask-owner">Ask the owner</p>`)
  );
}

/* ═══ START ═══════════════════════════════════════════════════════════════════════════════════════════════════ */
/** T7: a screen the address names that this seat cannot open (#/returns on a client's books) is SAID, never swapped for another tab; true = said */
function seatClosed() {
  const asked = hashPageOf(), acting = CBBooksActing.current();
  if (acting && acting.role !== 'owner' && asked && !NAV.some((item) => item[0] === asked)) {
    card('<div id="seat_closed" data-testid="acc-seat-closed"></div>', true);
    CBShell.readFailed($('seat_closed'), { what: '', status: 403, detail: tx('This screen is not open to your seat. Nothing was opened.'), back: { href: CBBooksActing.clientAddress(acting.store), label: tx('Back to this client') } });
    return true;
  }
  return false;
}
/** /me says whether the Ledger is on (ledger_on); a failed read is UNKNOWN, never "off" — start() falls through to the old probe, whose 404 is the only "off" */
async function readProfile() {
  try {
    const mine = await api('me');
    return (mine && mine.entity) || mine || {};
  } catch (failure) {
    if (typeof cbQuiet === 'function') cbQuiet('accounts: /me was not read, the ledger probe decides', failure);
    return {};
  }
}
/** the ledger's health answer into the page: waiting, year, currency, country (CX0) */
function noteHealth(reply) {
  const health = reply || {};
  BK.waiting = health.waiting || [];
  if (health.year) BK.year = health.year; /* the shop's year — cap-books bkFyNow / bkMonths paint it, never an April of their own */
  if (health.currency) BK.cur = health.currency; /* the ledger's money — bkCur's answer when a figure names none */
  ON = !!(reply && reply.enabled !== false);
  if (health.currency) SESSION.currency = health.currency; /* CX0: the ledger's currency (AUD · AED · INR) — Receive / Pay send it; 'INR' typed here refused an AU shop (routes/books.js:520) */
  const countryCode = health.country && health.country.country && health.country.country.code;
  if (countryCode) SESSION.country = countryCode; /* CX0: the shop's country (CS1 status) — the pack's words on this page (shopReg) */
}
/** ⭐ UI9: the WHOLE frame at once — the menu, the title and the rows' room — before anything is read; the views then fill only the rows. */
function paintFrame() {
  const f0 = hashPageOf(),
    v0 = NAV.some((item) => item[0] === f0) ? f0 : CBBooksActing.firstTab();
  chrome(v0);
  if (v0 !== 'ledgers')
    $('content').innerHTML = '<div class="bk-skel" aria-busy="true" data-testid="acc-skeleton"><i></i><i></i><i></i><i></i><i></i><i></i></div>';
}
async function start() {
  SESS = session(); CBBooksActing.fromAddress(location.search); /* ACC-176b: before the first read, so every request names the store */
  if (!SESS) return signedOut('');
  MINE = CBOnePerson.who(SESS);
  SESSION = Object.assign(
    { token: null },
    {
      entityId: MINE && MINE.ent,
      token: SESS.token,
      role: SESS.role,
      name: SESS.name,
      entity: SESS.entity,
      bridgeId: SESS.bridgeId,
      duty: SESS.duty,
      shop: SESS.shop
    }
  );
  whoPaint(); await CBBooksActing.openPage(CFG.API_BASE, SESS.token, NAV, NAV_GROUPS); /* ACC-176b: acting enters only on a live adviser grant (else leaves); the menu keeps the /api/books tabs */
  if (seatClosed()) return;
  const g = ++ACC.gen;
  paintFrame();
  /* ⭐ ONE BROWSER, ONE SHOP: nothing is read until this browser holds no other shop's fingerprint */
  let t;
  try {
    t = await CBOnePerson.traces(MINE);
  } catch (_) {
    t = { others: [] };
  }
  if (g !== ACC.gen || !MINE) return;
  if (t.others.length) return closeFirst(t);
  try {
    /* /me says whether the Ledger is on (ledger_on): GET /books/health answers 404 LEDGER_OFF by design, a failed request in the console on a shop with none */
    const profile = await readProfile();
    if (typeof profile.ledger_on === 'boolean' && !profile.ledger_on) return offCard(); /* an api that does not say (no ledger_on) is asked the old way below: 404 = off — never "off" for every shop */
    const reply = await api('booksHealth');
    noteHealth(reply);
  } catch (e) {
    if (e && e.status === 404) return offCard();
    if (e && e.status === 422 && e.data && /^(NO_COUNTRY_PACK|NO_COUNTRY|COUNTRY_SETUP_PENDING)$/.test(String(e.data.code || ''))) return countryCard(e.data);
    return failedCard(e);
  }
  if (!ON) return offCard();
  const first = hashPageOf();
  show(NAV.some((item) => item[0] === first) ? first : CBBooksActing.firstTab()); CBBooksActing.startPage($, enOpen, SESSION.currency, (tab) => ((NAV.find((item) => item[0] === tab) || NAV.find((item) => item[0] === CBBooksActing.firstTab()) || [])[1]) || ''); /* ACC-176b: a page opened to act for a store: banner, then the journal sheet that PREPARES */
}

/* ⭐ THE ONLY READER OF THE `storage` EVENT HERE: a session gone, or now another SHOP's, signs this page out and says why */
window.addEventListener('storage', (e) => {
  if (e.key !== null && e.key !== 'cb_sess') return;
  if (!MINE) return;
  const next = CBOnePerson.stored();
  if (next && next.ent === MINE.ent) return;
  signedOut(next ? 'Signed out — ' + CBOnePerson.shopName(next) + ' opened in another tab.' : 'Signed out — you signed out in another tab.');
});
/* the one-shop gate, attached the way the Labs attach it (offer-lab-next.html): this tab answers the roll and leaves when
   its shop is signed out or the browser is cleaned — to the home page, which reads nothing while that runs */
CBOnePerson.attach({
  quiet: true,
  who: () => MINE,
  label: () => 'Accounts',
  onLeave: (by) => {
    location.replace('/?left=' + encodeURIComponent(by || ''));
  },
  onWipe: () => {
    location.replace('/?cleaned=1');
  }
});
/* ⭐ THE # DECIDES THE PAGE (M138): Back, Forward and a typed or shared link land on the page the address says. chrome() writes the # with replaceState, which fires nothing, so a click never loops here. */
function hashView() {
  const v = hashPageOf();
  return NAV.some((item) => item[0] === v) ? v : null;
}
window.addEventListener('hashchange', () => {
  const v = hashView();
  if (v && ON && v !== BK.tab) show(v);
});
if (window.CBKural) CBKural.mount();
start();
</script>
