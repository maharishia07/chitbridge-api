<script>
var API = new URLSearchParams(location.search).get('api') || window.CB_API;

/**
 * ⚠️ THE SESSION COMES OFF DISK, exactly as the offer lab reads it. This page is a tool for somebody already
 * signed in on this browser; asking them to sign in twice would be asking for a second credential to reach data
 * the first one already opens.
 */
function sess() {
  try {
    return JSON.parse(localStorage.getItem('cb_sess') || 'null');
  } catch (_) {
    return null;
  }
}

var CASES = [],
  LAST = {},
  OPEN = {},
  RUN = null,
  STALE = {};
/**
 * ⭐⭐ "HOW MANY RAN NOW" (2026-10-07). Athi looked at the board and could not tell what the last run touched — LAST
 * keeps the WORST word per case, which is right for a verdict and says nothing about when. RAN_IN keeps, per case,
 * the run ids its latest results came from (the same /results read, no second fetch); the newest of RUNS is "the
 * last run". ranLast(c) is the one question both the header and the Ran column ask.
 */
var RAN_IN = {};
function lastRun() {
  return (typeof RUNS !== 'undefined' && RUNS && RUNS[0]) || null;
}
function ranLast(c) {
  var r = lastRun();
  return !!(r && (RAN_IN[c.case_key] || []).indexOf(r.run_id) >= 0);
}
/**
 * ⚠️ TRUE WHEN THE BOARD HAS NOTHING TO STAND ON — no cases at all, or cases and not one result. It changes
 * what the word "None." is allowed to mean: on a worked board it is good news, on an unworked one it means
 * nobody looked, and printing the good-news wording there is how an untested product reads as a clean one.
 * Set from the server's own §10 in paintReport, never re-derived from figures here.
 */
var REPORT_NO_EVIDENCE = false;

/* ── the run this sitting belongs to ─────────────────────────────────────────────────────────────────────────
 * ⭐ IT SURVIVES A RELOAD. A run is a sitting, and a sitting includes closing the tab to go and look at
 * something. Losing the run id on refresh would scatter one afternoon's testing across nine "runs". */
/** who is at the keyboard — a courtesy beside the identity, not a substitute for it */
function who() {
  try {
    return localStorage.getItem('cb_tester') || '';
  } catch (_) {
    return '';
  }
}
function saveWho() {
  var node = (document.getElementById('f_who').value || '').trim().slice(0, 60);
  try {
    if (node) localStorage.setItem('cb_tester', node);
    else localStorage.removeItem('cb_tester');
  } catch (_) {}
}

/**
 * ⭐ THE PROJECT (b292) — the sprint or project a result belongs to. Kept per browser like the tester, and sent
 * with every tap and every posted run. ⚠ Before b292 is run the server records the result WITHOUT it and says so
 * (project_not_written) — shown once, never swallowed.
 */
function proj() {
  try {
    return localStorage.getItem('cb_testproject') || '';
  } catch (_) {
    return '';
  }
}
function saveProj() {
  var node = (document.getElementById('f_proj').value || '').trim().slice(0, 80);
  try {
    if (node) localStorage.setItem('cb_testproject', node);
    else localStorage.removeItem('cb_testproject');
  } catch (_) {}
}
var PROJ_SAID = false;
function projectSaid(r) {
  if (r && r.project_not_written && !PROJ_SAID) {
    PROJ_SAID = true;
    say('Recorded without the project — projects are not switched on yet.', true);
  }
}

function loadRun() {
  try {
    RUN = JSON.parse(localStorage.getItem('cb_testrun') || 'null');
  } catch (_) {
    RUN = null;
  }
  if (!RUN || !RUN.id) RUN = { id: uuid(), label: '', kind: 'manual' };
  document.getElementById('f_run').value = RUN.label || '';
  document.getElementById('f_kind').value = RUN.kind || 'manual';
  document.getElementById('f_who').value = who();
  document.getElementById('f_proj').value = proj();
}
function saveRun() {
  RUN.label = document.getElementById('f_run').value.trim();
  RUN.kind = document.getElementById('f_kind').value;
  try {
    localStorage.setItem('cb_testrun', JSON.stringify(RUN));
  } catch (_) {}
}
function newRun() {
  RUN = { id: uuid(), label: '', kind: document.getElementById('f_kind').value };
  document.getElementById('f_run').value = '';
  saveRun();
  say('Started a new run. Results already recorded are untouched — nothing here is ever overwritten.');
}
function uuid() {
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
    var r = (Math.random() * 16) | 0;
    return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
  });
}

/** ⚠️ "3 minutes ago" is what a tester wants; a timestamp is what a log wants. */
function ago(iso) {
  if (!iso) return '';
  var s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 90) return 'just now';
  if (s < 5400) return Math.round(s / 60) + ' min ago';
  if (s < 172800) return Math.round(s / 3600) + ' h ago';
  return new Date(iso).toLocaleDateString();
}

async function call(path, opts) {
  var s = sess();
  if (!s || !s.token) throw new Error('Sign in to the app on this browser first, then reload this page.');
  var o = opts || {};
  var reply = await fetch(API + path, {
    method: o.method || 'GET',
    headers: Object.assign({ Authorization: 'Bearer ' + s.token }, o.body ? { 'Content-Type': 'application/json' } : {}),
    body: o.body ? JSON.stringify(o.body) : undefined
  });
  var j = await reply.json().catch(function () {
    return {};
  });
  if (!reply.ok) throw new Error(j.message || j.error || reply.status + '');
  return j;
}

function say(msg, bad) {
  var node = document.getElementById('main');
  var el = document.createElement('div');
  el.className = 'say';
  el.style.borderColor = bad ? '#eccbc9' : 'var(--line)';
  el.textContent = msg;
  node.insertBefore(el, node.firstChild);
  setTimeout(function () {
    if (el.parentNode) el.parentNode.removeChild(el);
  }, 6000);
}

/** ⭐ load the documented cases onto this shop's board — an upsert, so pressing it twice is safe */
/**
 * ⭐ THE PURE RULES, fetched from the same file the cases ship in. ⚠️ Not stored on the board as definitions:
 * they are not test cases, they are what the tests are ABOUT, and putting them in the case table would make
 * them countable as coverage.
 */
var ENGINE = null;
async function loadEngine() {
  if (ENGINE !== null) return;
  try {
    var r = await call('/api/testing/engine');
    ENGINE = r && r.engine ? r.engine : false;
    /* ⭐ what is inside every area, for the matrix to open into */
    CONTENTS = r && r.contents ? r.contents : null;
    NOTES = (r && r.notes) || {};
    MATURITY = (r && r.maturity) || null;
  } catch (e) {
    ENGINE = false;
    CONTENTS = null;
    NOTES = {};
    MATURITY = null;
  }
}

/**
 * ── ⚠️⚠️ IT DID REPORT, AND THEN PAINTED OVER ITS OWN REPORT ─────────────────────────────────────────────────
 *
 * Athi, 2026-09-12: *"I pressed the reload button — what does it mean? While loading it just blinks reading,
 * after a few seconds nothing. Does it mean loading completed? It has to state explicitly, refreshing test
 * cases, and show some summary so people understand the cases loaded."*
 *
 * ⚠️ THE SUMMARY EXISTED AND LASTED ABOUT A SECOND. say() writes into #main; the very next line called load(),
 * which repaints #main. So the one press that changes 616 rows said nothing it could be read — which is the
 * standing fault on this platform, a quiet operation reporting nothing, in the tool built to find exactly that.
 *
 * ⭐ Three changes, and none of them is decoration:
 *   · it says WHAT IT IS DOING while it runs, not "reading" — a person pressing a button wants the verb
 *   · the summary lands in #notice, OUTSIDE #main, so the repaint cannot wipe it
 *   · it says what actually MOVED — claims and file facts before and after — because "616 unchanged" and
 *     "616 updated" look identical otherwise, and only one of them means the press did anything
 */
function notice(html, bad) {
  var node = document.getElementById('notice');
  if (!node) return;
  node.hidden = false;
  node.className = 'notice' + (bad ? ' bad' : '');
  node.innerHTML = html + '<button data-cbsid="OWN003-B14" class="x" onclick="document.getElementById(\'notice\').hidden=true" title="Dismiss">\u00d7</button>';
}

async function seed() {
  var before = {
    claims: CASES.filter(function (item) {
      return item.claim;
    }).length,
    facts: CASES.filter(function (item) {
      return item.changed_at;
    }).length,
    total: CASES.length
  };
  notice('<b>Refreshing the test cases\u2026</b> reading the document and upserting every case. ' + 'This takes a few seconds.');
  try {
    var r = await call('/api/testing/cases/seed', { method: 'POST' });
    await load();
    var after = {
      claims: CASES.filter(function (item) {
        return item.claim;
      }).length,
      facts: CASES.filter(function (item) {
        return item.changed_at;
      }).length,
      total: CASES.length
    };
    var moved = function (label, a, b2) {
      if (a === b2) return '<span class="dim">' + label + ' ' + b2 + ' (unchanged)</span>';
      return '<b>' + label + ' ' + a + ' \u2192 ' + b2 + '</b>';
    };
    notice(
      '<b>Test cases refreshed.</b> ' +
        (r.added ? r.added + ' added \u00b7 ' : '') +
        (r.updated ? r.updated + ' updated \u00b7 ' : '') +
        (r.unchanged ? r.unchanged + ' already current' : '').replace(/ \u00b7 $/, '') +
        '<div class="n2">' +
        moved('cases', before.total, after.total) +
        ' \u00b7 ' +
        moved('with a stated claim', before.claims, after.claims) +
        ' \u00b7 ' +
        moved('carrying file facts', before.facts, after.facts) +
        '</div>' +
        /**
         * ⭐ WHAT WAS RETIRED, BY NAME. A case whose file has gone is removed from the board by this press, and a
         * removal nobody is told about is the same silence the refresh summary exists to end. ⚠️ Retired, not
         * deleted — the case and its whole result history stay on the record.
         */
        (r.retired
          ? '<div class="n2"><b>' +
            r.retired +
            ' retired</b> \u2014 their file no longer exists: ' +
            esc((r.orphans || []).slice(0, 6).join(' \u00b7 ')) +
            ((r.orphans || []).length > 6 ? ' \u00b7 +' + ((r.orphans || []).length - 6) + ' more' : '') +
            '. They keep their history and can be brought back by name.</div>'
          : '') +
        /* ⚠️ and when the guard HELD, say so — "0 retired" otherwise reads as "nothing was orphaned" */
        (r.retire_held
          ? '<div class="n2 dim">\u26a0 ' +
            esc((r.orphans || []).length) +
            ' case(s) are on the board and not ' +
            'in the document, and nothing was retired: ' +
            esc(r.retire_held) +
            '.</div>'
          : '') +
        /* ⚠️ the honest caveat: an upsert that changes nothing is a SUCCESS, and looks like a failure */
        (!r.added && !r.updated && !r.retired
          ? '<div class="n2 dim">Nothing moved \u2014 the board already matched the document. ' + 'That is a completed refresh, not a failed one.</div>'
          : '')
    );
  } catch (e) {
    notice('<b>Could not refresh the cases.</b> ' + esc(e.message), true);
  }
}

/**
 * ⭐⭐ EXPORT — the board as a .feature file.
 *
 * ⚠️ IT GOES THROUGH fetch, NOT A PLAIN LINK, because the endpoint needs the Authorization header. A bare
 * <a href> would arrive unauthenticated and download a 401 as a file called chitbridge.feature, which looks
 * exactly like a successful download until somebody opens it.
 */
async function exportFeature() {
  var s = sess();
  if (!s || !s.token) {
    say('Sign in first.', true);
    return;
  }
  var mod = MODFILT; /* the chip selection — Export .feature follows what is on screen */
  try {
    var reply = await fetch(API + '/api/testing/cases/gherkin' + (mod ? '?module=' + encodeURIComponent(mod) : ''), {
      headers: { Authorization: 'Bearer ' + s.token }
    });
    if (!reply.ok) throw new Error('the server said ' + reply.status);
    var text = await reply.text();
    var node = document.createElement('a');
    node.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
    node.download = (mod || 'chitbridge') + '.feature';
    document.body.appendChild(node);
    node.click();
    node.remove();
    setTimeout(function () {
      URL.revokeObjectURL(node.href);
    }, 4000);
    say('Downloaded ' + node.download + '. The Feature description is the spec clause — edit it there and import it back.');
  } catch (e) {
    say('Could not export: ' + e.message, true);
  }
}

/**
 * ⭐⭐⭐ IMPORT — and this is the loop Athi described.
 *
 * Edit the Feature description (the spec clause) and send the file: the clause gains a VERSION, and every case
 * still citing the old one is marked "spec moved" — by construction, exactly the set that has to be looked at
 * again. Edit a Scenario and the case gains a version. Nothing has to be remembered.
 *
 * ⚠️ WHAT COULD NOT BE READ IS SHOWN, never swallowed. A scenario that was skipped is a test that silently
 * does not exist, and the board would be claiming coverage it does not have.
 */
async function importFeature(input) {
  var file = input && input.files && input.files[0];
  input.value = '';
  if (!file) return;
  try {
    var text = await file.text();
    var r = await call('/api/testing/cases/gherkin', { method: 'POST', body: { text: text } });
    var moved = (r.clauses || []).filter(function (item) {
      return item.changed;
    });
    say(
      r.added +
        ' added, ' +
        r.updated +
        ' updated, ' +
        r.unchanged +
        ' unchanged' +
        (moved.length ? ' \u00b7 ' + moved.length + ' clause(s) changed, so cases citing the old wording now read "spec moved"' : '')
    );
    if ((r.problems || []).length) say('Not everything was read: ' + r.problems.join(' \u00b7 '), true);
    await load();
  } catch (e) {
    say('Could not import: ' + e.message, true);
  }
}

/**
 * ⭐⭐⭐ POST A RUN — the JUnit XML any suite writes, dropped onto the board.
 *
 * Athi, 2026-09-11: *"see how the evidence can be included."*
 *
 * ⚠️⚠️ THE MECHANISM HAS EXISTED ALL DAY AND HAS NEVER BEEN USED ONCE, because using it meant copying a token
 * out of the console and running a command. The board therefore holds 608 cases and zero evidence. This is the
 * same lesson the cases themselves taught this morning — *"can we say load the test cases in the icon?"*
 *
 * ⭐ SEVERAL FILES AT ONCE, IN THE ORDER THEY WERE PICKED, because a history needs more than one point: two
 * runs is what makes the Reliability tab able to say anything at all.
 * ⚠️ Each file is ONE run, posted separately — merging them would fabricate a sitting that never happened and
 * every flip between the two would disappear.
 */
async function importResults(input) {
  var files = input && input.files ? [].slice.call(input.files) : [];
  input.value = '';
  if (!files.length) return;
  /**
   * ⚠️⚠️ A MACHINE'S RESULTS MUST NEVER BE RECORDED AS A PERSON'S. This took whatever the 'This run is'
   * dropdown happened to hold, and that dropdown DEFAULTS TO MANUAL — so dropping a suite's XML would have
   * filed 185 automated results as somebody's hand-testing, and the board would have reported human
   * coverage that never happened. A JUnit file is by definition automated; the only choice worth offering
   * is whether it was a routine run or a full regression.
   */
  var picked = document.getElementById('f_kind').value;
  var kind = picked === 'regression' ? 'regression' : 'unit';
  var done = 0,
    rows = 0,
    missed = 0,
    skipped = 0,
    offBoard = 0;
  for (var index = 0; index < files.length; index++) {
    try {
      var text = await files[index].text();
      var r = await call('/api/testing/results/junit', {
        method: 'POST',
        body: {
          xml: text,
          /* ⚠️ the file path IS the case key for a guard run — it is what joins the result to the case, and
           without this the ingest looks for [ABC-01] in the name and reports every test as unmatched */
          key_from: 'name',
          run_kind: kind,
          layer: 'engine',
          run_label: files[index].name.replace(/\.xml$/i, ''),
          project: proj() || undefined
        }
      });
      projectSaid(r);
      done++;
      rows += r.recorded || 0;
      missed += (r.unmatched || []).length;
      skipped += r.skipped || 0;
      offBoard += (r.not_on_board || []).length;
    } catch (e) {
      say('Could not post ' + files[index].name + ': ' + e.message, true);
    }
  }
  if (done)
    say(
      rows +
        ' result(s) recorded from ' +
        done +
        ' run(s)' +
        /**
         * ⚠️⚠️ N01: THIS READ `skipped` AS "NOT ON THE BOARD", AND IT NEVER MEANT THAT. The server records a result
         * for an unknown case and counted it as recorded; `skipped` was only a replay of the same run. So the
         * warning that mattered never appeared. The server now names the keys it has no case for — `not_on_board`.
         */
        (offBoard ? ' · ⚠ ' + offBoard + ' are not cases on this board, so nothing here shows them. Press ' + '"Load the cases" first, then post again.' : '') +
        (skipped ? ' · ' + skipped + ' were already on that run' : '') +
        (missed ? ' · ⚠ ' + missed + ' test(s) carried no case key and were reported, not dropped' : '')
    );
  await load();
}

async function load() {
  var s = sess();
  /**
   * ⚠️ "Tally Test Shop · signed in" READ AS THE REPORT'S SUBJECT, not as who was holding the keyboard.
   * Athi: *"is it as per the user? again, it has to be overall?"* It IS overall — every query behind this
   * page is scoped `WHERE entity_id = $1` and never by actor — but a business name sitting directly beside
   * the title is read as "this is that business's slice", which is the one thing it must not be taken for.
   * ⭐ "signed in as X" can only be identity. The document states its own scope separately, in its first
   * clause line ("scope: the whole board").
   */
  document.getElementById('who').textContent = s ? 'signed in as ' + (s.entity || s.name || 'your business') : 'not signed in';
  try {
    /* two calls, not one per case — see the round-trip note in routes/testing.js */
    /* ⭐ T2-PAGING: both lists page now (total · page · limit) and the board sums the WHOLE set — every page, one reader */
    var a = {
      cases: await CBList.every(function (item) {
        return call('/api/testing/cases?page=' + item);
      }, 'cases')
    };
    var b = {
      results: await CBList.every(function (item) {
        return call('/api/testing/results?page=' + item);
      }, 'results')
    };
    /* ⭐ which cases were written against wording that has since changed. A green case whose clause has
       moved is the most misleading thing a board can show, so it is read every time, not on request. */
    var st = await call('/api/testing/stale');
    STALE = {};
    ((st && st.stale) || []).forEach(function (x) {
      STALE[x.case_key] = x;
    });
    CASES = a.cases || [];
    LAST = {};
    RAN_IN = {};
    (b.results || []).forEach(function (item) {
      if (item.run_id) (RAN_IN[item.case_key] = RAN_IN[item.case_key] || []).push(item.run_id);
      /* ⭐ ONE HEADLINE PER CASE. A case may hold results at two layers; the board shows the WORST of them,
         because a green unit test beside a red counter is not a green case. */
      var cur = LAST[item.case_key];
      var rank = { fail: 4, blocked: 3, skipped: 2, pass: 1 };
      if (!cur || rank[item.status] > rank[cur.status] || (rank[item.status] === rank[cur.status] && new Date(item.at) > new Date(cur.at)))
        LAST[item.case_key] = item;
    });
    if (!CASES.length) {
      document.getElementById('main').innerHTML =
        '<div class="say"><b>No test cases on this board yet.</b>' +
        '<button data-cbsid="OWN003-B15" class="btn pri" onclick="seed()" style="margin:6px 0">Load the test cases</button>' +
        '<div style="font-size:var(--fs-1);color:var(--grey-2);margin-top:5px;line-height:1.55">The documented cases ' +
        'for the counter, the bill, the queue, suppliers and the offer lab. Safe to press again later — it reloads ' +
        'the wording and leaves every result exactly where it is.</div></div>';
      return;
    }
    /* ⚠️ the summary is derived from the same two reads — refresh it here or it shows yesterday */
    await loadSummary();
    /**
     * ⚠️⚠️ THIS WAS THE BUG. It read `if (VIEW === 'summary') { paintSummary(); return; }` and otherwise fell
     * through to paint(), so a load finishing while Athi was on Report drew the Cases pivot on top of it.
     * ⭐ The filters are still filled first: they belong to the Cases view and must exist before it draws.
     */
    fillFilters();
    repaintCurrent();
  } catch (e) {
    document.getElementById('main').innerHTML = '<div class="say"><b>Could not read the board.</b>' + esc(e.message) + '</div>';
  }
}

/**
 * ⭐⭐⭐ THE MODULE LIST COUNTS WHAT IS LEFT AFTER THE FILTERS ABOVE IT, NOT EVERYTHING.
 *
 * Athi, 2026-09-11: *"so my first filter would be that — just click unit, then it filters based on the next
 * level, how many use cases etc."*
 *
 * ⚠️⚠️ A DROPDOWN THAT KEEPS SHOWING THE UNFILTERED COUNT IS WORSE THAN ONE SHOWING NO COUNT. Pick `unit` and a
 * static list still offers `CTR · Counter (18)` — eighteen cases that are not units, promising a drill-down it
 * cannot deliver. Recomputed, the same list offers only the directories that actually hold unit tests, with how
 * many, which is the whole of what a drill-down is.
 *
 * ⚠️ IT EXCLUDES ITS OWN FILTER. Counting with the module filter applied would leave exactly one option — the
 * one already chosen — and there would be no way back up.
 */
/**
 * ── ⭐⭐⭐ ONE FUNCTION FILLS BOTH BOXES, THE TOTALS AND THE CHIPS, AND EVERY COUNT IS OF WHAT IS LEFT ─────────
 *
 * Athi: *"in the filter itself eng - count, and in the second line the details about the ENG, expansion... so I
 * don't need to think too much about the third filter."*
 *
 * ⚠️⚠️ A COUNT THAT IGNORES THE FILTERS ABOVE IT IS A LIE THAT LOOKS LIKE HELP. Pick `unit` and a static list
 * still offers "Counter (18)" — eighteen cases, none of them a unit test, promising a drill-down it cannot
 * deliver. So every number here is computed against the OTHER controls, and each control leaves its own out so
 * there is always a way back up.
 */
var MODFILT = ''; /* the chip selection — a module, chosen from the expansion line rather than a dropdown */

/**
 * ⭐ ONE PLACE THAT KNOWS WHETHER THE BOARD IS ANSWERING A NARROWER QUESTION — and says so in two ways at
 * once, because a colour tells you THAT and the control tells you WHAT and gives you the way out.
 */
function showFilterState(nestedShown) {
  var bar = document.querySelectorAll('.bar')[1];
  var el = document.getElementById('f_state_show');
  if (!el) return;
  var on = [];
  var node = (document.getElementById('f_type') || {}).value || '';
  var ar = (document.getElementById('f_area') || {}).value || '';
  var st = (document.getElementById('f_state') || {}).value || '';
  var q = ((document.getElementById('f_q') || {}).value || '').trim();
  if (node) on.push(node);
  if (ar) on.push('reaches ' + ar);
  if (st) on.push(st === 'fail' ? 'failing' : st === 'done' ? 'with a result' : st);
  if (q) on.push('"' + q + '"');
  if (MODFILT) on.push(MODFILT);

  if (bar) bar.className = on.length ? 'bar filtered' : 'bar';
  /* ⭐ always present, but it says whether it has anything to do — a live-looking button that does nothing
     teaches people to distrust the control */
  var btn = document.getElementById('f_clear');
  if (btn) {
    btn.disabled = !on.length;
    btn.className = on.length ? 'btn pri' : 'btn';
  }
  if (!on.length) {
    el.hidden = true;
    el.innerHTML = '';
    return;
  }
  el.hidden = false;
  el.innerHTML = '<b>' + nestedShown + '</b> of ' + CASES.length + ' \u00b7 filtered by ' + esc(on.join(' \u00b7 '));
}

/** ⭐ every filter, including the hidden one the header chips set — a "clear" that leaves one on is worse than none */
function clearFilters() {
  ['f_type', 'f_area', 'f_state'].forEach(function (id) {
    var e = document.getElementById(id);
    if (e) e.value = '';
  });
  var node = document.getElementById('f_q');
  if (node) node.value = '';
  MODFILT = '';
  paint();
}

function fillFilters() {
  var node = (document.getElementById('f_type') || {}).value || '';
  var ar = (document.getElementById('f_area') || {}).value || '';
  var st = (document.getElementById('f_state') || {}).value || '';
  var q = (document.getElementById('f_q') || {}).value.trim().toLowerCase();

  /** does this case survive everything EXCEPT the named control? */
  function keep(c, skip) {
    if (skip !== 'ty' && node && c.test_type !== node) return false;
    if (skip !== 'ar' && ar && (c.areas || []).indexOf(ar) < 0) return false;
    if (skip !== 'mod' && MODFILT && c.module_key !== MODFILT) return false;
    if (skip !== 'st') {
      var l = LAST[c.case_key];
      if (st === 'todo' && l) return false;
      if (st === 'done' && !l) return false;
      if (st === 'fail' && (!l || (l.status !== 'fail' && l.status !== 'blocked'))) return false;
    }
    if (q && (c.case_key + ' ' + (c.title || '') + ' ' + (c.claim || '')).toLowerCase().indexOf(q) < 0) return false;
    return true;
  }

  /* ── box 1 · the kind, counted ── */
  var nk = {};
  CASES.forEach(function (item) {
    if (keep(item, 'ty')) nk[item.test_type || '—'] = (nk[item.test_type || '—'] || 0) + 1;
  });
  var sel = document.getElementById('f_type');
  var total = CASES.filter(function (item) {
    return keep(item, 'ty');
  }).length;
  sel.innerHTML = '<option value="">Every kind (' + total + ')</option>';
  KIND_ORDER.forEach(function (item) {
    /* ⚠️ AN EMPTY CATEGORY IS STILL OFFERED when we know it should exist — "Penetration (0)" says something
       true; leaving it out lets the absence pass for "not applicable". */
    var nestedN = nk[item] || 0;
    if (!nestedN && !ALWAYS_SHOW[item]) return;
    var element = document.createElement('option');
    element.value = item;
    element.title = LEVEL_SAYS[item] || '';
    element.textContent = KIND_LABEL[item] + ' (' + nestedN + ')';
    sel.appendChild(element);
  });
  sel.value = node;

  /* ── box 2 · where it reaches, counted ── */
  var na = {},
    noArea = 0;
  CASES.forEach(function (item) {
    if (!keep(item, 'ar')) return;
    var list = item.areas || [];
    if (!list.length) {
      noArea++;
      return;
    }
    list.forEach(function (entry) {
      na[entry] = (na[entry] || 0) + 1;
    });
  });
  var sa = document.getElementById('f_area');
  sa.innerHTML = '<option value="">Anywhere</option>';
  AREA_ORDER.forEach(function (item) {
    if (!na[item]) return;
    var element = document.createElement('option');
    element.value = item;
    element.title = AREA_SAYS[item] || '';
    element.textContent = AREA_LABEL[item] + ' (' + na[item] + ')';
    sa.appendChild(element);
  });
  sa.value = ar;

  /* ── the totals, which ARE the third filter ── */
  var all = CASES.filter(function (item) {
    return keep(item, 'st');
  });
  var done = all.filter(function (item) {
    return LAST[item.case_key];
  }).length;
  var bad = all.filter(function (item) {
    var l = LAST[item.case_key];
    return l && (l.status === 'fail' || l.status === 'blocked');
  }).length;
  var tot = document.getElementById('f_tot');
  function n(val, nestedLabel, key, cls) {
    return (
      '<b data-cbsid="OWN003-C01" class="t' +
      (st === key ? ' on' : '') +
      (cls ? ' ' + cls : '') +
      '" onclick="setState(\'' +
      key +
      '\')">' +
      val +
      '</b> <span>' +
      nestedLabel +
      '</span>'
    );
  }
  tot.innerHTML =
    n(all.length, 'cases', '') + n(done, 'tested', 'done') + n(all.length - done, 'not yet', 'todo') + (bad ? n(bad, 'failed', 'fail', 'bad') : '');

  /* ── the expansion line · chips, which need no legend ── */
  var nm = {},
    label = {},
    order = [];
  CASES.forEach(function (item) {
    if (!keep(item, 'mod')) return;
    if (!nm[item.module_key]) {
      nm[item.module_key] = 0;
      label[item.module_key] = item.module_name || '';
      order.push(item.module_key);
    }
    nm[item.module_key]++;
  });
  order.sort(function (first, second) {
    return nm[second] - nm[first];
  });
  /**
   * ⚠️⚠️ THE CHIPS WERE THE AREA COLUMN, PRINTED TWICE. A chip reading "MNT 10" sat above a row reading
   * "MNT · Maintenance · 10 cases" — two places to look for one number, wrapping over two lines to do it.
   * ⭐ Athi: *"if you make it as a tabular, I guess you can remove most of the top panel."* He is right: a
   * summary that repeats the list underneath it is not a summary, it is the list again.
   *
   * ⚠️ ONE THING SURVIVES, because the table cannot say it: how many tests reach nothing we can name. That
   * number belongs nowhere in a Reaches column and must not therefore disappear.
   */
  var chips = document.getElementById('f_chips');
  chips.innerHTML =
    noArea && !ar
      ? '<span class="chipnote">\u26a0 ' +
        noArea +
        ' test(s) reach nothing this measurement can name — ' +
        'counted in the totals, left out of the Reaches column.</span>'
      : '';
}

/**
 * ⭐ A chip is a question: "show me the ones you just counted." So it clears every other filter, sets the one
 * it names, and goes to the tab where cases live — anything less and the number it showed stops being true.
 */
function chipTo(state) {
  var el = document.getElementById('f_state');
  /* ⭐ pressing the ACTIVE chip clears it — the way back is the same control as the way in */
  if (el && el.value === state) state = '';
  if (el) el.value = state;
  ['f_type', 'f_area'].forEach(function (id) {
    var e = document.getElementById(id);
    if (e) e.value = '';
  });
  var node = document.getElementById('f_q');
  if (node) node.value = '';
  MODFILT = '';
  setView('cases');
}

function setState(v) {
  document.getElementById('f_state').value = v;
  paint();
}

/**
 * ⭐⭐ WHAT EACH LEVEL IS WORTH, in one sentence, on the badge itself.
 *
 * ⚠️ These are not decoration. The commonest way a coverage number misleads is by adding a unit test to a system
 * test and reporting "2 passed" — and the person reading it has no way to know that one of them proved a
 * function and the other proved the product. The tooltip is where that stops being invisible.
 */
/**
 * ── ⭐⭐⭐ THE VOCABULARY, IN ONE PLACE, IN THE WORDS A PERSON USES ───────────────────────────────────────────
 *
 * Athi: *"I guess it is only unit, integration, manual, pen, performance etc."*
 *
 * ⚠️ `acceptance` is what the standard calls it; MANUAL is what everyone here calls it. The board shows the
 * second and stores the first, because the stored word has to match ISO/IEC/IEEE 29119 for the report to mean
 * anything to an outside reader, and the shown word has to match the person in the room.
 */
var KIND_ORDER = ['acceptance', 'unit', 'integration', 'system', 'performance', 'security', 'penetration', 'static', 'support'];
var KIND_LABEL = {
  acceptance: 'Manual · a person runs it',
  unit: 'Unit',
  integration: 'Integration',
  system: 'System',
  performance: 'Performance',
  security: 'Security',
  penetration: 'Penetration',
  'static': 'Static · reads the code',
  support: 'Support · not a test'
};
/* ⚠️ offered even at zero: "Penetration (0)" states a fact; omitting it lets the absence read as "not applicable" */
var ALWAYS_SHOW = { penetration: true };

/**
 * ── ⭐⭐⭐ THE ARCHITECTURE IS ENGINE · MIDDLEWARE · WEB, AND THE ORDER SAYS SO ────────────────────────────────
 *
 * Athi, 2026-09-11: *"if our platform is defined instead of MVC model, ours is Engine, Middleware and Web —
 * that is the overall architecture, so how we say that in the summary outcome? The order should be that way.
 * Other areas like database, API are the next level, so we have to showcase that way."*
 *
 * ⚠️⚠️ THE ORDER WAS THE ONE I HAPPENED TO TYPE, AND A READER TAKES AN ORDER FOR A CLAIM. api · middleware ·
 * engine · web put the API first and the rules fourth — the opposite of how this platform is built and of how
 * its author thinks about it. Nothing was wrong with any number; the sequence was making an argument nobody
 * had made.
 *
 * ⭐ THE TRIAD IS THE PRODUCT. The ENGINE holds the rules — money, tax, offers, numerals, document numbers —
 * and is the half provable with no database and no screen. MIDDLEWARE decides who may do what. WEB is where a
 * person meets both. Everything else is what those three RIDE ON: the API is how they are reached, the
 * DATABASE is where their results rest, the CONNECTOR is how they leave the building.
 *
 * ⚠️ It is not MVC and must not be read as it. There is no controller layer here worth naming: a route is a
 * door onto an engine, and the interesting code is on either side of it, never in it.
 */
/**
 * ⭐ EACH AREA CONTAINS A DIFFERENT KIND OF THING, and calling them all "items" would flatten the one fact the
 * column exists to carry. The engine holds RULES; the API holds ENDPOINTS; the database holds MIGRATIONS.
 * ⚠️ "Built" counts what EXISTS, not what is tested — the two numbers sit side by side on purpose.
 */
/* ⭐ the database row lists TABLES now, not the migrations that made them (Athi, 2026-09-11) */
var BUILT_NOUN = { engine: 'rules', middleware: 'gates', web: 'screens', api: 'route files', database: 'tables', connector: 'adapters', bridge: 'crossings' };
var BUILT_HEAD = { engine: 'Rule', middleware: 'Gate', web: 'Screen', api: 'Route file', database: 'Table', connector: 'Adapter', bridge: 'Where it happens' };
var BUILT_NOTE = { engine: 'Size', middleware: 'Size', web: 'Size', api: 'Function points', database: 'Columns', connector: 'Size', bridge: 'Size' };
var CONTENTS = null;
/**
 * ⭐⭐ WHAT EACH ROW LEAVES OUT. Athi, 2026-09-11, on IoT: *"not an explicit stuff, it is part of
 * connectors, we can mention as a notes."* ⚠ The six rows are built by six different rules and not one of
 * them said what it excluded — which is how a row headed "connector" showed no Tally at all and still
 * looked right. A boundary a reader can see is one they can argue with.
 */
/* ⚠️ FOOT lived here and is gone: nothing renders it any more, and a variable still being filled from the
   wire with no consumer is how a deleted feature comes back. The server still sends "foot"; it is ignored
   here now, and should be dropped from build-test-cases.cjs the next time test-cases.json is regenerated. */
var NOTES = {},
  MATURITY = null;

var AREA_TIER = { engine: 1, middleware: 1, web: 1, bridge: 1, api: 2, database: 2, connector: 2 };
var TIER_NAME = { 1: 'The architecture \u2014 engine, middleware, web', 2: 'What it rides on' };
/**
 * ⭐⭐⭐ THE BRIDGE SITS BETWEEN THE PRODUCT AND WHAT IT RIDES ON, because that is what it is: the crossing the
 * layers perform, not a layer of its own. Athi, 2026-09-12: *"where is the bridge coming?"* — it was scattered
 * across three rows on a board named after it.
 * ⚠️ Its files are DELIBERATELY counted twice: routes/chits.js is on the API row as a route file and here as
 * the thing that resolves a recipient. A crossing is a JOB, and the same file can hold a job and a place.
 */
var AREA_ORDER = ['engine', 'middleware', 'web', 'bridge', 'api', 'database', 'connector'];
var AREA_LABEL = { engine: 'Engine', middleware: 'Middleware', web: 'Web', bridge: 'Bridge', api: 'API', database: 'Database', connector: 'Connector' };
/**
 * ── ⭐⭐⭐ WHERE A PERSON CANNOT BE THE EVIDENCE ───────────────────────────────────────────────────────────────
 *
 * Athi, 2026-09-11: *"same thing applies for each other area like middleware — we cannot really test it, it is
 * the code or the tester does it."*
 *
 * ⚠️⚠️ HE IS RIGHT AND THE TABLE WAS LYING BY OMISSION. Middleware's Manual column is empty and so is a column
 * for something nobody has got round to — and they rendered identically, as a dash. But there is no button
 * that forges a token, no screen that exhausts a rate limit, no click that proves one tenant cannot read
 * another's rows. A tester cannot produce that evidence at all, so an empty cell there is CORRECT, and reading
 * it as a gap sends somebody off to write cases that can never be executed.
 *
 * ⭐ Engine is the opposite and worth the contrast: the arithmetic is a guard's job, but a person can see the
 * price on the bill and say it is wrong. So Engine's 35 manual cases are real evidence of a different kind.
 *
 * ⚠️ THIS IS A DECLARED JUDGEMENT, not a measurement — the only one on this screen. It can go stale if the
 * product grows a way to exercise middleware from a screen, which is why it is four lines somebody can read
 * rather than a rule buried in a scoring function.
 */
var NO_MANUAL = {
  middleware:
    'No screen can forge a token, pin an algorithm or prove tenant isolation. ' +
    'This evidence can only be automated — an empty cell here is correct, not a gap.',
  database: 'Schema, migrations and RLS policies are not reachable from a screen. ' + 'A person sees the consequence, never the policy.'
};

var AREA_SAYS = {
  engine: 'The rules themselves — money, tax, offers, numerals, document numbers. Provable with no database and no screen.',
  middleware: 'What decides who may do what: auth, the hat gate, the key scopes.',
  web: 'Where a person meets the other two: the counter, the app, the storefront.',
  /* ⭐⭐ the CROSSING — the half of the name that had no row until Athi asked where it was */
  bridge: 'The crossing itself: identify the recipient or refuse, mint one copy each, then let the database keep them apart.',
  api: 'How the three are reached — every endpoint a client can call.',
  database: 'Where their results rest: schema, migrations, the isolation policies.',
  connector: 'How they leave the building — Tally, Zoho, anything carrying a chit off the rail.'
};

var LEVEL_SAYS = {
  unit: 'Unit — one module, on its own. Proves that function, and nothing about the product.',
  integration: 'Integration — several of our pieces wired together (a route over a stubbed database).',
  system: 'System — the whole product: a real browser, a live API, or a real database.',
  acceptance: 'Acceptance — a person deciding whether it does the job. The only kind that finds "correct but useless".',
  'static': 'Static — reads the source and judges the TEXT. Nothing is executed; real evidence, of a different thing.',
  support: 'Support — not a test. A fixture or harness other tests stand on.',
  performance: 'Performance — round trips, query shape, load and concurrency. Declared by name, not detected.',
  security: 'Security — forged tokens, algorithm pinning, key scopes, tenant isolation, unguarded routes.',
  penetration:
    'Penetration — ⚠ there is none. The category is shown at zero so the absence cannot pass for ' +
    '"not applicable". scripts/penetration.js is MARKET penetration and is not a security test.'
};

function shown() {
  var node = document.getElementById('f_state').value;
  var ty = document.getElementById('f_type').value;
  var ar = document.getElementById('f_area').value;
  var q = document.getElementById('f_q').value.trim().toLowerCase();
  return CASES.filter(function (item) {
    if (MODFILT && item.module_key !== MODFILT) return false;
    if (ty && item.test_type !== ty) return false;
    if (ar && (item.areas || []).indexOf(ar) < 0) return false;
    var last = LAST[item.case_key];
    if (node === 'todo' && last) return false;
    if (node === 'done' && !last) return false;
    if (node === 'fail' && (!last || (last.status !== 'fail' && last.status !== 'blocked'))) return false;
    if (q && (item.case_key + ' ' + (item.title || '')).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}

/**
 * ── ⭐⭐⭐ ONE PLACE FOR THE NUMBERS, BECAUSE TWO PLACES IS THE BUG ────────────────────────────────────────────
 *
 * Athi, 2026-09-11: *"total, how many completed / how many remaining, so anyone understand it, say completion
 * percentage"* — then, looking at the result: *"you have not changed the position of the dropdown box?"*
 *
 * ⚠️⚠️ HE WAS LOOKING AT THE WRONG NUMBERS, AND THAT WAS THE SCREEN'S FAULT, NOT HIS. This header carried a
 * full ladder — passed · not yet tested · 608 cases · 144 acceptance · 96 unit · … — six hundred pixels above a
 * filter row carrying its own totals. Both bold, both counting, one of them ignoring the filters. Picking
 * Kind = unit changed one set and not the other.
 *
 * ⭐ My first attempt at this was to LABEL the difference ("608 cases in all"). That is the move to distrust:
 * explaining why two contradictory numbers are both correct, instead of having one number. The ladder's job —
 * "what shape is the testing" — is now done by the Kind dropdown, which carries the same counts inside the
 * choices. So the header keeps only what nothing else says: how much of the board has any evidence at all.
 */
function tally() {
  /**
   * ⭐ THE SHARED COUNT (app/test-verdict.js). Athi, 2026-09-12: *"always there are differences? I have
   * already mentioned it has to be the same."*
   * ⚠️ The Report and the lab each walked the same two lists with their own counter. Two implementations of
   * one arithmetic agree only until somebody edits one — and the lab spent its whole life reporting
   * "621 not run" with complete confidence, because its own counter could not tell "nothing passed" from
   * "I have no results". One function now, so a difference cannot be introduced by editing either page.
   */
  var c = typeof testCounts === 'function' ? testCounts(CASES, LAST) : null;
  var done = 0,
    count = 0;
  if (c) {
    done = c.total - c.todo;
    count = c.fail + c.blocked;
  } else
    CASES.forEach(function (x) {
      var l = LAST[x.case_key];
      if (!l) return;
      done++;
      if (l.status === 'fail' || l.status === 'blocked') count++;
    });
  /* ⚠️ support files can never report a result — counting them would hold the percentage below 100 forever */
  var testable = CASES.filter(function (item) {
    return item.test_type !== 'support';
  }).length;
  var pc = testable ? Math.round((done / testable) * 100) : 0;

  /**
   * ── ⭐⭐ A COUNT NOBODY CAN OPEN IS A DEAD END ────────────────────────────────────────────────────────────
   *
   * Athi, 2026-09-12: *"27 failing — everyone may want to see what those are. If it is a chip and shows what
   * those are, that would be good. So all the three should be a chip and take / filter the right details."*
   *
   * ⭐ AND THE FILTER ALREADY EXISTED. `f_state` has understood '', 'done' and 'fail' all along — these three
   * chips were describing three filters nobody could reach from them. Wiring a number to the list it counts
   * is the smallest possible change and the one a reader expects to work the moment they see a number.
   *
   * ⚠️ Each chip also CLEARS the other filters. A chip that says 27 and lands you on 4 because a kind filter
   * was still set is worse than one that does nothing — the number would be lying about where it sent you.
   */
  var node = (document.getElementById('f_state') || {}).value || '';
  var chip = function (state, n, label, cls) {
    return (
      '<span data-cbsid="OWN003-B16" class="t ' +
      (cls || '') +
      (node === state ? ' on' : '') +
      '" onclick="chipTo(\'' +
      state +
      '\')"' +
      ' title="Show these on the Cases tab" role="button" tabindex="0">' +
      '<b>' +
      n +
      '</b> ' +
      label +
      '</span>'
    );
  };
  var h = chip('', CASES.length, 'cases', 'whole') + chip('done', done, 'with a result') + (count ? chip('fail', count, 'failing', 'fail') : '');
  var staleN = CASES.filter(function (item) {
    return STALE[item.case_key];
  }).length;
  if (staleN) h += '<span class="t blocked"><b>' + staleN + '</b> spec moved</span>';
  /* ⭐ the one figure a person outside this desk actually asks for, and it is not on any other screen */
  h +=
    '<span class="t pcwrap"><span class="pbar" style="width:120px;display:inline-block;vertical-align:middle">' +
    '<i style="width:' +
    pc +
    '%"></i></span> <b>' +
    pc +
    '%</b> tested' +
    '<i class="sub" style="margin-inline-start:6px">of ' +
    testable +
    ' testable</i></span>';
  /* ⭐ how many ran NOW — the last run's own count, its time and who ran it (RUNS, read with the summary).
     ⭐ b292: RUNS is read with the Project filter, so with a project picked this is THAT project's last run. */
  var lr = lastRun();
  var list = [lr && lr.run_label, PVIEW && 'Project: ' + PVIEW].filter(Boolean).join(' · ');
  h +=
    '<span class="t" data-testid="ran-last"' +
    (list ? ' title="' + esc(list) + '"' : '') +
    '>' +
    (lr
      ? '<b>' +
        (Number(lr.total) || 0) +
        '</b> ran in the last run · ' +
        esc(new Date(lr.finished).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })) +
        (lr.testers ? ' · ' + esc(lr.testers) : '')
      : PVIEW
        ? 'No run in this project'
        : 'No run yet') +
    '</span>';
  document.getElementById('tally').innerHTML = h;
}

var VIEW = 'cases',
  COVER = [],
  RUNS = [];
/**
 * ⭐ b292 · THE PROJECT FILTER. PVIEW '' is the whole board. It narrows the Summary (/coverage, /runs), the Report
 * and the "ran in the last run" header — all read with ?project=. PROJECTS is every project the board has seen,
 * from /runs, so the list does not shrink to the one you picked.
 */
var PVIEW = '',
  PROJECTS = [];
function pq() {
  return PVIEW ? '?project=' + encodeURIComponent(PVIEW) : '';
}
function fillProjects() {
  var node = document.getElementById('f_pview');
  if (!node) return;
  var h = '<option value="">All</option>';
  var seen = PROJECTS.map(function (item) {
    return item.project;
  });

  seen.forEach(function (item) {
    h += '<option value="' + esc(item) + '">' + esc(item) + '</option>';
  });
  node.innerHTML = h;
  node.value = PVIEW;
  node.disabled = !seen.length;
  node.title = seen.length ? 'Show one project' : 'No project recorded yet';
}
async function setProjectView(v) {
  PVIEW = v || '';
  await loadSummary();
  repaintCurrent();
}

/**
 * ⭐⭐ THE SUMMARY. Two questions, and they are not the same one:
 *
 *   COVERAGE — has this area been tested at all? A property of the BOARD, and the one that decides what to
 *              do next. It is what somebody asking "are we ready" actually wants.
 *   SITTINGS — what happened in one run. A property of an EVENT, and the one you read after an automated
 *              suite has just finished, or when you want to know what somebody covered on Tuesday.
 *
 * ⚠️ Showing only the second is the common mistake: a wall of green runs says nothing about the module
 * nobody has opened.
 */
/**
 * ⭐ WHAT EACH TAB IS ASKING. Same results table underneath all five — the lens is the difference, and a reader
 * who cannot see the lens reasonably assumes the tabs disagree.
 */
/* ⚠️ LENS HELD FIVE BLURBS AND IS GONE. A reader handed this document reads one tab; a paragraph describing
   the tab they just pressed is the purest operating chrome there is. Each one is now that tab's title=. */

/**
 * ⭐ ONE MULTIPLIER ON THE ROOT MOVES EVERYTHING — prose, tables, tree, chart labels — because the whole page
 * is drawn from one type scale. That is the payoff for tokenising it; nothing needs re-tuning.
 *
 * ⚠️ localStorage READ AND WRITE ARE BOTH WRAPPED. A private window or blocked site data throws on access, and
 * a page that fails to render because it could not remember a font size is a worse page than one that forgets.
 */
function applyTextSize() {
  var nestedPct = 100;
  try {
    nestedPct = parseInt(localStorage.getItem('cb.testsize'), 10) || 100;
  } catch (_) {}
  nestedPct = Math.max(85, Math.min(145, nestedPct));
  document.documentElement.style.fontSize = nestedPct + '%';
  return nestedPct;
}
function textSize(step) {
  var nestedPct = applyTextSize() + step * 10;
  nestedPct = Math.max(85, Math.min(145, nestedPct));
  try {
    localStorage.setItem('cb.testsize', String(nestedPct));
  } catch (_) {}
  document.documentElement.style.fontSize = nestedPct + '%';
}
applyTextSize();

/**
 * ⭐ ONE SPELLING OF A VERDICT. The board says "Failed"; this page used to say "FAIL". The words are part of
 * the shared vocabulary (teststatus.LABEL) and a document that shouts them reads as a different system.
 */
function sentence(w) {
  var text = String(w || '').trim();
  if (!text) return '\u2014';
  var LONG = { pass: 'Passed', fail: 'Failed', blocked: 'Blocked', skip: 'Skipped', skipped: 'Skipped' };
  if (LONG[text.toLowerCase()]) return LONG[text.toLowerCase()];
  return text.charAt(0).toUpperCase() + text.slice(1).toLowerCase();
}

function setView(v) {
  VIEW = v;

  document.getElementById('t_sum').className = v === 'summary' ? 'on' : '';
  /* the case filters mean nothing off the Cases tab — hidden rather than left inert */
  var bars = document.querySelectorAll('.bar');
  for (var index = 1; index < bars.length; index++) bars[index].className = v === 'cases' ? 'bar' : 'bar hide';
  /* ⭐ the case tally counts CASES — on the three document tabs it describes a tab you are not on */
  var nestedTally = document.getElementById('tally');
  if (nestedTally) nestedTally.style.display = v === 'cases' || v === 'summary' ? '' : 'none';
  var node = document.getElementById('pview');
  if (node) node.style.display = v === 'summary' || v === 'report' ? '' : 'none';
  document.getElementById('t_rep').className = v === 'report' ? 'on' : '';
  document.getElementById('t_rel').className = v === 'reliability' ? 'on' : '';
  document.getElementById('t_try').className = v === 'try' ? 'on' : '';
  /* ⭐ one dispatch — see repaintCurrent */

}

async function loadSummary() {
  try {
    var a = await call('/api/testing/coverage' + pq());
    var b = await call('/api/testing/runs' + pq());
    PROJECTS = (b && b.projects) || [];

    /* ⚠️ on window rather than a local, because chartsHTML() is called from a repaint that does not carry it */
    window.__cover_groups = (a && a.groups) || {};
    RUNS = (b && b.runs) || [];
  } catch (e) {
    say('Could not read the summary: ' + e.message, true);
  }
}

function pct(a, b) {
  return b ? Math.round((a / b) * 100) : 0;
}

/**
 * ⭐⭐⭐ THE TEST COMPLETION REPORT, on ISO/IEC/IEEE 29119-3's own template.
 *
 * Athi: *"is there any report available… standard report template?"* — 29119-3 is the current one, and it
 * superseded IEEE 829, which is the name most people still reach for and which was withdrawn in 2013.
 *
 * ⚠️⚠️ HALF OF A COMPLETION REPORT IS JUDGEMENT. Whether the exit criteria were met, what risk is left, who
 * accepts it — no database holds any of that. A generator that fills those headings with plausible prose
 * produces a document that LOOKS signed off and is not, and a report is read by people who were not in the
 * room and cannot tell invented text from evidence.
 *
 * ⭐ So the measured sections and the judgement sections are rendered DIFFERENTLY on purpose, and the ones
 * that need a person carry the question rather than an answer.
 */
/**
 * ⭐⭐⭐ RELIABILITY — what can be BELIEVED, as opposed to what should be tested.
 *
 * Athi, 2026-09-11: *"the total number of times it ran and how many times it failed… this particular test is
 * drifting, which means it is still not matured."*
 *
 * ⚠️⚠️ THE FAILURE COUNT IS THE WRONG HEADLINE and this screen is arranged around saying so. Three failures
 * out of five runs describes two opposite situations: something that broke once and stayed broken, and
 * something nobody can trust. The first is a defect with a fix; the second is a test that has to be rewritten
 * or deleted. Sorting by FLIPS puts the ones you cannot believe at the top, which is the order you want to
 * read them in.
 */
/**
 * ⭐⭐⭐ TRY IT — run a pure engine on your own input, here, with no server and no database.
 *
 * Athi, 2026-09-11: *"for automation test cases, or the function which does not require any database info, we
 * have to provide an execute function to run the test there itself and show the result… so each function is
 * validated by a human and confirmed."* And then, concretely: *"for example currency format testing — change the
 * currency and it showcases the format, change the sender currency, change the receiver currency, so the
 * combination is understood and also the said rule."*
 *
 * ⭐⭐ A GUARD PROVES A FUNCTION AGAINST THE INPUTS SOMEBODY THOUGHT OF. This lets a person try the input they
 * ACTUALLY HAVE — which is the half no suite can cover, because the suite has never met their data. And it is
 * the same file the counter runs: no server in between to blame for a difference.
 */
var TRY_OUT = {};

function tryCard(id, title, sig, body, egs) {
  return (
    '<div class="try" id="try_' +
    id +
    '"><h3>' +
    esc(title) +
    '</h3>' +
    '<div class="sig">' +
    esc(sig) +
    '</div>' +
    (egs ? '<div class="eg">' + egs + '</div>' : '') +
    body +
    '<div class="out" id="out_' +
    id +
    '">—</div></div>'
  );
}
function trySay(id, text, bad) {
  var el = document.getElementById('out_' + id);
  if (!el) return;
  el.className = 'out' + (bad ? ' bad' : '');
  el.textContent = text;
}

/**
 * ⭐⭐⭐ CURRENCY — the combination, which is the only way the rule is visible.
 *
 * ⚠️⚠️ THE POINT OF SHOWING BOTH SIDES IS THAT THEY ARE THE SAME. An amount of money is CONTENT, not
 * presentation: a chit travels, and the figure on it has to read the same to whoever opens it. So changing the
 * READER changes nothing, and changing the CURRENCY changes everything — and a person can see that in one
 * screen instead of being told it.
 *
 * ⭐ The third line is what the old rule would have produced, kept deliberately: "₹ grouped for a dollar" is
 * abstract until you see $12,34,567.50 sitting under the right answer.
 */
function tryMoney() {
  var node = parseFloat((document.getElementById('tm_amt') || {}).value);
  var cur = ((document.getElementById('tm_cur') || {}).value || 'INR').trim().toUpperCase();
  var send = (document.getElementById('tm_send') || {}).value || 'en-IN';
  var recv = (document.getElementById('tm_recv') || {}).value || 'en-US';
  if (!isFinite(node)) {
    trySay('money', 'Type an amount.', true);
    return;
  }
  try {
    var L2 = window.CBLocale;
    if (!L2 || !L2.money) {
      trySay('money', 'The locale engine did not load.', true);
      return;
    }
    var out = L2.money(node, cur);
    /* what each side would see if the READER decided — the rule we removed */
    var asSender = new Intl.NumberFormat(send, { style: 'currency', currency: cur }).format(node);
    var asRecv = new Intl.NumberFormat(recv, { style: 'currency', currency: cur }).format(node);
    trySay(
      'money',
      'THE CHIT SAYS         ' +
        out +
        '\n' +
        '  sender reads        ' +
        out +
        '\n' +
        '  receiver reads      ' +
        out +
        '\n' +
        (asSender === asRecv
          ? ''
          : '\n\u26a0 if the READER decided instead \u2014 the rule we removed:\n' +
            '  sender (' +
            send +
            ')  ' +
            asSender +
            '\n' +
            '  receiver (' +
            recv +
            ')  ' +
            asRecv +
            '\n' +
            '  \u2026one figure, two shapes, on a document that travels.') +
        '\n\nrule: the CURRENCY groups the amount. ' +
        (cur === 'INR' ? 'INR is lakh-grouped (2-2-3) \u2014 verified.' : cur + ' takes the international grouping (3-3-3).')
    );
  } catch (e) {
    trySay('money', String(e.message || e), true);
  }
}

/** ⭐ NUMERALS — type what a customer actually said. This is the engine where `pathu kilo` once came back as 5. */
function tryNums() {
  var node = (document.getElementById('tn_text') || {}).value || '';
  var N2 = window.CBNums;
  if (!N2 || !N2.numeralsIn) {
    trySay('nums', 'The numerals engine did not load.', true);
    return;
  }
  try {
    var found = N2.numeralsIn(node).map(function (x) {
      return x && x.value !== undefined ? x.value : x;
    });
    var neg = N2.negationIn ? N2.negationIn(node) : null;
    var q = parseFloat((document.getElementById('tn_qty') || {}).value);
    var v = isFinite(q) && N2.verifyQuantity ? N2.verifyQuantity(node, q) : null;
    trySay(
      'nums',
      'numbers heard   ' +
        (found.length ? found.join(' \u00b7 ') : '(none)') +
        '\n' +
        (neg
          ? 'negation        ' + (neg.ambiguous ? '\u26a0 AMBIGUOUS \u2014 ' + neg.reason : neg.negated ? 'REFUSED (\u201cdo not want\u201d)' : 'none') + '\n'
          : '') +
        (v
          ? '\nchecking ' +
            q +
            ':  ' +
            (v.ok ? (v.checked ? '\u2713 agrees' : '\u2014 nothing to check \u2014 ' + v.reason) : '\u2717 DISAGREES \u2014 ' + v.reason)
          : '') +
        '\n\n\u26a0 it VERIFIES, it never substitutes. A disagreement is a refusal with a reason, never a corrected number.'
    );
  } catch (e) {
    trySay('nums', String(e.message || e), true);
  }
}

/** ⭐ DOCUMENT NUMBER — the country decides the shape, and says when it has not been checked. */
function tryDoc() {
  var D = window.CBDoc;
  if (!D || !D.compose) {
    trySay('doc', 'The docnumber engine did not load.', true);
    return;
  }
  var node = ((document.getElementById('td_cty') || {}).value || 'IN').trim().toUpperCase();
  var pre = ((document.getElementById('td_till') || {}).value || 'C1').trim();
  var seq = parseInt((document.getElementById('td_seq') || {}).value, 10) || 1;
  try {
    var r = D.rules(node);
    var lines = [
      'sale          ' + D.compose({ country: node, prefix: pre, seq: seq }),
      'goods receipt ' + D.compose({ country: node, prefix: pre, seq: seq, kind: 'receipt' }),
      'despatch      ' + D.compose({ country: node, prefix: pre, seq: seq, kind: 'despatch' })
    ];
    var checks = lines.map(function (item) {
      var no = item.split(/\s+/).pop();
      var k = D.check(no, node);
      return item + '   ' + (k.ok ? '\u2713 ' + no.length + ' chars' : '\u2717 ' + k.reason);
    });
    trySay(
      'doc',
      checks.join('\n') +
        '\n\nrule: ' +
        r.name +
        '  \u00b7  till id at most ' +
        D.maxPrefix(node) +
        ' character(s)' +
        '\n' +
        (r.verified ? '\u2713 these rules have been checked for ' + node : '\u26a0 NOT CHECKED for ' + node + ' \u2014 ' + r.says)
    );
  } catch (e) {
    trySay('doc', String(e.message || e), true);
  }
}

/**

var RUNNABLE = {

async function paintReliability() {
  document.getElementById('main').innerHTML = '<div class="say">Reading the history…</div>';
  var r;
  try {
    r = await call('/api/testing/reliability');
  } catch (e) {
    say('Could not read the history: ' + e.message, true);
    return;
  }

  var t = r.totals || {};
  var h =
    '<div class="why-note">' +
    '<b>Failures are not the headline here \u2014 changes of answer are.</b> A test that flips proves ' +
    'nothing. The worst are listed first.</div>';

  h +=
    '<div class="big-n" style="margin-bottom:18px">' +
    '<div><b>' +
    (t.tracked || 0) +
    '</b><span>tests with a history</span></div>' +
    /**
     * ⚠️⚠️ THIS SAID "runs recorded" AND SHOWED THE RESULT-ROW COUNT. Two sittings of 186 tests reported
     * "368 runs recorded" — off by a factor of 184 on the one figure that tells a reader how much history
     * there is to trust. ⭐ Both numbers are worth having; they are not the same number.
     */
    '<div><b>' +
    (t.runs || 0) +
    '</b><span>sitting' +
    (t.runs === 1 ? '' : 's') +
    ' posted</span></div>' +
    '<div><b>' +
    (t.results || 0) +
    '</b><span>results in all</span></div>' +
    '<div><b class="bad">' +
    (t.drifting || 0) +
    '</b><span>drifting</span></div>' +
    '<div><b class="big">' +
    (t.settled || 0) +
    '</b><span>settled</span></div>' +
    '<div><b class="dim">' +
    (t.once || 0) +
    '</b><span>run only once</span></div></div>';

  if (!(r.cases || []).length) {
    document.getElementById('main').innerHTML =
      h + '<div class="say"><b>Nothing recorded yet.</b>Run a test, or post an automated run, and the history ' + 'starts here.</div>';
    return;
  }

  /**
   * ⭐⭐ GROUP IS A COLUMN, NOT A SUBTITLE. Athi, 2026-09-11: *"keep it as a column, so if you are referring as
   * engine, web, middleware etc, so we know the core group."*
   *
   * ⚠️ It was grey text tucked under the test name, at the small size, where it could not be compared down the
   * page — which is the only thing a group is FOR. A reader wants to run an eye down and see that everything
   * red is web, or that middleware has three rows in total. In its own column that takes a second; as a
   * subtitle it takes reading every line.
   */
  /**
   * ⚠️ THE KIND WAS A SUB-LINE UNDER THE FILENAME, AND WE SETTLED THIS ON THE CASES TAB AN HOUR AGO. Athi,
   * 2026-09-12: *"under test column, unit is coming — we mentioned keep it as a column."*
   * ⭐ Same fix, same reason: a kind is a FACT ABOUT THE TEST, and a fact a reader compares down a page
   * belongs in a column. Stacked under the name it cannot be scanned, and it makes the name column wider
   * than the names need.
   * ⚠️ Fixing one tab and not the other is how a page ends up with two conventions — which is the thing
   * that made this board confusing in the first place.
   */
  h +=
    '<div class="scroll"><table class="sum"><tr><th>Test</th><th>Kind</th><th>Group</th><th class="num">Runs</th>' +
    '<th class="num">Failed</th><th class="num">Changed</th><th>Last</th>' +
    '<th>To make it green</th><th>Verdict</th></tr>';

  (r.cases || []).forEach(function (item) {
    var cls = item.flips >= 2 ? 'drift' : item.flips === 0 && item.failed ? 'broke' : item.runs < 2 ? 'once' : item.failed ? 'broke' : 'settled';
    var lastCls = item.last_status === 'pass' ? 'big' : item.last_status === 'fail' ? 'bad' : item.last_status === 'blocked' ? 'warnn' : 'dim';
    /* ⭐ the measured area — see the note above the ingest on why this is the case's, not the result's */
    var _cs = CASES.filter(function (x) {
      return x.case_key === item.case_key;
    })[0];
    var _grp = _cs && (_cs.areas || []).length ? _cs.areas : item.layers ? [item.layers] : [];
    h +=
      '<tr><td><span class="area">' +
      esc(shortKey(item.case_key)) +
      '</span>' +
      /**
       * ⚠️⚠️ THIS SHOWED THE RESULT'S `layer`, AND EVERY ROW SAID "engine". Athi: *"under the reliability tab,
       * everything shows as engine — what does this tab refer to?"*
       *
       * `layer` is WHAT A RUN EXERCISED, and it sits on the result rather than the case for a good reason: one
       * case can be proved at two levels — the offer arithmetic green as a unit test and red at the counter.
       * But post-suite.cjs defaults it to "engine", written when the only thing posting was a suite of pure
       * functions; I copied that default while posting 367 results, and 235 of those files drive a BROWSER.
       * ⭐ A column with one value in every row is worse than no column: it still looks like information.
       *
       * ⭐ The CASE knows better, and knows it by MEASUREMENT — which areas its source actually requires,
       * reads and calls. That is what the Group column shows, and it is right retroactively, which a stamped
       * can never be: test_result is append-only by design, so those 367 rows say engine and always will.
       */
      '</td>' +
      /* ⭐ the kind in its own cell — see the note on the header */
      '<td>' +
      (item.kinds ? '<span class="lay ty ' + esc(String(item.kinds).split(/[,\s]+/)[0]) + '">' + esc(item.kinds) + '</span>' : '<span class="dim">—</span>') +
      '</td>' +
      /* ⭐ the core group, in its own cell, so a reader can compare it down the page */
      '<td>' +
      (_grp.length
        ? _grp
            .map(function (entry) {
              return '<span class="grp">' + esc(entry) + '</span>';
            })
            .join('')
        : '<span class="dim">—</span>') +
      '</td>' +
      '<td class="num">' +
      item.runs +
      '</td>' +
      '<td class="num' +
      (item.failed ? ' bad' : ' dim') +
      '">' +
      item.failed +
      '</td>' +
      /* \u2b50 the number that decides the order, and the one people will not expect to be here */
      '<td class="num' +
      (item.flips >= 2 ? ' bad' : ' dim') +
      '">' +
      item.flips +
      '</td>' +
      '<td><span class="' +
      lastCls +
      '">' +
      esc(sentence(item.last_status)) +
      '</span>' +
      '<span class="sub">' +
      ago(item.last_seen) +
      '</span></td>' +
      /**
       * ⭐⭐ THE ACTION, BESIDE THE JUDGEMENT. Athi, 2026-09-12: *"status — red every time, not able to
       * understand what it says. What action is required to make it green?"*
       *
       * ⚠️ The VERDICT is about the test's maturity — did it flip, or has it been red all along — and it is
       * computed API-side from results alone, which is why it can only ever say "a defect, or a stale test;
       * this cannot tell which". That is honest and it is where the reader gets stuck.
       * ⭐ The two facts that settle it live on the CASE, here on the page: when the file last changed, and
       * what it needs to run. So the action is computed where the facts are and sits next to the judgement
       * rather than replacing it — one column says how much to trust the test, the next says what to do.
       */
      '<td>' +
      (_cs ? todoHTML(_cs) : '<span class="dim">—</span>') +
      '</td>' +
      /**
       * ⭐ THE VERDICT IS TWO THINGS, SO IT IS TWO LINES. Athi, 2026-09-12: *"changed once — underneath, a fix
       * or a regression text can be there, so you will get space for action."*
       *
       * ⚠️ "changed once — a fix or a regression, not drift" is a LABEL and its REASONING run together, and as
       * one long string it set the column's width for every row on the page, which is what squeezed the action
       * column he had just asked for. ⭐ The label holds the column; the reasoning wraps underneath it, where
       * it costs nothing.
       */
      '<td>' +
      (function (v) {
        var i = String(v || '').indexOf(' \u2014 ');
        if (i < 0) return '<span class="verdict ' + cls + '">' + esc(v) + '</span>';
        return '<span class="verdict ' + cls + '">' + esc(v.slice(0, i)) + '</span>' + '<span class="sub">' + esc(v.slice(i + 3)) + '</span>';
      })(item.verdict) +
      '</td></tr>';
  });
  h += '</table></div>';
  document.getElementById('main').innerHTML = h;
}

/**
 * ── ⭐⭐⭐ HOW FAR HAS THIS GONE, AND CAN YOU TRUST IT ────────────────────────────────────────────────────────
 *
 * The two questions Athi says the report exists to answer, answered in figures, before clause 1.
 *
 * ⚠️ EVERY NUMBER IS LIFTED FROM A CLAUSE BELOW — §2 for the ratios, §3b for the retest queue, §6 for the
 * caveats. Nothing is recomputed here. A summary that does its own arithmetic is a second opinion, and the
 * day the two disagree the reader has no way to tell which is wrong.
 *
 * ⚠️ AND IT NEVER SAYS "TRUSTWORTHY". It lists what stands in the way of trusting it and lets the reader
 * decide — because whether 1,275 unrun cases matters depends on which 1,275, and this document cannot know
 * that. A generated verdict is the one thing a completion report must not carry. Same reasoning as §10.
 */
function reportVerdictHTML(r) {
  var S = {};
  (r.sections || []).forEach(function (x) {
    S[x.id] = x;
  });
  var two = (S['2'] || {}).body || {};
  var t = two.totals || {};
  var b3 = (S['3b'] || {}).body || {};
  var caveats = (S['6'] || {}).caveats || [];

  var fig = function (n, word, tone) {
    return '<div><b' + (tone ? ' class="' + tone + '"' : '') + '>' + n + '</b><span>' + word + '</span></div>';
  };

  /**
   * ⚠️⚠️ "NEVER RUN" WAS ONE NUMBER FOR TWO DIFFERENT JOBS, and that is why the board looked as though it
   * could never complete. Athi: *"most of the not passed cases … can you run those and update as completed
   * or not required, otherwise it will be empty always and will never be completed?"*
   *
   *   NOT YET RUN     a case with a written expectation, waiting for somebody to RUN it.
   *   NO EXPECTATION  swept from the menu: it names a control and says nothing about what should happen.
   *                   It cannot honestly report pass or fail as written — it is a prompt to WRITE one.
   *
   * ⚠️ NEITHER IS HIDDEN. 835 controls with no real case is a genuine coverage finding, and burying it in
   * the denominator to make a percentage look better would be the opposite fault to the one this report
   * exists to prevent. They are SEPARATED, so the board asks for the two different actions it needs.
   * ⚠️ Falls back to the single figure when the server has not been redeployed with the split.
   */
  var stand = [
    t.failed ? [t.failed, 'failing now', 'bad'] : null,
    b3.awaiting_retest ? [b3.awaiting_retest, 'waiting for your retest', 'warnn'] : null,
    (t.untested_written != null ? t.untested_written : t.untested)
      ? [t.untested_written != null ? t.untested_written : t.untested, 'written, not yet run', 'warnn']
      : null,
    t.untested_swept ? [t.untested_swept, 'no expectation written yet', 'dim'] : null,
    t.blocked ? [t.blocked, 'blocked', 'warnn'] : null
  ].filter(Boolean);

  return (
    '<div class="repverdict">' +
    '<h3>How far has the testing gone?</h3>' +
    '<div class="big-n">' +
    fig((two.coverage_pct != null ? two.coverage_pct : 0) + '%', 'of cases have a result') +
    fig((two.pass_pct != null ? two.pass_pct : 0) + '%', 'of those passed', t.failed ? '' : 'big') +
    fig(t.total || 0, 'cases on the board') +
    '</div>' +
    '<h3>What stands in the way of trusting it?</h3>' +
    /**
     * ⚠️⚠️⚠️ THE SAME FAULT I FIXED THREE TIMES TONIGHT, LEFT IN THE LOUDEST PLACE. With no cases and no
     * results `stand` is empty, and the else branch used to print "Every case on the board has been run and
     * none is failing" — at the top of the document, above clause 1, on the part a person reads on paper.
     * An untested board announcing itself as clean is precisely what the §6 caveats and §10 no_sign were
     * added to stop, and this line sits above both of them.
     * ⭐ REPORT_NO_EVIDENCE was already set seven lines before this function is called; it simply was not
     * read. [[feedback-silence-is-the-bug]]
     */
    (stand.length
      ? '<div class="big-n">' +
        stand
          .map(function (x) {
            return fig(x[0], x[1], x[2]);
          })
          .join('') +
        '</div>'
      : REPORT_NO_EVIDENCE
        ? '<p class="fine"><b>Everything below is zero because nothing has been run</b> — not because ' +
          'it was tested and found clean. This report records what is intended, never what was observed.</p>'
        : '<p class="fine">Nothing measured here does. Every case on the board has been run and none is ' +
          'failing — which is evidence, not a guarantee: it says nothing about what no case covers.</p>') +
    (caveats.length
      ? '<ul class="caveat">' +
        caveats
          .map(function (item) {
            return '<li>' + esc(item) + '</li>';
          })
          .join('') +
        '</ul>'
      : '') +
    '<p class="fine">Every figure above is taken from the numbered clauses below, which are the evidence ' +
    'for it. Nothing here is a judgement — that is section 6, and it needs a person.</p>' +
    '</div>'
  );
}
