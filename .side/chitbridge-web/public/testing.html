         * ── ⚠️⚠️ ONE COLUMN, TWO COMPLETELY DIFFERENT KINDS OF ROW ────────────────────────────────────────
         *
         * Athi, 2026-09-12: *"under API guards, /test and /tests are there — what is the difference? If there
         * are significant differences then it has to be mentioned, else bring it together."*
         *
         * ⚠️ He found it by spotting a stray directory, and the stray was the smaller half. This table mixed
         * 23 AUTHORED FEATURE CODES (ADO, CFD, CTR — 150 cases, grouped by what the PRODUCT DOES) with 5
         * DIRECTORY PATHS (chitbridge-api/tests — 470 cases, grouped by WHERE THE FILES LIVE). Sorted
         * together they interleave, so `chitbridge-api/tests` sat between CFD and CTR as though it were the
         * same sort of thing. One is a feature; the other is a folder.
         *
         * ⭐ TWO BLOCKS, each headed with what its rows ARE — the same distinction the Summary tab already
         * draws between its layer tree and its folder tree, for the same reason: a grouping by INTENTION and
         * a grouping by LOCATION answer different questions and must not read as one list.
         *
         * ⭐ It also puts the never-run where it belongs. Nearly all of the 430 are in the folder block, which
         * is a fact about automated files nobody has run — not about features nobody has tested.
         */
        (function (rows) {
          var row = function (f) {
            return (
              '<tr><td><span class="area">' +
              esc(f.module_key) +
              '</span></td>' +
              '<td>' +
              (f.module_name ? esc(f.module_name) : '<span class="dim">not stated</span>') +
              '</td>' +
              '<td class="num">' +
              f.total +
              '</td>' +
              '<td class="num big">' +
              f.passed +
              '</td>' +
              '<td class="num' +
              (Number(f.failed) ? ' bad' : ' dim') +
              '">' +
              f.failed +
              '</td>' +
              '<td class="num' +
              (Number(f.blocked) ? ' warnn' : ' dim') +
              '">' +
              f.blocked +
              '</td>' +
              '<td class="num' +
              (Number(f.untested) ? ' warnn' : ' dim') +
              '">' +
              f.untested +
              (Number(f.high_untested) ? ' \u26a0' : '') +
              '</td></tr>'
            );
          };
          var block = function (head, title, why, list) {
            if (!list.length) return '';
            var n = list.reduce(function (nestedT, entry) {
              return nestedT + Number(entry.total || 0);
            }, 0);
            return (
              '<h4 class="repgrp">' +
              esc(title) +
              ' <b>' +
              n +
              '</b>' +
              '<span>' +
              esc(why) +
              '</span></h4>' +
              '<div class="scroll"><table class="sum" style="margin:0 0 16px"><tr><th>' +
              esc(head) +
              '</th><th>What it covers</th>' +
              '<th class="num">Cases</th><th class="num">Passed</th><th class="num">Failed</th>' +
              '<th class="num">Blocked</th><th class="num">Never run</th></tr>' +
              list.map(row).join('') +
              '</table></div>'
            );
          };
          var isDir = function (f) {
            return String(f.module_key).indexOf('/') > -1;
          };
          return (
            block(
              'Feature',
              'By feature',
              'what the product does \u2014 written by a person, walked by a person',
              rows.filter(function (entry) {
                return !isDir(entry);
              })
            ) + block('Folder', 'By folder', 'the automated files, grouped where they live \u2014 a place, not a feature', rows.filter(isDir))
          );
        })(b.by_feature || []);
    } else if (item.id === '3' || item.id === '4') {
      var items = b.items || [];
      inner = items.length
        ? items
            .map(function (x) {
              return (
                '<div class="inc"><span class="k2">' +
                esc(x.case_key) +
                '</span> ' +
                '<span class="' +
                (x.status === 'fail' ? 'bad' : 'warnn') +
                '">' +
                esc(sentence(x.status)) +
                '</span> <span class="dim">' +
                esc(x.tester_name || '') +
                ' \u00b7 ' +
                new Date(x.at).toLocaleString() +
                '</span>' +
                (x.note ? '<div style="margin-top:3px">' + esc(x.note) + '</div>' : '') +
                (x.evidence ? '<div class="sub">' + esc(x.evidence) + '</div>' : '') +
                '</div>'
              );
            })
            .join('')
        : /**
           * ⚠️⚠️ "None." SAID TWO OPPOSITE THINGS IN THE SAME SIX CHARACTERS. On a board that has been worked,
           * it means "we looked and found no incidents" — good news. On a board where nothing has been run it
           * means "nobody has looked", which is not news at all, and printing the good-news wording there is
           * how an untested product reads as a clean one. Same rule as the empty COLUMNS three clauses down:
           * different kinds of nothing must not share a word. [[feedback-silence-is-the-bug]]
           */
          REPORT_NO_EVIDENCE
          ? '<span class="warnn">Not known — nothing has been run.</span>'
          : '<span class="dim">None.</span>';
      /**
       * ── ⭐⭐⭐ 3b · RAISED BY PEOPLE — IT WAS RENDERING AS AN EMPTY BOX ────────────────────────────────────
       *
       * ⚠️⚠️ THE WHOLE RETEST LOOP WAS COMPUTED, SERIALISED, SHIPPED — AND DRAWN AS NOTHING. Every other
       * section has a branch here; 3b never got one, so it fell to the `else` and rendered `esc(s.asks)`,
       * and 3b has no `asks`. The result was `<div></div>` under a numbered clause wearing a green MEASURED
       * tag — which does not read as "this failed to render", it reads as "we measured this and it is empty".
       * A release meeting reading the document learned nothing about what is awaiting retest.
       *
       * ⭐ AND `awaiting_retest` IS THE FIGURE THIS SECTION EXISTS FOR: somebody says it is fixed and nobody
       * has checked. It is first, and it is the only one that carries a warning colour when non-zero.
       * `resolved` is the FIXER'S claim; `closed` is the RAISER'S verdict — the report got that wrong once
       * before and shipped it. [[project-test-board]]
       *
       * ⚠️ The rows use the SAME FIELD ORDER as the board's own testWorkRowHTML — label · ref · screen ·
       * what → by/at → next → the closing note. Same order, different density: this is a document, so it
       * keeps the `next` sentence that the panel moved to a tooltip.
       */
    } else if (item.id === '3b') {
      var warnIf = function (n) {
        return n ? ' class="warnn"' : '';
      };
      inner =
        '<div class="big-n">' +
        '<div><b' +
        warnIf(b.awaiting_retest) +
        '>' +
        (b.awaiting_retest || 0) +
        '</b>' +
        '<span>awaiting retest</span></div>' +
        '<div><b>' +
        (b.total || 0) +
        '</b><span>raised</span></div>' +
        '<div><b>' +
        (b.open || 0) +
        '</b><span>still open</span></div>' +
        '<div><b' +
        warnIf(b.closed_without_reason) +
        '>' +
        (b.closed_without_reason || 0) +
        '</b>' +
        '<span>closed, no reason</span></div></div>';

      /* ⭐ the status ladder, in the board's own order and the board's own words */
      if ((b.by_status || []).length) {
        inner +=
          '<dl class="kv" style="margin-bottom:12px">' +
          b.by_status
            .map(function (x) {
              var col =
                x.status === 'passed'
                  ? 'var(--ok-2)'
                  : x.status === 'failed'
                    ? 'var(--disp)'
                    : x.status === 'retest' || x.status === 'blocked' || x.status === 'agreed'
                      ? 'var(--warn-2)'
                      : 'var(--grey-2)';
              return (
                '<dt style="color:' +
                col +
                ';font-weight:700">' +
                esc(x.label) +
                '</dt>' +
                '<dd><b style="font-variant-numeric:tabular-nums">' +
                x.count +
                '</b>' +
                (x.next ? ' <span class="sub">' + esc(x.next) + '</span>' : '') +
                '</dd>'
              );
            })
            .join('') +
          '</dl>';
      }

      if (b.note) inner += '<div class="sub" style="margin-bottom:10px">' + esc(b.note) + '</div>';

      inner += (b.items || []).length
        ? b.items
            .map(function (x) {
              return (
                '<div class="inc">' +
                '<span class="k2">' +
                esc(x.work_label || '') +
                '</span> ' +
                (x.ref ? '<b>' + esc(x.ref) + '</b> ' : '') +
                (x.screen ? '<span class="sub">' + esc(x.screen) + '</span> ' : '') +
                esc(x.what || '') +
                '<div class="sub">' +
                (x.by ? esc(x.by) : 'unattributed') +
                (x.at ? ' · ' + esc(String(x.at).slice(0, 16).replace('T', ' ')) : '') +
                (x.next ? ' · next: ' + esc(x.next) : '') +
                '</div>' +
                (x.closed_note ? '<div class="sub">closed: ' + esc(x.closed_note) + (x.closed_by ? ' — ' + esc(x.closed_by) : '') + '</div>' : '') +
                '</div>'
              );
            })
            .join('')
        : '<span class="dim">Nothing raised by a person in this period.</span>';
    } else if (item.id === '8') {
      inner =
        '<dl class="kv"><dt>Cases</dt><dd>' +
        b.cases +
        '</dd>' +
        '<dt>Features</dt><dd>' +
        b.features +
        '</dd></dl>' +
        '<div class="sub" style="margin-top:7px">' +
        esc(b.note || '') +
        '</div>';
    } else if (item.id === '10') {
      /**
       * ⚠️⚠️⚠️ THE SIGNATURE RULES ARE WITHHELD WHEN THERE IS NO EVIDENCE. An empty board used to print two
       * ruled lines under a document of zeros — an object that does not merely fail to warn, it INVITES the
       * signature. The server decides (`no_sign`), because it is the side that knows whether a single result
       * exists; the page must not re-derive that from figures it happens to have.
       * ⚠️ The CLAUSE still prints. "We have declared nothing and run nothing" is a legitimate and useful
       * report — it just must not be signable. [[feedback-silence-is-the-bug]]
       */
      inner = '<div>' + esc(item.asks) + '</div>' + (item.no_sign ? '' : '<div class="sign"><div>Name and role</div><div>Date</div></div>');
    } else {
      inner =
        '<div>' +
        esc(item.asks || '') +
        '</div>' +
        ((item.caveats || []).length
          ? '<ul class="caveat">' +
            item.caveats
              .map(function (entry) {
                return '<li>' + esc(entry) + '</li>';
              })
              .join('') +
            '</ul>'
          : '');
    }
    h += sec(item, inner);
  });

  h += '</div>';
  document.getElementById('main').innerHTML = h;
}

/**
 * ⭐⭐⭐ ONE CHART RENDERER, FOUR GROUPINGS. Athi, 2026-09-11: *"any graph / chart according to group?"*
 *
 * ⚠️ NO CHART LIBRARY, and that is a decision rather than laziness. cap-admin.js already draws its trend as
 * inline SVG with theme tokens; pulling in 200KB for four stacked bars would be a dependency that has to be
 * version-tracked, CSP-allowed and kept in step with the theme system it knows nothing about.
 *
 * ⚠️ THE SCALE IS THE WHOLE WIDTH OF THE GROUP'S OWN TOTAL, not the largest group. A row of bars each scaled
 * to itself compares nothing; a row scaled to the biggest makes a small complete area look worse than a big
 * half-done one. Each bar is that group's 100%, and the count is printed beside it so the bar never has to
 * be measured by eye.
 */
var CHART_TONES = [
  ['passed', 'var(--ok)'],
  ['failed', 'var(--bad)'],
  ['blocked', 'var(--warn)'],
  [
    'untested',
    'var(--line)'
  ] /* ⚠ was var(--flat), which is defined nowhere — an undefined custom property paints an SVG fill BLACK, and untested is the largest slice on every one of these charts */
];

function chartLegend(keys) {
  return (
    '<div class="legend">' +
    CHART_TONES.filter(function (item) {
      return !keys || keys.indexOf(item[0]) >= 0;
    })
      .map(function (item) {
        return '<span><i style="background:' + item[1] + '"></i>' + item[0] + '</span>';
      })
      .join('') +
    '</div>'
  );
}

/** a stacked bar per row — the group name, the bar, and the numbers that make it checkable */
function chartStack(rows, opts) {
  var o = opts || {};
  if (!rows || !rows.length) return '<div class="none">Nothing to draw yet.</div>';
  var rowH = 26,
    pad = 4;
  /**
   * ⭐ MEASURED, NOT ASSUMED. 74px at 10.5px monospace is about eleven and a half characters, which is why
   * an 11-character cut looked like it fitted — the two numbers were tuned to each other by accident. One
   * new area or kind with a longer name and the label would have been clipped in a chart, the one place a
   * reader cannot tell a shortened name from a real one.
   * ⚠️ 6.3 is the advance width of this face at this size; it is an approximation, so the column is given a
   * character of slack rather than being fitted exactly.
   */
  var longest = rows.reduce(function (total, item) {
    return Math.max(total, String(item.key || '').length);
  }, 0);
  /* ⚠️ 6.3 was the advance width at 10.5px; the label text is 12px now, so the column must widen with it */
  var labelW = o.labelW || Math.max(84, Math.ceil((longest + 1) * 7.2));
  var W = labelW + 226; /* the bar track and the count keep their room whatever the labels need */
  var h = rows.length * rowH + pad;
  var out = '<svg viewBox="0 0 ' + W + ' ' + h + '" role="img" aria-label="' + esc(o.label || '') + '">';
  rows.forEach(function (item, index) {
    var y = index * rowH + pad;
    var total = item.total || 1;
    var x = labelW;
    var w = W - labelW - 44; /* room on the right for the count — labels must fit INSIDE the viewBox */
    /* ⭐ never cut — labelW above is measured from the longest of these */
    out +=
      '<text x="0" y="' +
      (y + 12) +
      '" font-size="12" font-family="ui-monospace,Menlo,monospace" ' +
      'fill="var(--ink-2)" font-weight="700">' +
      esc(String(item.key)) +
      '</text>';
    CHART_TONES.forEach(function (t) {
      var v = Number(item[t[0]] || 0);
      if (!v) return;
      var seg = (v / total) * w;
      out +=
        '<rect x="' +
        x.toFixed(1) +
        '" y="' +
        y +
        '" width="' +
        seg.toFixed(1) +
        '" height="15" ' +
        'fill="' +
        t[1] +
        '"><title>' +
        esc(t[0] + ': ' + v) +
        '</title></rect>';
      x += seg;
    });
    /* ⭐ the number, because a bar you have to measure by eye is decoration */
    out +=
      '<text x="' +
      (W - 40) +
      '" y="' +
      (y + 12) +
      '" font-size="12" fill="var(--grey-2)">' +
      (item.total - (item.untested || 0)) +
      '/' +
      item.total +
      '</text>';
  });
  return out + '</svg>';
}

/**
 * ⚠️ THE TREND IS A DIFFERENT SHAPE BECAUSE IT ANSWERS A DIFFERENT QUESTION. The others say where we stand;
 * this says what happened in each sitting. Columns, oldest on the left, because that is how a trend reads.
 */
function chartTrend(runs) {
  if (!runs || runs.length < 2) return '<div class="none">One sitting so far \u2014 a trend needs at least two.</div>';
  var max =
    Math.max.apply(
      null,
      runs.map(function (item) {
        return item.total;
      })
    ) || 1;
  var w = 340,
    h = 120,
    pad = 18,
    colW = (w - pad * 2) / runs.length;
  var out = '<svg viewBox="0 0 ' + w + ' ' + (h + 16) + '" role="img" aria-label="Results per sitting">';
  /* ⚠️ one faint baseline, not a grid — a grid on twelve columns is noise */
  out += '<line x1="' + pad + '" y1="' + h + '" x2="' + (w - pad) + '" y2="' + h + '" stroke="var(--line)"/>';
  runs.forEach(function (item, index) {
    var x = pad + index * colW + colW * 0.18;
    var bw = colW * 0.64;
    var y = h;
    [
      ['passed', 'var(--ok)'],
      ['blocked', 'var(--warn)'],
      ['failed', 'var(--bad)']
    ].forEach(function (t) {
      var v = Number(item[t[0]] || 0);
      if (!v) return;
      var bh = (v / max) * (h - 10);
      y -= bh;
      out +=
        '<rect x="' +
        x.toFixed(1) +
        '" y="' +
        y.toFixed(1) +
        '" width="' +
        bw.toFixed(1) +
        '" ' +
        'height="' +
        bh.toFixed(1) +
        '" fill="' +
        t[1] +
        '"><title>' +
        esc((item.run_label || 'sitting') + ' \u2014 ' + t[0] + ': ' + v) +
        '</title></rect>';
    });
    /* ⚠️ label every third column at most — twelve dates overlap into a grey smear */
    if (index === 0 || index === runs.length - 1 || index % 3 === 0) {
      out +=
        '<text x="' +
        (x + bw / 2) +
        '" y="' +
        (h + 12) +
        '" font-size="9" fill="var(--grey-2)" ' +
        'text-anchor="middle">' +
        esc(new Date(item.at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })) +
        '</text>';
    }
  });
  return out + '</svg>';
}

function chartCard(title, ask, body, keys) {
  return '<div class="chart"><h3>' + esc(title) + '</h3><p class="ask">' + esc(ask) + '</p>' + body + chartLegend(keys) + '</div>';
}

/** the four charts — each answers a different question, which is why there are four */
/**
 * ── ⭐⭐⭐ WHAT KIND OF TESTING EACH AREA HAS, AND WHAT IT HAS NONE OF ────────────────────────────────────────
 *
 * Athi, 2026-09-11: *"just click unit, then it filters based on the next level, how many use cases etc."*
 *
 * ⚠️⚠️ AND THE FIRST THING THIS TABLE SHOWS IS A FAULT IN THE BOARD, NOT IN THE PRODUCT. It comes out almost
 * perfectly diagonal: the written areas (CTR, SELL, REW…) hold only acceptance cases, and the code areas
 * (chitbridge-api/tests, chitbridge-web/e2e) hold only automated ones. That is not a finding about testing —
 * it is the two halves of the board using two different vocabularies. A case is filed by PRODUCT MODULE; a
 * guard is filed by DIRECTORY, because a file path is the only identity a guard has.
 *
 * ⭐ So "does the Counter have unit tests?" is a question this cannot answer yet: a counter unit test lives in
 * `chitbridge-web/e2e` by path and under `CTR` by meaning, and nothing connects the two. Naming what is missing
 * is worth more than a table that looks full — see TEST-BOARD-GUIDE.md.
 *
 * ⚠️ IT COUNTS CASES, NOT PASSES, and says so. Coverage of intention, not of evidence — the table below it is
 * where verdicts live. Conflating the two is how a board comes to report a number nobody meant.
 *
 * ⚠️ Computed from CASES, which is already in hand: a matrix like this over a server round trip would be a
 * second source of truth for a figure the page can add up itself.
 */
/**
 * ── ⚠️⚠️ I DELETED THIS AND IT WAS THE WRONG THING TO DELETE ─────────────────────────────────────────────────
 *
 * Athi asked *"are you building the summary tab? It is showing same / similar tab cases?"* — a question about
 * why Summary had changed. I read it as an instruction to remove the duplication and removed THIS, the better
 * of the two views. His next message, with a screenshot of it: *"this is an excellent view of the overall
 * architecture, this is what I want with expandable."*
 *
 * ⭐ THE DUPLICATION WAS REAL AND THE CURE WAS AIMED WRONG. What genuinely repeated the Cases pivot was the
 * "Coverage by area" table underneath — module, covered, passed, failed, not run, which is the pivot's default
 * cut exactly. That one is gone and stays gone. This one shows something the pivot does not: the ARCHITECTURE,
 * area against kind, with the tier break and the n/a distinction, read left to right in one picture.
 *
 * ⚠️ A question is not an instruction, and "is this the same?" is not "delete it". Asking would have cost one
 * line.
 */
/**
 * ── ⭐⭐⭐ THE TABLE ATHI DREW ────────────────────────────────────────────────────────────────────────────────
 *
 *       Unit  Integration  Manual  UAT  Preprod  Pen  Performance
 *   Eng   10       5         10     10
 *   Web
 *   Supplier
 *
 * Rows are where a test reaches, columns are what kind it is, and every row ends with the three numbers
 * anybody asks next: how many, how many done, how many left — and the percentage, because a fraction is not a
 * progress report.
 *
 * ── ⚠️⚠️ TWO OF HIS COLUMNS ARE NOT KINDS OF TEST, AND THEY ARE SHOWN ANYWAY ─────────────────────────────────
 *
 * UAT and PREPROD are not properties of a case; they are WHERE and WHEN a run happened. The same manual case
 * is acceptance testing when we run it and user acceptance testing when a shopkeeper runs it before adopting —
 * nothing about the case changes, only who held the mouse.
 *
 * ⭐ They are here, at zero, on purpose. There is no pre-production environment on this platform — everything
 * is local or live — and no customer has yet run anything. Deleting the columns would let both facts pass for
 * "not applicable"; showing them empty says the true thing, which is that this is the next gap to close.
 * Filling them needs a run to carry an environment and a purpose, which is a migration (see §B of
 * BACKLOG-nonfunctional.md).
 */
/**
 * ── ⭐⭐ AN AREA NOTE, AS THE LIST IT ALREADY WAS ────────────────────────────────────────────────────────────
 *
 * Athi: *"under database, big text is there … can you simplify and make it bullet point?"*
 *
 * ⚠️ NOTHING IS REWRITTEN HERE, AND THAT IS DELIBERATE. These notes are the only description of each layer
 * the product has, they are generated, and several of them carry facts that guard a number — the Database
 * note explains that 17 UNGUARDED tables are a finding while 43 SHARED ones are a correct state, which is
 * precisely the misreading that made 43 correct tables look like failures until 2026-09-12. Rewording them
 * from here would be editing evidence. They are SPLIT on the boundaries their author already wrote.
 *
 *   " · "  separates items          -> one bullet each
 *   " ⚠ "  starts a caveat          -> its own bullet, carrying --warn
 *
 * ⭐ A note with no separators stays one paragraph. Structure is revealed where it exists and never invented.
 */
function areaNoteHTML(txt) {
  var text = String(txt || '').trim();
  if (!text) return '';
  /* ⚠ split on the middot only where it separates ITEMS — " · " with spaces — never inside "CGST · SGST" */
  var parts = [];
  text.split(' · ').forEach(function (chunk) {
    /**
     * ⭐ AND ON THE AUTHOR'S OWN MARKERS. These notes mark a point worth reading with ⭐ and a caveat with ⚠,
     * and the Bridge note has four ⭐ and two ⚠ in one paragraph — IDENTIFY, CROSS, PROTECT, THE KNOWN GAP.
     * Those are a list by any reading; they were only prose because nothing split on them.
     */
    chunk.split(/\s(?=[⭐⚠]️?\s)/).forEach(function (item) {
      var t = item.trim();
      if (t) parts.push(t);
    });
  });
  var lead = parts.shift();
  var isWarn = function (t) {
    return /^⚠/.test(t);
  };
  return (
    '<div class="areanote"><p>' +
    esc(lead) +
    '</p>' +
    (parts.length
      ? '<ul>' +
        parts
          .map(function (item) {
            return '<li' + (isWarn(item) ? ' class="warn"' : '') + '>' + esc(item) + '</li>';
          })
          .join('') +
        '</ul>'
      : '') +
    '</div>'
  );
}

function matrixHTML() {
  /* the columns, in the order he wrote them, plus the ones the board already holds */
  var COLS = [
    { k: 'unit', label: 'Unit' },
    /* ⭐ SHORT ENOUGH TO SIT UPRIGHT. The 7.5ch column floor means these cost no width at all; the full
       word is in the heading's title=, which is where a name a reader might not know belongs. */
    { k: 'integration', label: 'Integ', full: 'Integration' },
    { k: 'acceptance', label: 'Manual' },
    {
      k: 'uat',
      label: 'UAT',
      empty: 'No customer has run a case yet. A manual case becomes UAT when a shopkeeper runs it before adopting — the case does not change, the runner does.'
    },
    {
      k: 'preprod',
      label: 'Preprod',
      empty: 'There is no pre-production environment. Everything is local or live, which is why "system" here means the real thing.'
    },
    { k: 'penetration', label: 'Pen', empty: 'There is no penetration testing. scripts/penetration.js is MARKET penetration and is not one.' },
    { k: 'performance', label: 'Perf', full: 'Performance' },
    { k: 'security', label: 'Security' },
    { k: 'system', label: 'System' },
    { k: 'static', label: 'Static' }
  ];

  var cell = {},
    rowAll = {},
    rowDone = {},
    rowRan = {},
    colN = {},
    unplaced = 0,
    unplacedDone = 0,
    unplacedRan = 0;
  /**
   * ⚠️⚠️ SUPPORT FILES ARE OUT OF THE DENOMINATOR, OR 100% IS UNREACHABLE FOREVER.
   *
   * A fixture is not a test and can never report a result, so 27 of them sitting in the total would hold the
   * completion percentage permanently below 96% for a reason that has nothing to do with testing. ⭐ A
   * percentage that cannot reach 100 teaches people to ignore it, which costs more than the number is worth.
   * They stay COUNTED in the Support column and in the case list — they are simply not pretended to be pending.
   */
  var testable = function (c) {
    return c.test_type !== 'support';
  };
  CASES.forEach(function (item) {
    var t = item.test_type || '?';
    var done = !!LAST[item.case_key];
    var ran = ranLast(item);
    colN[t] = (colN[t] || 0) + 1;
    var list = item.areas || [];
    if (!list.length) {
      if (testable(item)) {
        unplaced++;
        if (done) unplacedDone++;
        if (ran) unplacedRan++;
      }
      return;
    }
    /* ⚠️ a test reaching two areas is counted in both — the rows do not sum to the total, and the note says so */
    list.forEach(function (a) {
      cell[a + '|' + t] = (cell[a + '|' + t] || 0) + 1;
      if (!testable(item)) return;
      rowAll[a] = (rowAll[a] || 0) + 1;
      if (done) rowDone[a] = (rowDone[a] || 0) + 1;
      if (ran) rowRan[a] = (rowRan[a] || 0) + 1;
    });
  });

  var nestedPct = function (done, all) {
    return all ? Math.round((done / all) * 100) : 0;
  };
  /**
   * ⚠️⚠️ `all` ARRIVES undefined FOR A ZERO ROW, AND TWO CELLS LIED ABOUT IT. Removing `if (!rowAll[a]) return;`
   * so an empty layer shows itself was right; passing `rowAll[a]` on unchanged was the other half. With
   * `all === undefined`: `'<b>' + all` printed the literal **undefined**, and `(all - done)` was NaN — falsy —
   * so Left printed `—` where the truth is 0. The Bridge row read
   * "Built 8 · Total undefined · Done 0 · Left — · 0%" in the document that leaves the building.
   * ⭐ pct() was already safe; only the two raw uses were not. A zero holds its place as a ZERO here, not as
   * an em dash: `—` means "nobody has", and 0 of 0 is a fact. [[feedback-silence-is-the-bug]]
   */
  /* ⭐ Ran sits beside Total: of these cases, how many the LAST run touched — Done is "ever", Ran is "now" */
  var barCell = function (done, all, ran) {
    done = Number(done) || 0;
    all = Number(all) || 0;
    ran = Number(ran) || 0;
    var q = nestedPct(done, all);
    return (
      '<td class="num"><b>' +
      all +
      '</b></td>' +
      '<td class="num ran">' +
      (ran ? '<b>' + ran + '</b>' : '<span class="dim">0</span>') +
      '</td>' +
      '<td class="num">' +
      (done ? '<span class="big">' + done + '</span>' : '<span class="dim">0</span>') +
      '</td>' +
      '<td class="num">' +
      (all - done ? '<span class="warnn">' + (all - done) + '</span>' : '<span class="dim">—</span>') +
      '</td>' +
      '<td class="num pctcell"><div class="pbar"><i style="width:' +
      q +
      '%"></i></div>' +
      '<span class="pnum">' +
      q +
      '%</span></td>'
    );
  };

  var h =
    '<h2 style="font-size:var(--fs-3);margin:4px 0 9px">What is tested, where, and how far along</h2>' +
    '<div style="color:var(--grey-2);font-size:var(--fs-1);margin-bottom:10px;line-height:1.5">' +
    /**
     * ⚠️⚠️ THIS WAS SIX LINES OF CAVEAT ABOVE THE TABLE IT INTRODUCES, and it pushed the data below the fold
     * on a laptop. Every sentence in it was true and each had been added to head off a misreading — which is
     * how a caption grows until nobody reads any of it, including the one line that mattered.
     * ⭐ One line here; the rest moved onto the things they describe, where a reader meets them at the moment
     * they would otherwise get it wrong.
     */
    '<b>Done</b> means a result was ever recorded, not that it passed. ' +
    '<b>n/a</b> = nobody <i>can</i> test it; <b>—</b> = nobody has. Click a number to open those cases.' +
    /**
     * ── ⭐⭐ WHY THE ROWS DO NOT ADD UP, ALL THREE REASONS, ABOVE THE TABLE ────────────────────────────────
     *
     * ⚠️ IT NAMED TWO OF THREE. Double-counting and support files were stated; the third was not, and it is
     * the largest: TEST TYPES WITH NO COLUMN. `colN` counts every kind, but COLS lists ten — so every case of
     * a kind that has no column sits in the "Everything" bottom line and in NO row of the table, and nothing
     * on the page said so. A reader checking the arithmetic finds a gap the caption does not explain and
     * concludes the table is broken. Computed here rather than asserted, so it cannot go stale the day a
     * column is added. [[feedback-silence-is-the-bug]]
     *
     * ⭐ This replaces the generated FOOT that used to sit UNDER the table — see the note at its render site.
     * A reader meets this before they try the addition, not after they have decided it is wrong.
     */
    (function () {
      var known = {};
      COLS.forEach(function (item) {
        known[item.k] = 1;
      });
      var list = Object.keys(colN)
        .filter(function (item) {
          return !known[item];
        })
        .map(function (item) {
          return { k: item, n: colN[item] };
        })
        .filter(function (x) {
          return x.n;
        })
        .sort(function (x, y) {
          return y.n - x.n;
        });
      var offN = list.reduce(function (total, x) {
        return total + x.n;
      }, 0);
      return (
        '<ul class="fine" style="margin:5px 0 0;padding-inline-start:18px">' +
        '<li>A test reaching two layers is counted in both, so the rows do not sum to ' +
        CASES.length +
        '.</li>' +
        (unplaced ? '<li>' + unplaced + ' test(s) reach no layer this measurement can name — in the ' + 'bottom line, in no row.</li>' : '') +
        (offN
          ? '<li>' +
            offN +
            ' test(s) are of a kind with no column here (' +
            list
              .map(function (x) {
                return x.n + ' ' + esc(x.k);
              })
              .join(', ') +
            ').</li>'
          : '') +
        '<li>Support files are counted, and left out of the percentage.</li>' +
        '</ul></div>'
      );
    })() +
    '<div class="scroll"><table class="sum mtx"><tr><th>Area</th>';
  COLS.forEach(function (item) {
    /* ⚠ an abbreviated heading must carry its full word — the tooltip already exists, so it leads with it */
    h +=
      '<th class="num" title="' +
      esc((item.full ? item.full + ' — ' : '') + (item.empty ? item.empty : LEVEL_SAYS[item.k] || '')) +
      '"><span>' +
      item.label +
      (item.empty ? ' <i class="zeroflag">0</i>' : '') +
      '</span></th>';
  });
  /* ⭐ Athi: *"add the rules count"* — what the area CONTAINS, beside how much of it is tested. Nine rules
     with 135 tests reaching them is a different fact from 135 tests. */
  h +=
    '<th class="num"><span>Built</span></th>' +
    '<th class="sep"></th><th class="num"><span>Total</span></th>' +
    '<th class="num" title="In the last run' +
    (lastRun() && lastRun().run_label ? ' — ' + esc(lastRun().run_label) : '') +
    '"><span>Ran</span></th>' +
    '<th class="num"><span>Done</span></th>' +
    '<th class="num"><span>Left</span></th><th class="num"><span>Complete</span></th></tr>';

  var lastTier = null;
  AREA_ORDER.forEach(function (item) {
    /**
     * ── ⚠️⚠️ A LAYER WITH NO CASES USED TO VANISH, AND BRIDGE IS THE ONE IT KEPT HAPPENING TO ─────────────
     *
     * `if (!rowAll[a]) return;` dropped any area with zero testable cases — silently, with no row and no
     * note. `bridge` is in AREA_ORDER, has a label, a description, a NOTES entry and declared contents, and
     * ZERO cases, so the layer named in the product's own name disappeared from the architecture table.
     * Athi asked *"where is the bridge coming?"* on 2026-09-12 and it was given a row; it went again the
     * moment nobody wrote a case for it.
     *
     * ⭐⭐ THIS IS THE SHOW-IT-AT-ZERO RULE, WHICH THIS TABLE ALREADY ENFORCES ON COLUMNS. UAT, Preprod and
     * Pen are printed at zero precisely so "we have none" cannot pass for "not applicable" — and the same
     * argument is exactly as strong on the other axis. An absent row is read as "there is nothing here";
     * a zero row is read as "nothing has been written for this", which is the truth and is actionable.
     * ⚠️ The footnote's "these six rows" was six BECAUSE of this line. There are seven.
     */
    var emptyRow = !rowAll[item];
    /* ⭐ the break between the triad and what it rides on — an order is only a claim a reader can see */
    if (AREA_TIER[item] !== lastTier) {
      lastTier = AREA_TIER[item];
      h += '<tr class="tier"><td colspan="' + (COLS.length + 8) + '">' + TIER_NAME[lastTier] + '</td></tr>';
    }
    var mopen = isOpenSection('mtx:' + item, 9);
    h +=
      '<tr class="arow' +
      (mopen ? ' open' : '') +
      '" onclick="foldSection(\'mtx:' +
      item +
      '\')"' +
      ' role="button" tabindex="0" onkeydown="if(event.key===\'Enter\'){foldSection(\'mtx:' +
      item +
      '\');}">' +
      '<td class="areacell"><span class="caret">' +
      (mopen ? '\u25be' : '\u25b8') +
      '</span>' +
      '<span class="area">' +
      esc(AREA_LABEL[item]) +
      '</span>' +
      '<span class="what">' +
      esc(AREA_SAYS[item] || '') +
      '</span></td>';
    COLS.forEach(function (c) {
      var n = cell[item + '|' + c.k] || 0;
      /* ⭐ "nobody can" is not "nobody has" — see NO_MANUAL */
      var impossible = (c.k === 'acceptance' || c.k === 'uat') && NO_MANUAL[item] && !n;
      h +=
        '<td class="num">' +
        (n
          ? '<span data-cbsid="OWN003-C02" class="big clickable" onclick="drill(\'' + item + "','" + c.k + '\')">' + n + '</span>'
          : impossible
            ? '<span class="na" title="' + esc(NO_MANUAL[item]) + '">n/a</span>'
            : '<span class="dim">—</span>') +
        '</td>';
    });
    /* what is inside this area, and what it is called */
    var made = CONTENTS && CONTENTS[item] ? CONTENTS[item] : null;
    h +=
      '<td class="num">' +
      (made ? '<b class="built">' + made.length + '</b><span class="builtwhat">' + esc(BUILT_NOUN[item] || '') + '</span>' : '<span class="dim">—</span>') +
      '</td>';
    h += '<td class="sep"></td>' + barCell(rowDone[item] || 0, rowAll[item], rowRan[item]).replace('<td class="num"><b>', '<td class="num tot1"><b>');
    h += '</tr>';
    /**
     * ⚠️ AND AN EMPTY ROW SAYS WHY IT IS EMPTY, in the row itself. A layer with declared contents and no
     * cases is not "nothing here" — it is "nobody has written one", which is a finding and is actionable.
     * Without this the zero row would simply look like a layer nobody needed.
     */
    if (emptyRow) {
      var mk = CONTENTS && CONTENTS[item] ? CONTENTS[item].length : 0;
      h +=
        '<tr class="tier"><td colspan="' +
        (COLS.length + 8) +
        '" ' +
        'style="background:var(--warn-tint);color:var(--warn);font-weight:400;text-transform:none;' +
        'letter-spacing:0">' +
        '<span class="zeroflag">⚠</span> ' +
        (mk ? mk + ' ' + esc(BUILT_NOUN[item] || 'thing(s)') + ' are declared here and not one has a test case.' : 'Nothing has been written for this layer.') +
        ' This row is empty because nobody has written one — not because there is nothing here.' +
        '</td></tr>';
    }
    /**
     * ⭐ THE ROW OPENS INTO ITS OWN CASES. Athi: *"this is an excellent view of the overall architecture, this
     * is what I want with expandable."* A number you can only click through to another tab is a number you
     * have to leave the picture to read.
     * ⚠️ Only what REACHES this area, which is the row's own meaning — not the module it happens to sit in.
     */
    /**
     * ⭐⭐⭐ OPENING AN AREA SHOWS WHAT IS IN IT, LINE BY LINE.
     *
     * Athi: *"if someone wants to know what is inside engine, show each of the rules we have built line by
     * line — name of the rule, purpose and anything else worth mentioning in a single line, possibly a
     * 3-column tabular. Similarly for each item."*
     *
     * ⚠️ NOT THE TEST CASES. Those are one tab away and countable there. What nothing anywhere could answer
     * was "what IS the engine" — the question a person asks first, and the one this whole row is about.
     * ⚠️ The purpose is READ from each file's own declared heading, never written here. A file that states
     * none says so, which is a finding about that file rather than a blank in this table.
     */
    if (mopen) {
      /* ⭐ the boundary first, then the list — it is the frame for the numbers, not a footnote to them */
      var inner = NOTES[item] ? areaNoteHTML(NOTES[item]) : '';
      if (!made || !made.length) {
        inner += '<div class="fine" style="padding:8px 2px">Nothing is listed for this area yet.</div>';
      } else {
        inner +=
          '<table class="inside"><thead><tr><th>' +
          esc(BUILT_HEAD[item] || 'Name') +
          '</th><th>What it does</th><th>' +
          esc(BUILT_NOTE[item] || 'Size') +
          '</th></tr></thead><tbody>';
        made.slice(0, 60).forEach(function (x) {
          /**
           * ⚠️⚠️ THE NAME AND ITS CHIPS RAN TOGETHER — "access_eventspolicy PROVEN". Three spans with no
           * separator and no track, so the chips started wherever the name happened to end and the column had
           * no edge to read down. Athi, 2026-09-12: *"can you make it right aligned, so it looks good."*
           * ⭐ Name left, chips pushed to the right edge of their own cell. Same fix as the case rows and the
           * tree: a column is a TRACK, not whatever is left over after the text.
           */
          inner +=
            '<tr><td class="named"><span class="k">' +
            esc(x.name) +
            '</span>' +
            '<span class="chips">' +
            (x.tier ? '<span class="tag tier-' + esc(x.tier) + '">' + esc(x.tier) + '</span>' : '') +
            (x.stage ? '<span class="stage ' + esc(x.stage) + '">' + esc(x.stage) + '</span>' : '') +
            '</span></td>' +
            '<td>' +
            (x.purpose ? esc(x.purpose) : '<i class="dim">this file does not say what it is for</i>') +
            '</td>' +
            '<td class="num dim">' +
            esc(x.note || '') +
            '</td></tr>';
        });
        if (made.length > 60) inner += '<tr><td colspan="3" class="dim">' + (made.length - 60) + ' more</td></tr>';
        inner += '</tbody></table>';
      }
      h += '<tr class="acases"><td colspan="' + (COLS.length + 8) + '">' + inner + '</td></tr>';
    }
  });

  /* ── the bottom line ── */
  var allTestable = CASES.filter(testable);
  var allDone = allTestable.filter(function (item) {
    return LAST[item.case_key];
  }).length;
  /**
   * ⭐ THE UNPLACED ARE A ROW NOW, not a sentence underneath. Athi asked for it, and he is right: the rows did
   * not add up to the bottom line and the explanation for that sat below the table, where a reader who had
   * already decided the arithmetic was broken would never reach it.
   * ⚠️ It is styled as an absence rather than an area — it is not part of the architecture, it is what the
   * measurement could not place.
   */
  if (unplaced) {
    h +=
      '<tr class="unplaced"><td class="areacell"><span class="area">Not placed</span>' +
      '<span class="what">Tests that reach nothing this measurement can name — in the total, not in a row.</span></td>';
    COLS.forEach(function (item) {
      var un = CASES.filter(function (x) {
        return !(x.areas || []).length && x.test_type === item.k;
      }).length;
      h += '<td class="num">' + (un ? '<span class="warnn">' + un + '</span>' : '<span class="dim">—</span>') + '</td>';
    });
    h += '<td class="num"><span class="dim">—</span></td><td class="sep"></td>' + barCell(unplacedDone, unplaced, unplacedRan) + '</tr>';
  }

  h += '<tr class="foot"><td><b>Everything</b></td>';
  COLS.forEach(function (item) {
    var n = colN[item.k] || 0;
    h += '<td class="num">' + (n ? '<b data-cbsid="OWN003-C03" class="clickable" onclick="drill(\'\',\'' + item.k + '\')">' + n + '</b>' : '<span class="dim">0</span>') + '</td>';
  });
  h +=
    '<td class="num"><b>' +
    (CONTENTS
      ? Object.keys(CONTENTS).reduce(function (total, item) {
          return total + CONTENTS[item].length;
        }, 0)
      : '—') +
    '</b></td>';
  h += '<td class="sep"></td>' + barCell(allDone, allTestable.length, allTestable.filter(ranLast).length) + '</tr>';
  h += '</table></div>';

  /* ⭐ the one thing no row can ever reach, said once — six rows are the ARCHITECTURE, not an inventory */
  /* ⚠️ THE GENERATED FOOTNOTE USED TO PRINT HERE, and it claimed "these six rows" when there are SEVEN —
     six only because `if (!rowAll[a]) return;` was dropping Bridge, so it documented a bug as if it were a
     fact. What it actually guarded (why the rows do not add up) is now three COMPUTED bullets above the
     table, where a reader meets them before attempting the addition rather than after deciding it is broken. */

  /* ⚠️ what the table could not place, said out loud rather than absorbed into a row */
  if (unplaced)
    h +=
      '<div style="color:var(--grey-2);font-size:var(--fs-1);margin:0 0 8px">⚠ ' +
      unplaced +
      ' test(s) reach nothing this measurement can name (' +
      unplacedDone +
      ' of them run). They are in ' +
      'the bottom line and out of the rows — filing them somewhere plausible would be worse than leaving them ' +
      'visible.</div>';

  /* ⚠️⚠️ and the empty columns explain themselves, because an empty column invites the reader to assume */
  var blanks = COLS.filter(function (item) {
    return item.empty && !colN[item.k];
  });
  if (blanks.length) {
    h +=
      '<div class="why-note" style="margin:2px 0 18px"><b>Three columns are empty, and each is a different ' +
      'kind of nothing.</b><ul style="margin:6px 0 0;padding-inline-start:18px;line-height:1.6">' +
      blanks
        .map(function (item) {
          return '<li><b>' + item.label + '</b> — ' + esc(item.empty) + '</li>';
        })
        .join('') +
      '</ul></div>';
  }
  return h;
}

/**
 * one cell → the Cases tab, already filtered. The summary is for deciding, the cases are for doing.
 * ⚠️ The AREA filter is not the module dropdown — a test reaches areas, it sits in a module, and conflating the
 * two is what made the first version of this table come out as a useless diagonal.
 */
/**
 * ⚠️⚠️ AND THE NUMBERS DOUBLE-FIRED. Each count is a <span onclick="drill(…)"> INSIDE a <tr onclick=
 * "foldSection(…)">, so clicking a number ran both: it jumped to the Cases tab AND toggled the area's fold.
 * Two different things happening from one click, one of them invisible until you came back.
 * ⭐ The row handler now only runs when the click did not come from a number.
 */
function drill(area, type) {
  if (window.event && window.event.stopPropagation) window.event.stopPropagation();
  document.getElementById('f_area').value = area;
  document.getElementById('f_type').value = type;
  document.getElementById('f_state').value = '';
  MODFILT = '';
  setView('cases');
}

/**
 * ── ⭐⭐⭐ WHAT THE PURE RULES ACTUALLY ARE ──────────────────────────────────────────────────────────────────
 *
 * Athi, 2026-09-11: *"can we expand the engine to state what those pure rules are, all of them if possible? Or
 * are we showcasing anywhere else what those pure rules are? And I guess it gets updated as we mature the
 * platform as part of our lifecycle — this has to be tidy with the spec."*
 *
 * ⭐⭐ WE WERE ALREADY SHOWCASING THEM, TO OURSELVES. `tests/engine-manifest.js` declares the tiers and
 * `engine-boundary.test.js` enforces them: the day a Tier A file grows a single `require`, the suite goes red.
 * ⚠️ It has never been on a screen, so the one list that is both true and guarded was the one nobody could see.
 *
 * ⚠️⚠️ AND IT CORRECTS THE ROW ABOVE IT. "Engine" as an AREA means a test reaches lib/ or public/engine/ —
 * 136 tests across 127 library files. THE PURE RULES ARE NINE. A reader seeing 136 beside the word engine would
 * conclude the rules are well covered, when what is well covered is lib/ in general.
 *
 * ⭐ It matures with the platform because `@stage` is already on these files — held · tested · proven — and
 * the boundary guard insists on it. How mature each rule is is a question the codebase has always answered
 * about itself and never been asked.
 */
function engineHTML() {
  if (!ENGINE) return '';
  var row = function (r) {
    /* ⚠️ the tests that name THIS module, not the ones that merely reach the engine area */
    var tests = casesFor(r.file);
    var done = tests.filter(function (item) {
      return LAST[item.case_key];
    }).length;
    var bad = tests.filter(function (item) {
      var l = LAST[item.case_key];
      return l && (l.status === 'fail' || l.status === 'blocked');
    }).length;
    return (
      '<tr><td><span class="k">' +
      esc(r.name) +
      '</span>' +
      (r.stage ? '<span class="stage ' + esc(r.stage) + '">' + esc(r.stage) + '</span>' : '') +
      '</td>' +
      /* ⭐ the rule in its own words — from @stage-note or its heading, never inferred */
      '<td>' +
      (r.says ? esc(r.says) : '<i class="dim">⚠ this rule does not say what it is</i>') +
      '</td>' +
      '<td class="num">' +
      r.lines +
      '</td>' +
      '<td class="num">' +
      (tests.length ? tests.length : '<span class="dim">—</span>') +
      '</td>' +
      '<td class="num">' +
      (bad ? '<span class="bad">' + bad + '</span>' : done ? '<span class="big">' + done + '</span>' : '<span class="warnn">not run</span>') +
      '</td></tr>'
    );
  };

  var h =
    '<h2 style="font-size:var(--fs-3);margin:22px 0 9px">The pure rules</h2>' +
    '<div style="color:var(--grey-2);font-size:var(--fs-1);margin-bottom:10px;line-height:1.5">' +
    'Tier A of <code>tests/engine-manifest.js</code> — <b>zero dependencies, forever</b>. ' +
    '<code>engine-boundary.test.js</code> fails the day one of them grows a <code>require</code>. ' +
    '⚠️ These nine are the engine; the <b>Engine</b> row above counts every test reaching <code>lib/</code>, ' +
    'which is 127 files. <i>The area is not the core.</i></div>' +
    '<div class="scroll"><table class="sum"><tr><th>Rule</th><th>What it decides</th>' +
    '<th class="num">Lines</th><th class="num">Tests</th><th class="num">Last</th></tr>';
  ENGINE.pure.forEach(function (item) {
    h += row(item);
  });
  h += '</table></div>';

  if ((ENGINE.bound || []).length) {
    h +=
      '<div style="color:var(--grey-2);font-size:var(--fs-1);margin:10px 0 6px">' +
      '<b>Tier B</b> — the same rules, but needing a database handle. Portable with an adapter, not as a file.' +
      /**
       * ⚠️⚠️ THIS TABLE HAD NO HEADER ROW AT ALL — five columns of values under nothing. It shares the row()
       * renderer with the pure-rules table above and I let it share the HEADER too, by assuming a reader
       * carries one down the page across a paragraph of prose and a second table. They do not.
       * ⭐ Found by e2e/layout-honest.cjs on its FIRST run, not by Athi on his next screenshot — which is the
       * entire reason that guard now exists.
       */
      '</div><div class="scroll"><table class="sum"><tr><th>Rule</th><th>What it decides</th>' +
      '<th class="num">Lines</th><th class="num">Tests</th><th class="num">Last</th></tr>';
    ENGINE.bound.forEach(function (item) {
      h += row(item);
    });
    h += '</table></div>';
  }
  var o = ENGINE.other || {};
  h +=
    '<div class="fine" style="margin:8px 0 16px">The rest of <code>lib/</code> is declared too, and is ' +
    'deliberately NOT called a rule: ' +
    (o.engine_adjacent || 0) +
    ' engine-adjacent · ' +
    (o.adoption || 0) +
    ' adoption layers · ' +
    (o.infrastructure || 0) +
    ' infrastructure.</div>';
  return h;
}

/**
 * ── ⚠️⚠️ THE CHARTS CONTRADICTED THE TABLE DIRECTLY ABOVE THEM ───────────────────────────────────────────────
 *
 * Athi, 2026-09-11: *"fix the charts to use the same axis."*
 *
 * "By level" grouped on the case's `layer` — the OLD inferred taxonomy — and reported engine 246, web 292,
 * transport 11, and FORTY CASES in a bucket called "(not set)". The matrix two inches above it, grouped on the
 * measured `areas`, said engine 138 and api 219. Two numbers for engine on one screen, and a reader has no way
 * to know which is the real one. ⭐ Nothing was wrong with either count; they were counting different things
 * under labels that did not say so.
 *
 * "By area" grouped on `module_key` — CTR, chitbridge-web/e2e — which is the CASES axis, not the architecture.
 *
 * ⭐ All three now group on what the rest of the tab groups on, and they are computed from CASES rather than
 * fetched, so they cannot drift from the table they sit under: one list, one set of numbers, three pictures.
 */
function chartsHTML() {
  var g = window.__cover_groups || {};

  /** tally CASES by a key function, in the pass/fail/untested shape the chart draws */
  var by = function (keyOf, order) {
    var m = {},
      out = [];
    CASES.forEach(function (item) {
      (keyOf(item) || []).forEach(function (k) {
        if (!m[k]) {
          m[k] = { key: k, total: 0, passed: 0, failed: 0, blocked: 0, untested: 0 };
          out.push(m[k]);
        }
        m[k].total++;
        var l = LAST[item.case_key];
        if (!l) m[k].untested++;
        else if (l.status === 'fail') m[k].failed++;
        else if (l.status === 'blocked') m[k].blocked++;
        else m[k].passed++;
      });
    });
    if (order)
      out.sort(function (x, y) {
        var i = order.indexOf(x.key),
          j = order.indexOf(y.key);
        return (i < 0 ? 99 : i) - (j < 0 ? 99 : j);
      });
    else
      out.sort(function (x, y) {
        return y.total - x.total;
      });
    return out;
  };

  return (
    '<div class="charts">' +
    chartCard(
      'By layer',
      'Engine, middleware and web are the product; the rest is what they ride on. ' + 'The same rows as the table above, drawn.',
      chartStack(
        by(function (c) {
          return (c.areas || []).length ? c.areas : ['not placed'];
        }, AREA_ORDER),
        { label: 'Coverage by layer' }
      )
    ) +
    chartCard(
      'By kind',
      'A green unit test and a green system test are not the same amount of evidence. ' + 'This is the shape of what we have.',
      chartStack(
        by(function (c) {
          return [c.test_type || '\u2014'];
        }, KIND_ORDER),
        { label: 'Coverage by kind' }
      )
    ) +
    chartCard(
      'By priority',
      'Whether the important cases are the done ones \u2014 a high pass rate on Low cases is not coverage.',
      chartStack(
        by(
          function (c) {
            return [c.priority || '\u2014'];
          },
          ['High', 'Medium', 'Low']
        ),
        { label: 'Coverage by priority' }
      )
    ) +
    chartCard('Per sitting', 'What each run recorded, oldest first. The only one of the four that is a trend.', chartTrend(g.trend || []), [
      'passed',
      'failed',
      'blocked'
    ]) +
    '</div>'
  );
}

/**
 * ── ⭐⭐ THE SAME ARCHITECTURE AS A TREE ──────────────────────────────────────────────────────────────────────
 *
 * Athi, 2026-09-11: *"if it is a tree format we can do that as well, so it is visible — we have a tree structure
 * built for networking and we can use it, or a tree view would be good."*
 *
 * ⭐ ADOPTED FROM `_netTree` in cap-network.js, which is the tree this platform already has: recursion, depth as
 * padding-inline-start, the node's own purpose on a second line underneath it. Same shape, so both read alike.
 *
 * ⚠️ ONE THING DELIBERATELY NOT COPIED. The network tree clamps that purpose line with nowrap + ellipsis. That
 * is the exact fault Athi reported on this board an hour ago — "many of the text are only partly present" — and
 * copying a pattern means copying its judgement, not its bugs. Here the purpose wraps.
 *
 * ⚠️ AND IT IS A SECOND VIEW, NOT A REPLACEMENT. The table stays. His standing instruction on this board is to
 * keep what is built and audit before dropping anything, and a tree and a table answer different questions: a
 * table compares rows, a tree shows containment. The toggle costs one line and settles nothing prematurely.
 */
var SUMVIEW = 'table';
function setSumView(v) {
  SUMVIEW = v;
  paintSummary();
}

/** a branch: label, count, optional note, and the rows underneath it */
/**
 * ── ⚠️⚠️ THE ROW WAS A FLEX LINE AGAIN, AND I HAVE ALREADY FIXED THIS ONCE ───────────────────────────────────
 *
 * Athi, 2026-09-11: *"tree by layer is not properly aligned"* — and the screenshot shows it exactly: the
 * purpose starts at a different x on every single row, because in a flex line each item begins where the one
 * before it ended. `money` is short so its sentence starts early; `form-handshake PROVEN` is long so its
 * sentence starts late. There is nothing for the eye to run down.
 *
 * ⚠️ THE CASES TAB HAD THIS SAME BUG AND CARRIES THE SAME NOTE — *"THE ROW IS A TABLE, NOT A FLEX LINE"*. I
 * fixed it there, then built this tree as a flex row hours later. A lesson recorded in one file is not a
 * lesson applied in the next.
 *
 * ⭐ FIXED TRACKS: glyph · name · badges · purpose. Every sentence now starts at the same x whatever the name
 * beside it is doing, and `minmax(0, …)` is what lets a long one shrink instead of shoving the column off the
 * edge. Depth stays as padding on the row itself, so the indent still reads as containment.
 *
 * ⚠️ Branch rows (a layer, a tier) keep the flex line ON PURPOSE — they carry a count and a boundary note, not
 * a name/purpose pair, so there is no column for them to line up with.
 */
/**
 * ── ⚠️⚠️ I ROOTED THE PATHS AND BROKE EVERY LOOKUP THAT READ THEM ───────────────────────────────────────────
 *
 * Athi's screenshot, 2026-09-11: every engine rule reads "no case names it" — and order-input has SIX. The
 * board was reporting the whole engine as untested an hour after I gave it a maturity column.
 *
 * ⚠️ MY OWN CHANGE, EARLIER THE SAME DAY. Building the folder tree needed unambiguous paths, so contents
 * entries became `chitbridge-api/lib/order-input.js`. A case's `subjects` still say `lib/order-input.js`,
 * which is what the test file actually names. Four call sites compared the two, and each had guessed at the
 * fix separately: one stripped ONE segment, one stripped TWO, two stripped nothing at all. Three different
 * answers to one question is not four bugs, it is one missing function.
 *
 * ⭐ So the comparison lives here. It tries the path as given and then repo-relative, because a subject is
 * written the way the file refers to itself and the board now roots it — both are the same file.
 */
function casesFor(file) {
  if (!file) return [];
  var parts = String(file).split('/');
  var forms = [file, parts.slice(1).join('/'), parts.slice(2).join('/')];
  return CASES.filter(function (item) {
    var s = item.subjects || [];
    for (var index = 0; index < forms.length; index++) if (forms[index] && s.indexOf(forms[index]) >= 0) return true;
    return false;
  });
}

function treeNode(depth, glyph, label, count, tail, note, open, key) {
  var pad = 10 + depth * 18;
  var leaf = !!note && !key; /* a file: name and purpose, in tracks */
  return (
    '<div data-cbsid="OWN003-C04" class="tnode' +
    (leaf ? ' tleaf' : '') +
    (open ? ' open' : '') +
    '"' +
    (key ? ' onclick="foldSection(\'' + key + '\')"' : '') +
    ' style="padding-inline-start:' +
    pad +
    'px">' +
    '<span class="tglyph">' +
    glyph +
    '</span>' +
    '<span class="tlabel">' +
    esc(label) +
    '</span>' +
    (count === null || count === undefined ? '' : '<span class="tcount">' + count + '</span>') +
    (leaf ? '<span class="tbadges">' + (tail || '') + '</span>' : tail || '') +
    /**
     * ⚠️ THE TREE DREW THESE NOTES ITSELF, so the matrix's fix did not reach it — the same walls of prose,
     * a tab away. Athi, on this view: *"so much of text, bullet points please, also it can start a bit more
     * left."* A LEAF note is a file's one-line purpose and stays a line; an AREA note is the long one and
     * gets the same splitting the matrix now uses.
     * ⚠️ And it starts one indent in, not level with the row's own text — a note pushed to the far right of
     * a wide screen is a column of text with a hand-span of nothing to its left.
     */
    (note
      ? leaf
        ? '<div class="tnote">' + esc(note) + '</div>'
        : '<div class="tnote tnote-area" style="margin-inline-start:' + (pad + 4) + 'px">' + areaNoteHTML(note) + '</div>'
      : '') +
    '</div>'
  );
}

/**
 * ── ⭐⭐ AND THE SAME THING BY FOLDER ─────────────────────────────────────────────────────────────────────────
 *
 * Athi, 2026-09-11, straight after asking for a tree: *"or in the folder structure?"*
 *
 * ⭐⭐ WHICH IS THE BETTER ANSWER TO HIS OTHER QUESTION. He had just asked whether any of this is reproducible
 * as the platform grows. A LAYER tree cannot be: the six rows are six hand-written rules, and every one of them
 * excludes something — that is exactly how the connector row showed no Tally at all. A FOLDER tree is built
 * from the paths themselves, so a new directory appears in it the day it exists, without anyone deciding to
 * add it. Nothing can be left out of a view that is derived from where the files actually are.
 *
 * ⚠️ IT IS NOT A REPLACEMENT FOR THE LAYER VIEW, because a folder is not an architecture: lib/ holds nine
 * declared engine rules and 116 files that are not, and no amount of path-reading will tell them apart. The
 * layer view carries the JUDGEMENT; the folder view carries the COMPLETENESS. Each covers the other's gap,
 * which is why both are here.
 */
function folderTreeHTML() {
  if (!CONTENTS) return '<div class="note">Press <b>Load cases</b>.</div>';

  /* every entry the board knows, filed under its real path */
  var root = { kids: {}, items: [] };
  AREA_ORDER.forEach(function (item) {
    (CONTENTS[item] || []).forEach(function (x) {
      if (!x.file) return;
      var parts = x.file.split('/');
      var leaf = parts.pop();
      var at = root;
      parts.forEach(function (entry) {
        if (!at.kids[entry]) at.kids[entry] = { kids: {}, items: [] };
        at = at.kids[entry];
      });
      at.items.push({ leaf: leaf, area: item, x: x });
    });
  });

  /* ⭐ a folder's weight is everything beneath it, not just its own files */
  var deep = function (n) {
    var t = n.items.length;
    Object.keys(n.kids).forEach(function (item) {
      t += deep(n.kids[item]);
    });
    return t;
  };

  var walk = function (node, name, depth, path) {
    var kids = Object.keys(node.kids).sort();
    var key = 'dir:' + path;
    var open = isOpenSection(key, deep(node));
    var h = '';
    if (name !== null) {
      h += treeNode(depth, open ? '\u2500' : '\u253c', name + '/', deep(node), '<span class="tof">' + node.items.length + ' here</span>', '', open, key);
      if (!open) return h;
      depth += 1;
    }
    kids.forEach(function (item) {
      h += walk(node.kids[item], item, depth, path + '/' + item);
    });
    node.items
      .sort(function (first, second) {
        return first.leaf < second.leaf ? -1 : 1;
      })
      .forEach(function (item, index) {
        var last = index === node.items.length - 1 && !kids.length;
        var list = casesFor(item.x.file);
        var xr = list.filter(function (entry) {
          return LAST[entry.case_key];
        }).length;
        /* ⭐ the LAYER as a chip here — the folder says where it lives, the chip says what it is */
        var tail =
          '<span class="tarea t-' +
          esc(item.area) +
          '">' +
          esc(AREA_LABEL[item.area] || item.area) +
          '</span>' +
          (item.x.stage ? '<span class="stage ' + esc(item.x.stage) + '">' + esc(item.x.stage) + '</span>' : '') +
          (list.length ? '<span class="tof">' + xr + '/' + list.length + ' run</span>' : '<span class="tof dim">no case names it</span>');
        h += treeNode(depth, last ? '\u2514' : '\u251c', item.leaf, null, tail, item.x.purpose || '\u26a0 this file does not say what it is for', false, '');
      });
    return h;
  };

  return (
    '<div class="tree">' +
    walk(root, null, 0, '') +
    '</div>' +
    '<p class="areafoot">\u26a0 This is where the files ARE, which is why nothing can be missing from it \u2014 ' +
    'but a folder is not an architecture. lib/ holds the declared engine rules and everything that is not one, ' +
    'and only the layer view can tell them apart. Read the two together.</p>'
  );
}

/**
 * ── ⭐⭐⭐ THE MENU TREE — WHAT A TESTER ACTUALLY WALKS ───────────────────────────────────────────────────
 *
 * Athi, 2026-09-12: *"add under each of the menu item in tree shape for manual testing, so each of the icon
 * is tested properly."*
 *
 * ⭐⭐ THIS IS THE THIRD TREE AND THE FIRST ONE A NON-PROGRAMMER CAN USE. The layer tree groups by
 * architecture and the folder tree by path; both are true and neither is visible to the person doing the
 * testing. This one is built from `menu` — the door the case belongs to, written by the sweep that read the
 * rail — so its shape IS the shape of the product on screen.
 *
 * ⭐ AND IT REGENERATES. The sweep reads the live rail and the live capability files: a door added tomorrow
 * appears here without anybody deciding to add it, and a control REMOVED stops being emitted, which is what
 * retires its case at the next load. Athi: *"the same has to be updated with retired if it is not going to
 * be useful anymore."* ⚠️ Retiring is not deleting — the case and its whole result history stay on the
 * record under status=retired, because evidence is never destroyed to tidy a count.
 *
 * ⚠️ A GENERATED CASE IS A QUESTION, NOT A CHECK, and the branch says so with a count rather than letting a
 * screen of green ticks imply that somebody decided what each control SHOULD do.
 */
function menuTreeHTML() {
  if (!CASES.length) return '<div class="note">Press <b>Load cases</b>.</div>';

  /**
   * ⭐ THE SHAPE IS SHARED (app/test-menu-tree.js), THE DRAWING IS NOT. The lab draws the same groups and
   * doors in a narrow panel; neither surface decides on its own what a door is or what "run" counts as.
   * ⚠️ Falls back to saying so rather than to a second copy — a missing shared file costs this tab, never
   * the page, and never a silently different answer from the one the lab is showing.
   */
  if (typeof testMenuTree !== 'function')
    return '<div class="note" title="Its shape lives in ' + 'app/test-menu-tree.js">Not loaded \u2014 reload the page.</div>';
  var T = testMenuTree(CASES, LAST);
  /**
   * ⚠️ THE SAME DISTINCTION AS THE LAB, and drawn from the same fact: is it the DATA that has no doors, or
   * this VIEW? Athi hit the first and was told to check the second.
   */
  if (!T.groups.length) {
    var anyMenu = CASES.some(function (item) {
      return !!item.menu;
    });
    return (
      '<div class="note"><b>' +
      (anyMenu
        ? 'No door matches the current filter.</b> The board does hold swept cases \u2014 they are not in view. ' +
          'Journey steps and automated files belong to no single door and never appear here.'
        : 'This board is older than the menu sweep.</b> None of its ' +
          CASES.length +
          ' cases names a door yet, ' +
          'so there is no tree to draw. Press <b>Load cases</b> above \u2014 it is an upsert, and every result ' +
          'already recorded stays where it is.') +
      '</div>'
    );
  }

  var h = '<div class="tree">';
  h += treeNode(
    0,
    '\u25c6',
    'The product, as it is on screen',
    T.total,
    '<span class="tof">' + T.groups.length + ' menu group(s) \u00b7 ' + T.doors + ' door(s)</span>',
    '',
    true,
    ''
  );

  T.groups.forEach(function (item) {
    var gkey = 'menu:' + item.name;
    var gopen = isOpenSection(gkey, item.doors.length);
    var gtail =
      '<span class="tof">' +
      item.total +
      ' case(s) \u00b7 ' +
      item.run +
      ' run' +
      (item.bad ? ' \u00b7 <b class="bad">' + item.bad + ' red</b>' : '') +
      '</span>';
    h += treeNode(1, gopen ? '\u2500' : '\u253c', item.name, item.doors.length, gtail, '', gopen, gkey);
    if (!gopen) return;

    item.doors.forEach(function (de) {
      var list = de.cases;
      var dkey = 'menu:' + item.name + ':' + de.name;
      var dopen = isOpenSection(dkey, list.length);
      /**
       * ⭐ THE DOOR CARRIES THE HONEST NUMBER: how many controls behind it, how many have ever been run, and
       * how many of those cases were SWEPT rather than written. A door showing "18 controls · 0 run" is the
       * finding; a door showing 18 green generated cases is not proof that the screen is right.
       */
      var dtail =
        '<span class="tof">' +
        de.run +
        ' of ' +
        list.length +
        ' run' +
        (de.bad ? ' \u00b7 <b class="bad">' + de.bad + ' red</b>' : '') +
        (de.gen ? ' \u00b7 ' + de.gen + ' swept' : '') +
        '</span>';
      h += treeNode(2, dopen ? '\u2500' : '\u253c', de.name, list.length, dtail, '', dopen, dkey);
      if (!dopen) return;

      /* the controls themselves — the leaf a tester taps, with what it last did (sorted by the shared shape) */
      list.forEach(function (entry) {
        var l = LAST[entry.case_key];
        var nestedMark = !l
          ? '<span class="tof dim">not run</span>'
          : l.status === 'fail' || l.status === 'blocked'
            ? '<span class="tof"><b class="bad">' + esc(l.status) + '</b></span>'
            : '<span class="tof">' + esc(l.status) + '</span>';
        h += treeNode(
          3,
          '\u00b7',
          entry.title || entry.case_key,
          null,
          nestedMark + (entry.generated ? '<span class="ttier">swept</span>' : ''),
          '',
          false,
          ''
        );
      });
    });
  });

  /**
   * ⚠️ AND THE REST OF THE BOARD, SAID OUT LOUD. Most cases belong to no door — a journey walks several, an
   * automated file walks none — and a tree that showed only the swept ones would read as the whole board.
   */
  if (T.offMenu)
    h += treeNode(
      1,
      '\u253c',
      'Not on the menu',
      T.offMenu,
      '<span class="tof">journey steps and automated files \u2014 they belong to no single door</span>',
      '',
      false,
      ''
    );
  h += '</div>';

  /**
   * ⭐⭐ WHAT HAPPENS WHEN A CONTROL GOES AWAY, said here because this is where a reader wonders about it.
   * ⚠️ And it is a statement about a mechanism that already runs — not a plan. If this ever stops being
   * true, this paragraph becomes the most misleading thing on the page.
   */
  h +=
    '<div class="note" style="margin:14px 0"><b>This tree rebuilds itself.</b> ' +
    (typeof TEST_MENU_RETIRED_NOTE === 'string' ? TEST_MENU_RETIRED_NOTE : '') +
    '</div>';
  return h;
}

function treeHTML() {
  if (!CONTENTS) return '<div class="note">Press <b>Load cases</b>.</div>';

  var h = '<div class="tree">';
  var total = AREA_ORDER.reduce(function (sum, item) {
    return sum + (CONTENTS[item] || []).length;
  }, 0);
  h += treeNode(0, '\u25c6', 'Chit & Bridge', total, '<span class="tof">built</span>', '', true, '');

  AREA_ORDER.forEach(function (item) {
    var made = CONTENTS[item] || [];
    var tests = CASES.filter(function (c) {
      return (c.areas || []).indexOf(item) >= 0;
    });
    var run = tests.filter(function (entry) {
      return LAST[entry.case_key];
    }).length;
    var bad = tests.filter(function (entry) {
      var l = LAST[entry.case_key];
      return l && (l.status === 'fail' || l.status === 'blocked');
    }).length;
    var key = 'tree:' + item;
    var open = isOpenSection(key, made.length);

    /* ⭐ the layer's own evidence, on the branch — built, tested, and what is red */
    var tail =
      '<span class="tof">' +
      tests.length +
      ' case(s) \u00b7 ' +
      run +
      ' run' +
      (bad ? ' \u00b7 <b class="bad">' + bad + ' red</b>' : '') +
      '</span>' +
      '<span class="ttier">' +
      (AREA_TIER[item] === 1 ? 'the product' : 'what it rides on') +
      '</span>';

    h += treeNode(1, open ? '\u2500' : '\u253c', AREA_LABEL[item] || item, made.length, tail, NOTES[item] || '', open, key);
    if (!open) return;

    /**
     * ⭐ THE TIER IS A REAL BRANCH, not a badge. connector splits adapter / kit / channel and engine splits
     * pure / bound — those groupings are declared in the source, and a tree is the one view that can show a
     * grouping as containment rather than as a column of repeated words.
     */
    var byTier = {},
      order = [];
    made.forEach(function (x) {
      var t = x.tier || '';
      if (!(t in byTier)) {
        byTier[t] = [];
        order.push(t);
      }
      byTier[t].push(x);
    });

    order.forEach(function (entry) {
      var kids = byTier[entry];
      var d = 2;
      if (entry) {
        h += treeNode(2, '\u251c', entry, kids.length, '', '', true, '');
        d = 3;
      }
      kids.slice(0, 60).forEach(function (x, index) {
        var last = index === Math.min(kids.length, 60) - 1;
        var list = casesFor(x.file);
        var xr = list.filter(function (element) {
          return LAST[element.case_key];
        }).length;
        var t2 =
          (x.stage ? '<span class="stage ' + esc(x.stage) + '">' + esc(x.stage) + '</span>' : '') +
          (list.length ? '<span class="tof">' + xr + '/' + list.length + ' run</span>' : '<span class="tof dim">no case names it</span>');
        h += treeNode(d, last ? '\u2514' : '\u251c', x.name, null, t2, x.purpose || '\u26a0 this file does not say what it is for', false, '');
      });
      if (kids.length > 60) h += treeNode(d, '\u2514', kids.length - 60 + ' more', null, '', '', false, '');
    });
  });

  h += '</div>';
  /* ⚠️ AND THE SAME NOTE PRINTED HERE, where it was worse: this tree draws all SEVEN areas, so "these six
     rows" was not merely stale, it was false about the thing directly above it. */
  return h;
}

/**
 * ── ⭐⭐ TWO MATURITIES, AND THE GAP BETWEEN THEM IS THE POINT ────────────────────────────────────────────────
 *
 * Athi, 2026-09-11: *"if we can include level of maturity somewhere that would be great — product maturity /
 * test maturity."*
 *
 * ⭐ THE PRODUCT GRADE IS ADOPTED, NOT INVENTED. app/cap-legend.js has graded every capability for months on
 * two declared axes — maturity 1-5 (what it DOES) and gov 1-5 (how it is GOVERNED), each with a target and a
 * govGap naming the lever. Nothing on this board ever read it. Grading them again here would have produced the
 * fault this page keeps catching: two numbers for one thing under labels that do not say which is which.
 *
 * ⭐⭐ THE TEST GRADE IS THE GENUINELY MISSING ONE, and it is not a second opinion about the product — it is a
 * fact about the EVIDENCE. A capability its author grades 3, whose tests are all unit tests nobody has run this
 * month, is not the same asset as one graded 3 with a green acceptance pass behind it.
 *
 * ⚠️ A RUNG IS EARNED BY A GREEN ON THE LAST RUN, not by the test existing. A red at rung 4 does not leave you
 * at 4 with an asterisk — it leaves you at 3, because the claim is not currently supported.
 * ⚠️ And a kind can only prove what that kind proves: unit tests earn rung 3 and can never earn rung 5.
 */
var TEST_RUNGS = ['nothing names it', 'covered', 'exercised', 'isolated', 'integrated', 'accepted'];

function testRung(cases) {
  if (!cases.length) return { n: 0, why: 'nothing names it' };
  var run = cases.filter(function (item) {
    return LAST[item.case_key];
  });
  var green = cases.filter(function (item) {
    var l = LAST[item.case_key];
    return l && l.status === 'pass';
  });
  if (!run.length) return { n: 1, why: cases.length + ' case(s), none run' };
  if (!green.length) return { n: 1, why: run.length + ' run, none green' };
  var of = function (ks) {
    return green.filter(function (item) {
      return ks.indexOf(item.test_type) >= 0;
    }).length;
  };
  var acc = of(['acceptance']),
    integ = of(['integration', 'system']),
    iso = of(['unit', 'static']);
  if (acc) return { n: 5, why: acc + ' acceptance pass' + (acc > 1 ? 'es' : '') };
  if (integ) return { n: 4, why: integ + ' integration/system green' };
  if (iso) return { n: 3, why: iso + ' unit/static green \u2014 nothing proves it in place' };
  return { n: 2, why: green.length + ' green, none of a kind that isolates or integrates' };
}

/** ⭐ five pips, so a grade reads as a position rather than as a number to be compared arithmetically */
function pips(n, target) {
  var h = '<span class="pips">';
  for (var index = 1; index <= 5; index++) {
    h += '<i class="' + (n >= index ? 'on' : target && target >= index ? 'want' : '') + '"></i>';
  }
  return h + '</span>';
}

  return h;
}

/**
 * ⭐ WHAT ONE SITTING RECORDED — the answer to "the suite just ran, what happened?"
 * ⚠️ Failures first. A run of 174 results is not read top to bottom; the four that failed are the whole point,
 * and putting them after 170 passes is the same as not showing them.
 */
async function openRun(id) {
  try {
    var r = await call('/api/testing/results?run_id=' + encodeURIComponent(id));
    var rows = (r.results || []).slice();
    var rank = { fail: 0, blocked: 1, skipped: 2, pass: 3 };
    rows.sort(function (left, second) {
      return rank[left.status] - rank[second.status] || (left.case_key < second.case_key ? -1 : 1);
    });
    var first = rows[0] || {};
    var h =
      '<div style="margin-bottom:12px"><button data-cbsid="OWN003-B29" class="btn" onclick="setView(\'summary\')">\u2190 Back to the summary</button></div>' +
      '<h2 style="font-size:var(--fs-3);margin:0 0 9px">' +
      esc(first.run_label || 'This sitting') +
      '</h2>' +
      '<div class="scroll"><table class="sum"><tr><th>Case</th><th>Verdict</th><th>Who</th><th>What they saw</th></tr>';
    rows.forEach(function (x) {
      var cls = x.status === 'pass' ? 'big' : x.status === 'fail' ? 'bad' : x.status === 'blocked' ? 'warnn' : 'dim';
      h +=
        '<tr><td><span class="area">' +
        esc(x.case_key) +
        '</span>' +
        '<span class="sub">' +
        esc(x.run_kind || '') +
        (x.layer ? ' \u00b7 ' + esc(x.layer) : '') +
        '</span></td>' +
        '<td><span class="' +
        cls +
        '">' +
        esc(sentence(x.status)) +
        '</span></td>' +
        '<td class="dim">' +
        esc(x.tester_name || '') +
        '</td>' +
        '<td>' +
        esc(x.note || '') +
        (x.evidence ? '<span class="sub">' + esc(x.evidence) + '</span>' : '') +
        '</td></tr>';
    });
    h += '</table></div>';
    document.getElementById('main').innerHTML = h;
  } catch (e) {
    say('Could not read that run: ' + e.message, true);
  }
}
