        ? '<span class="aname">' + esc(nameOf[item]) + '</span>'
        : rowsBy === 'reaches' && AREA_SAYS[item]
          ? '<span class="aname" style="font-weight:400;color:var(--grey-2)">' + esc(AREA_SAYS[item]) + '</span>'
          : '') +
      '</td>' +
      '<td class="num"><b>' +
      rows.length +
      '</b></td>';
    colKeys.forEach(function (k) {
      var n = cell[item + '\u0000' + k] || 0;
      tot[k] = (tot[k] || 0) + n;
      var cls = k === 'failed' ? 'bad' : k === 'not run' ? 'warnn' : 'big';
      /**
       * ⭐ "NOBODY CAN" IS NOT "NOBODY HAS", and this was the other half of what the matrix knew. No screen
       * forges a token, so Middleware has no manual cases and never will — an empty cell there is CORRECT.
       * ⚠️ Rendering it as the same dash as an untouched area sends somebody off to write cases that can
       * never be executed.
       */
      var cannot = rowsBy === 'reaches' && NO_MANUAL[item] && (k === 'acceptance' || k === 'uat') && !n;
      h +=
        '<td class="num">' +
        (n
          ? '<span class="' + cls + '">' + n + '</span>'
          : cannot
            ? '<span class="na" title="' + esc(NO_MANUAL[item]) + '">n/a</span>'
            : '<span class="dim">\u2014</span>') +
        '</td>';
    });
    h += '</tr>';
    if (open) {
      var inner = '';
      var inner2 = caseHeaderHTML();
      rows.forEach(function (entry) {
        inner2 += caseHTML(entry);
      });
      inner = inner2;
      h += '<tr class="acases"><td colspan="' + (colKeys.length + 2) + '">' + inner + '</td></tr>';
    }
  });

  h += '</tbody><tfoot><tr><td><b>Everything shown</b></td><td class="num"><b>' + list.length + '</b></td>';
  colKeys.forEach(function (item) {
    h += '<td class="num"><b>' + (tot[item] || 0) + '</b></td>';
  });
  h += '</tr></tfoot></table></div>';
  /* ⚠️ said when it is true, not always — an arithmetic warning that is always on is one nobody reads */
  if (multi)
    h +=
      '<div class="fine" style="margin:0 0 14px">\u26a0 A case reaching more than one ' +
      esc(PIVOTS[rowsBy === 'reaches' ? 'reaches' : 'kind'].label).toLowerCase() +
      ' is counted in each, so the columns do not sum to ' +
      list.length +
      '.</div>';

  document.getElementById('main').innerHTML = h;
}

/**
 * ⭐ What identifies a case in a narrow column: a written case IS its key (CTR-01); a file is its basename.
 * ⚠️ The directory is not lost — it moves to the tooltip, because two files can share a basename across repos.
 */
function shortKey(k) {
  var s = String(k || '');
  return s.indexOf('/') < 0 ? s : s.slice(s.lastIndexOf('/') + 1);
}

/**
 * ── ⭐ WHICH SECTIONS ARE OPEN ────────────────────────────────────────────────────────────────────────────────
 *
 * ⚠️ THE DEFAULT IS THE WHOLE DECISION. Open-by-default with twenty-three areas is the wall of rows this
 * replaced; shut-by-default when a person has filtered down to one area hides the only thing they asked for.
 * ⭐ So: one area showing means they went looking for it — open it. Several means they are surveying — fold.
 */
var FOLD = (function () {
  try {
    return JSON.parse(localStorage.getItem('cb_test_fold') || '{}');
  } catch (_) {
    return {};
  }
})();
function foldSave() {
  try {
    localStorage.setItem('cb_test_fold', JSON.stringify(FOLD));
  } catch (_) {}
}

function isOpenSection(k, howMany) {
  if (FOLD[k] !== undefined) return !!FOLD[k]; /* a choice already made wins over any default */
  if (FOLD._all !== undefined) return !!FOLD._all;
  return howMany <= 2;
}
/**
 * ── ⚠️⚠️ REPAINT THE VIEW YOU ARE ON, NOT ALWAYS THE CASES TAB ───────────────────────────────────────────────
 *
 * Athi, 2026-09-11: *"when I click the Engine or Middleware it is going to the Cases tab or the previous
 * summary tab; after two or three attempts it is showing the expandable menu."*
 *
 * ⚠️ EXACTLY THAT. Both of these called `paint()`, which renders the CASES pivot into #main whatever tab you
 * are looking at. So opening an area on Summary toggled the fold correctly and then drew the Cases table over
 * the top — and the "two or three attempts" was him pressing Summary again, which repainted it with the fold
 * now open, so it looked as though it had finally worked.
 *
 * ⭐ One repaint that respects the current view. There is no situation in which a fold on Summary should draw
 * the Cases tab, and there never was — this was a single missing branch.
 */
/**
 * ⚠️⚠️ AND I ONLY FIXED TWO OF THE FIVE TABS. Athi, 2026-09-11: *"other tabs?"*
 *
 * This was written to stop a fold on Summary from drawing the Cases table over it, and it did — for Summary.
 * Report, Reliability and Try all fell through to the same else, so folding anything on those three still
 * painted Cases on top. The bug was never "summary repaints wrong"; it was "this function knows one tab".
 * ── ⚠️⚠️⚠️ AND THEN A THIRD TIME, 2026-09-12 ─────────────────────────────────────────────────────────────────
 *
 * Athi: *"says report, but showing cases — sometimes it shows report, sometimes cases, it jumps immediately."*
 *
 * ⚠️ A RACE, exactly as described. `load()` finishes reading the board asynchronously and then repaints — and
 * ITS repaint knew only about the summary tab, so on Report, Reliability or Try it drew the CASES pivot over
 * whatever you were reading. It "jumps immediately" because the load lands a beat after the tab does.
 *
 * ⚠️⚠️ AND THE COMMENT THAT STOOD HERE SAID *"setView already holds the whole map, this defers to it"*. It did
 * not defer. It was a COPY, and there were three: setView, this, and the partial one inside load() that had
 * been wrong from the start. A comment claiming a duplicate is not a duplicate is worse than the duplicate —
 * it is the thing that stops the next person looking.
 *
 * ⭐ ONE function now. setView and load() both call it.
 */
/**
 * ⭐⭐ ONE WIRING THAT CATCHES EVERY RENDER PATH.
 *
 * ⚠️ My first attempt called this from repaintCurrent — and the widths vanished on the first filter change,
 * because paint() is called DIRECTLY by the filters and never passes through it. The obvious next move was to
 * add the call to paint(), paintSummary(), paintReport(), paintReliability() and paintTry() — which is the
 * scattered-call fault I have now fixed four times on this page.
 *
 * ⭐ Every render writes to #main, so watching #main catches all of them, including the ones somebody adds
 * next month. The observer is the seam; the renderers do not have to know this feature exists.
 */
function applyColWidths() {
  try {
    if (typeof tblResizable === 'function') tblResizable(document.getElementById('main'));
  } catch (_) {}
}
(function watchMain() {
  var node = document.getElementById('main');
  if (!node || typeof MutationObserver !== 'function') return;
  /* ⚠️ childList only, and never attributes: tblResizable SETS th.style.width, so watching attributes would
     re-enter on its own writes. */
  new MutationObserver(function () {
    applyColWidths();
  }).observe(node, { childList: true, subtree: true });
})();

function repaintCurrent() {
  /**
   * ── ⚠️⚠️ THE CHIPS WERE DRAWN BY TWO OF THE FIVE VIEWS ───────────────────────────────────────────────────
   *
   * Athi, 2026-09-12: *"when you first load the page… pass, fail is not coming, but when you move to another
   * chip, that line appears."*
   *
   * ⚠️ `tally()` was called inside paint() and paintSummary() and NOWHERE ELSE, so landing on Report,
   * Reliability or Try drew no chips at all — and the moment you touched Cases or Summary they appeared and
   * then stayed, because they are the same DOM node. That is why it looked intermittent rather than missing.
   *
   * ⭐ THE CHIPS ARE A FACT ABOUT THE BOARD, NOT ABOUT A VIEW — 616 cases and 27 failing are the same numbers
   * whichever tab is open. So they are drawn HERE, once, by the one dispatch, instead of by whichever
   * renderers happened to remember.
   *
   * ⚠️ Same shape as the bug above it: a thing done on some paths and not others. Having one dispatch is what
   * makes this a one-line fix instead of a fourth scattered call.
   */
  tally();
  setTimeout(applyColWidths, 0);
  if (VIEW === 'summary') paintSummary();
  else if (VIEW === 'report') paintReport();
  else if (VIEW === 'reliability') paintReliability();
  else if (VIEW === 'try') paintTry();
  else paint();
}
function foldSection(k) {
  FOLD[k] = !isOpenSection(k, 99);
  foldSave();
  repaintCurrent();
}
/* ⚠️ a STATE, not a one-off: the next repaint would undo an action, and the board repaints on every tap */
function foldAll(open) {
  FOLD = { _all: !!open };
  foldSave();
  repaintCurrent();
}

/**
 * ⭐ ONE HEADER FOR THE CASE LIST. Without it the columns are a guess — and the guess a reader makes is that
 * they belong to the parent table's headings, which is the confusion this exists to end.
 */
/**
 * ── ⭐⭐⭐ A RED THAT SAYS WHAT WOULD MAKE IT GREEN ────────────────────────────────────────────────────────────
 *
 * Athi, 2026-09-12: *"status — red every time, not able to understand what it says. What action is required to
 * make it green, that is what is required I guess."*
 *
 * ⚠️⚠️ THE OLD VERDICT WAS HONEST AND USELESS: *"red every time — a defect, or a test that has gone stale;
 * this cannot tell which."* True, and it leaves the reader exactly where they started. A board that can only
 * say "something is wrong" is a board people stop opening.
 *
 * ⭐ IT NEEDED NO NEW DATA. Two facts the build now carries — when the FILE last changed, and what the file
 * NEEDS to run — answer it against the time of the last result:
 *
 *   ⟳ re-run      the file changed AFTER this result. The red describes code that no longer exists.
 *   ⚙ environment it needs a database, the API, or a browser that the run did not have.
 *   ⏸ decision    the file declares a held decision — red because nobody has chosen yet.
 *   ✗ defect      red, unchanged since the result, needing nothing it lacked. ⭐ THE REAL ONE.
 *
 * ⚠️ DEFECT IS WHAT IS LEFT WHEN THE OTHER THREE ARE RULED OUT, and it is the narrowest bucket on purpose.
 * The value of this is not the four labels — it is that the genuinely broken tests stop hiding among the ones
 * that are merely out of date.
 */
/**
 * ⭐ THE JUDGEMENT MOVED TO app/test-verdict.js so the lab can use the same one — see the script tag above.
 * What stays here is only how this page DRAWS it; what it MEANS is shared.
 */
var TODO_CLS = { dim: 'dim', ok: 'big', warn: 'warnn', bad: 'bad' };

function whatToDo(c) {
  return testVerdict(c, LAST[c.case_key]);
}

/** the short badge for a row; the full sentence rides in the tooltip */
function todoHTML(c) {
  var t = whatToDo(c);
  if (t.kind === 'ok') return '';
  var w = TEST_TODO[t.kind] || TEST_TODO.defect;
  return '<span class="todo ' + (TODO_CLS[w.tone] || 'bad') + '" title="' + esc(t.why) + '">' + w.icon + ' ' + esc(t.kind) + '</span>';
}

function caseHeaderHTML() {
  return (
    '<div class="chead chhead">' +
    '<span class="key">Case</span>' +
    '<span class="ttl">What it proves</span>' +
    '<span class="c-kind">Kind</span>' +
    '<span class="c-status">Status</span>' +
    '<span class="c-todo">To make it green</span>' +
    '<span class="c-pri">Priority</span>' +
    '<span class="badges"></span></div>'
  );
}

function caseHTML(c) {
  var l = LAST[c.case_key],
    text = l ? l.status : '';
  var open = !!OPEN[c.case_key];
  /* ⭐ the verdict is a COLUMN now — short enough to hold its width, with the detail in the tooltip */
  var last = l
    ? '<span class="last ' +
      (text === 'fail' ? 'fail' : '') +
      '" title="' +
      esc(text.toUpperCase() + ' · ' + (l.tester_name || '') + ' · ' + ago(l.at) + (l.run_kind ? ' · ' + l.run_kind : '') + (l.note ? ' — ' + l.note : '')) +
      '" style="color:' +
      (text === 'fail' || text === 'blocked' ? 'var(--bad)' : 'var(--ok)') +
      '">' +
      text.toUpperCase() +
      '</span>'
    : '<span class="last none">not run</span>';

  var h =
    '<article class="case ' +
    text +
    '" id="c_' +
    esc(c.case_key) +
    '">' +
    '<div data-cbsid="OWN003-C05" class="chead" onclick="toggle(\'' +
    esc(c.case_key) +
    '\')">' +
    '<span class="key" title="' +
    esc(c.case_key) +
    '">' +
    esc(shortKey(c.case_key)) +
    '</span>' +
    /**
     * ── ⚠️⚠️ "NO CLAIM WRITTEN IN THE FILE" NAMED NEITHER THE FILE NOR THE CLAIM ──────────────────────────
     *
     * Athi, 2026-09-12: *"each of the cases says no claim written in the file — which file, what claim is not
     * written? Can we refine it?"*
     *
     * ⚠️ IT WAS A COMPLAINT, NOT A FINDING. Echoing the filename back as a title would have been worse — it
     * fills the column with nothing and hides the gap — so saying so was right; saying only so was not. A
     * reader cannot act on it: the key column is shortened, so the file is not even fully visible on the row.
     *
     * ⭐ It names the file and the fix. The convention is one line at the top of the file — this shows the
     * exact line that would satisfy it, for that file, so the action is a copy rather than a lookup.
     */
    '<span class="ttl' +
    (c.automated && !c.claim ? ' noclaim' : '') +
    '">' +
    (c.automated && !c.claim
      ? (function (k) {
          var base = String(k).split('/').pop();
          return (
            '<span title="' +
            esc(
              'The board reads what a test proves from its own heading. ' +
                base +
                ' has none, so this column has nothing to show. Add a first line: ' +
                base +
                ' \u2014 what it proves.'
            ) +
            '">\u26a0 no heading in <b>' +
            esc(base) +
            '</b>' +
            '<span class="fixit">add a first line: <code>' +
            esc(base) +
            ' \u2014 what it proves</code></span></span>'
          );
        })(c.case_key)
      : esc(c.title || '')) +
    '</span>' +
    /**
     * ── ⚠️⚠️ THREE FACTS IN ONE UNLABELLED TRACK ──────────────────────────────────────────────────────────
     *
     * Athi, 2026-09-12: *"in the detail page you are showing unit under every item — if it is test type, then
     * make it as a column so it clearly states that. Also status, red every time, not able to understand what
     * it says."*
     *
     * ⚠️ THE VERDICT, THE KIND AND THE PRIORITY ALL SAT IN ONE `auto` track with no header above any of them.
     * "not run · acceptance · High" read as three unrelated words, and because the case rows live inside a
     * colspan they lined up under the PARENT table's PASSED / FAILED / NOT RUN headings — which they have
     * nothing to do with. A column heading that belongs to different data is worse than no heading.
     *
     * ⭐ Each fact gets its own track, and caseHeaderHTML() above the list names them. Same fix as the tree
     * and the table cells: a row is a TABLE, not whatever is left over after the text.
     */
    '<span class="c-kind">' +
    (c.test_type
      ? '<span class="lay ty ' + esc(c.test_type) + '" title="' + esc(LEVEL_SAYS[c.test_type] || '') + '">' + esc(c.test_type) + '</span>'
      : '<span class="dim">—</span>') +
    '</span>' +
    '<span class="c-status">' +
    last +
    '</span>' +
    '<span class="c-todo">' +
    todoHTML(c) +
    '</span>' +
    '<span class="c-pri">' +
    esc(c.priority || '') +
    '</span>' +
    '<span class="badges">' +
    /* ⚠️ ON THE ROW, not behind a filter — a tester must see it without going looking for it. */
    (STALE[c.case_key]
      ? '<span class="lay" style="background:#fbf3e3;border-color:#e8d7ae;color:#8a5a1e" title="' +
        esc('Clause ' + STALE[c.case_key].clause + ' is now v' + STALE[c.case_key].clause_now + '; this case cites v' + STALE[c.case_key].cited_version + '.') +
        '">spec moved</span>'
      : '') +
    /**
     * ⭐⭐⭐ THE OFFER IS MADE ON THE CASE, not on a tab somebody has to remember exists.
     *
     * Athi: *"the try view can be in the header of the test case itself, so people know that they can press
     * the button and run the test case."* A tester works down a list; a tool on another screen is a tool
     * they have not needed yet and will not think of.
     *
     * ⚠️ ONLY WHERE THE ENGINE *IS* THE BEHAVIOUR. A ▶ on a case that needs a shop, a screen and a person
     * would be a promise the page cannot keep — and a button that does less than it looks like it does is
     * worse than no button.
     */
    (RUNNABLE[c.case_key]
      ? '<button data-cbsid="OWN003-B32" class="btn" title="Run this here \u2014 the real engine, your own input, no server" ' +
        'onclick="event.stopPropagation();runCase(\'' +
        esc(c.case_key) +
        '\')" ' +
        'style="padding:2px 9px;font-weight:700;color:var(--blue);border-color:var(--blue)">\u25b6 Run</button>'
      : '') +
    /**
     * ⭐⭐ THE KIND, ON EVERY ROW. A reader scanning the board has to be able to tell, without clicking, whether
     * a green line means "a function returned the right number" or "a person used it and it worked". ⚠️ Those
     * are the two ends of the V and they are not substitutes for one another.
     */
    (c.layer ? '<span class="lay">' + esc(c.layer) + '</span>' : '') +
    '</span></div>';

  if (open) {
    h += '<div class="body">';
    /**
     * ⭐⭐⭐ THE FOUR FACTS A PROJECT MANAGER ASKS OF ANY TEST — Athi, 2026-09-11: *"each level, how many test
     * cases, what are they, which function it belongs to, what it proves, who runs it."*
     *
     * ⚠️ "Not stated in the file" IS ONE OF THE ANSWERS, and it is shown rather than hidden. 244 of the 464
     * automated tests carry no claim in their header; a filename dressed up as a sentence in a row headed
     * "what it proves" would be read as evidence by exactly the person reading this line.
     */
    /**
     * ⭐ WHERE IN THE PRODUCT THIS IS — first line of the body, above everything else, because a tester who
     * does not know which screen they are on cannot do anything else on this page.
     */
    if (c.menu) h += '<div class="where">' + esc(c.menu) + '</div>';
    /**
     * ⚠️⚠️ A SWEPT CASE IS A QUESTION, NOT A CHECK. The menu sweep read the rail and every capability file and
     * wrote one case per control; not one of them carries an expectation a person decided on. Marked here so
     * that a green on a generated case is read for what it is — "this control did something" — and never as
     * "this control did the right thing".
     */
    if (c.generated)
      h +=
        '<div class="swept">Swept from the menu \u2014 it names the control but carries no written expectation. Judge it against what the screen is FOR, and if you decide what it should do, write that into the case.</div>';
    if (c.areas || c.subjects || c.claim || c.run_by) {
      h += '<div class="facts">';
      if ((c.areas || []).length)
        h +=
          '<div><dt>Reaches</dt><dd>' +
          c.areas
            .map(function (item) {
              return esc(item);
            })
            .join(' · ') +
          '</dd></div>';
      if ((c.subjects || []).length)
        h +=
          '<div><dt>Module under test</dt><dd class="mono">' +
          c.subjects
            .map(function (item) {
              return esc(item);
            })
            .join('<br>') +
          '</dd></div>';
      h +=
        '<div><dt>What it proves</dt><dd>' +
        (c.claim ? esc(c.claim) : c.automated ? '<i class="dim">not stated in the file</i>' : esc(c.title || '')) +
        '</dd></div>';
      if (c.run_by) h += '<div><dt>Run by</dt><dd>' + esc(c.run_by) + '</dd></div>';
      h += '</div>';
    }
    if (c.pre) h += '<div class="meta"><b>Before you start:</b> ' + esc(c.pre) + '</div>';
    if (c.data) h += '<div class="meta"><b>Use:</b> ' + esc(c.data) + '</div>';
    if ((c.steps || []).length) {
      h += '<table class="steps"><tr><th></th><th>Do this</th><th>You should see</th></tr>';
      c.steps.forEach(function (item, index) {
        h += '<tr><td class="n">' + (index + 1) + '</td><td>' + esc(item[0]) + '</td><td>' + esc(item[1]) + '</td></tr>';
      });
      h += '</table>';
    }
    if (c.note) h += '<div class="note">' + esc(c.note) + '</div>';
    /* ⭐ the engine, inline, above the verdict buttons — so the answer and the verdict are in one glance */
    if (RUNNABLE[c.case_key]) h += runnerHTML(RUNNABLE[c.case_key]);

    h +=
      '<div class="acts">' +
      '<input data-cbsid="OWN003-I13" type="text" id="n_' +
      esc(c.case_key) +
      '" placeholder="What did you see? (kept with the result)">' +
      '<button data-cbsid="OWN003-B33" class="btn pass"    onclick="mark(\'' +
      esc(c.case_key) +
      "','pass')\">Pass</button>" +
      '<button data-cbsid="OWN003-B34" class="btn fail"    onclick="mark(\'' +
      esc(c.case_key) +
      "','fail')\">Fail</button>" +
      '<button data-cbsid="OWN003-B35" class="btn blocked" onclick="mark(\'' +
      esc(c.case_key) +
      "','blocked')\">Blocked</button>" +
      '<button data-cbsid="OWN003-B36" class="btn"         onclick="mark(\'' +
      esc(c.case_key) +
      "','skipped')\">Skip</button>" +
      '<button data-cbsid="OWN003-B37" class="btn"         onclick="caseHistory(\'' +
      esc(c.case_key) +
      '\')">History</button>' +
      '</div>' +
      '<div class="hist" id="h_' +
      esc(c.case_key) +
      '"></div>' +
      '</div>';
  }
  return h + '</article>';
}

/**
 * ⭐ Pressing ▶ opens the case AND runs it, because a tester who pressed Run wants the answer, not a form.
 * ⚠ The run happens after the paint — the inputs do not exist until the case is open.
 */
function runCase(k) {
  OPEN[k] = true;
  paint();
  var which = RUNNABLE[k];
  if (which)
    setTimeout(function () {
      try {
        runFor(which);
      } catch (_) {}
    }, 0);
  var el = document.getElementById('c_' + k);
  if (el && el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function toggle(k) {
  OPEN[k] = !OPEN[k];
  repaintCase(k);
}

/**
 * ⭐⭐ REPAINT THE ROW, NEVER THE PAGE. Standing rule, and it matters most here: repainting the board would
 * collapse every case a tester had open and scroll them back to the top, in the middle of working through a
 * module. One card changes, everything else stays exactly where it was.
 */
function repaintCase(k) {
  var el = document.getElementById('c_' + k);
  var c = CASES.filter(function (x) {
    return x.case_key === k;
  })[0];
  if (!el || !c) {
    paint();
    return;
  }
  var tmp = document.createElement('div');
  tmp.innerHTML = caseHTML(c);
  el.parentNode.replaceChild(tmp.firstChild, el);
  tally();
}

async function mark(k, status) {
  var box = document.getElementById('n_' + k);
  var note = box ? box.value.trim() : '';
  var c =
    CASES.filter(function (x) {
      return x.case_key === k;
    })[0] || {};
  saveRun();
  try {
    var r = await call('/api/testing/results', {
      method: 'POST',
      body: {
        run_id: RUN.id,
        run_label: RUN.label || null,
        project: proj() || undefined,
        results: [
          {
            case_key: k,
            module_key: c.module_key,
            status: status,
            tester_name: who() || undefined,
            run_kind: RUN.kind || 'manual',
            layer: c.layer || null,
            note: note || null
          }
        ]
      }
    });
    projectSaid(r);
    /* ⚠️ take the row the SERVER wrote, not the one we hoped it would — the time and the tester come from it */
    var saved = (r.results || [])[0];
    LAST[k] = Object.assign(
      { case_key: k, status: status, note: note, run_kind: RUN.kind, tester_name: (sess() || {}).name || 'you', at: new Date().toISOString() },
      saved || {}
    );
    OPEN[k] = status === 'fail' || status === 'blocked'; /* a failure stays open — you are about to write a note */
    repaintCase(k);
  } catch (e) {
    say('Not recorded: ' + e.message, true);
  }
}

/* ⚠ NOT `history` — a top-level function of that name writes to `window.history`, which is a read-only
   accessor on Window. The assignment fails silently in strict-ish contexts and the button does nothing. */
async function caseHistory(k) {
  var box = document.getElementById('h_' + k);
  if (!box) return;
  box.textContent = 'reading…';
  try {
    var r = await call('/api/testing/results?case_key=' + encodeURIComponent(k));
    var rows = r.results || [];
    if (!rows.length) {
      box.textContent = 'Nothing recorded for this case yet.';
      return;
    }
    /* ⭐ every row, oldest at the bottom — a flaky case is only visible as a sequence */
    box.innerHTML = rows
      .map(function (x) {
        return (
          '<span class="r">' +
          esc(x.status.toUpperCase()) +
          ' · ' +
          esc(x.tester_name || '') +
          ' · ' +
          esc(x.run_kind) +
          (x.layer ? ' · ' + esc(x.layer) : '') +
          ' · ' +
          new Date(x.at).toLocaleString() +
          (x.run_label ? ' · ' + esc(x.run_label) : '') +
          (x.note ? ' — ' + esc(x.note) : '') +
          (x.case_version ? ' <i>(case v' + x.case_version + ')</i>' : '') +
          '</span>'
        );
      })
      .join('');
  } catch (e) {
    box.textContent = e.message;
  }
}
