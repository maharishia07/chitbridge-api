<!doctype html>
<html lang="en">
<!-- OWNS  the test board: cases, runs and findings in one list, filters and folds; column widths through app/table-resize.js.
     CALLED BY Home's testing link and the walk panel.
     FLOW  load → the board read → paint → tblResizable after every paint
     CARD 29-qa-test-tooling-ux-locale-and-design-system/test-board -->
<head>
<meta charset="utf-8">
<script src="/app/device-id.js"></script>
<script src="/config.js"></script>   <!-- HX1: window.CB_API — this deploy's one api address -->
<script src="/app/helpers.js"></script>   <!-- T2-WEBPRIMS: esc · fmtMoney · monthNames — the ONE copy; loads before every script that calls them -->
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Report · Chit &amp; Bridge</title>
<!--
  THE TEST BOARD — the test cases as a thing you can tap, not a PDF you cannot write on.

  Athi, 2026-09-11: "in the PDF we cannot update pass or fail. Can we have a simple application from our framework itself to create the
  test cases and update the status and the result, so we know that each of the test cases passed and who has tested? And we can always
  append the use case. Also we can qualify with engine, transport, web, capability etc." Then: "pass/fail status for each run — unit test /
  T1 / T2 / regression and so on, manual and so on."

  ⭐⭐ NOTHING NEW WAS INVENTED UNDERNEATH IT. A test CASE is a `definition` of kind 'testcase' — authored, named, versioned, entity-isolated
  by the same RLS as everything else — because it is the same kind of thing as a tax slab: a rule somebody declared that has to be quotable
  months later against a result it produced. Only the RESULT ledger is new (b219), for the same reason the points ledger was: results
  accumulate and a definition does not.

  ⭐ AND THE RESULTS SPEAK A STANDARD. POST /api/testing/results/junit takes JUnit XML verbatim, which Playwright emits with one config line
  and which Kiwi TCMS, TestRail and Allure all import. The automated suite and a person writing on a phone land on the same board, and
  nothing here is a format anyone else would have to re-implement.

  ⚠️ APPEND-ONLY. Tapping Pass twice writes two rows; the latest wins and the earlier one stays readable. That is deliberate: "failed on
  Thursday, passed on Friday" is the useful sentence, and a flaky case shows as pass/fail/pass instead of collapsing into whatever was
  tapped last.
-->
<style>
  :root{
    --font-ui:Inter,system-ui,-apple-system,sans-serif;
    --prose:78ch;   /* ⭐ the READING measure — belongs to prose, not to the page (see main, below) */
    --ink:#20303b; --ink-2:#3a4048; --grey:#8a949c; --grey-2:#545A61;
    /**
     * ⚠️⚠️ --grey-4 IS THE PRESSABLE EDGE, AND THIS PAGE HAD NO SUCH TOKEN. Every button, select and input
     * here drew its border in --line, which measures 1.19:1 against --card — three times under WCAG
     * 1.4.11's 3:1 for a control boundary. That is Athi's own complaint, measured: *"it does not give a feel
     * that I can press the button… the entire box looks a grey of text."* The panel was fixed weeks-worth of
     * work ago; this surface never was.
     * ⭐ The value is the app's own --grey-4 (app.html), named here so the two surfaces can be checked
     * against each other rather than drifting apart quietly.
     * ⚠️ CONTROLS ONLY. --line stays on card edges, row rules and section separators: those separate rather
     * than invite, and 1.4.11 does not ask decoration for 3:1.
     */
    --grey-4:#646A72;
    --line:#e7e3d8; --line-2:#efece4; --paper:#faf8f3; --card:#fff;
    --blue:#3F66A6; --blue-tint:#E9F0FA;
    --ok:#2c7a43; --ok-tint:#e6f4ea;
    --bad:#b4453f; --bad-tint:#fbeceb;
    --warn:#8a5a1e; --warn-tint:#fbf3e3;
    --neutral-tint:#EEF1F5;
    /**
     * ── ⭐⭐ THE APP'S NAMES FOR THE SAME THREE MEANINGS ─────────────────────────────────────────────────
     *
     * This page grew its own palette: --ok / --bad / --warn. The app calls the same three --ok-2 / --disp /
     * --warn-2. The VALUES are near-identical, which makes the split worse rather than better: nothing warns
     * you when they drift, and --bad #b4453f vs --disp #b4453f is already one edit from disagreeing.
     *
     * ⭐ ALIASES, NOT A RENAME — the values are unchanged, so nothing moves on screen, and the ~60 existing
     * --ok/--bad/--warn call sites do not all have to migrate in one commit. New code writes the app's names
     * and the two surfaces are now checkable against each other.
     *
     * ⚠️ I NEEDED THIS IMMEDIATELY AND FOUND OUT THE HARD WAY: the §3b renderer above was written in the
     * app's vocabulary and referenced three tokens this page had never defined. An undefined custom property
     * is invalid at computed-value time — a `color` falls back to inherited, an SVG `fill` falls back to
     * BLACK — and neither says a word. The same trap is recorded at the chart palette below, where --flat
     * painted the largest slice of every chart black. [[feedback-silence-is-the-bug]]
     */
    --disp:var(--bad); --ok-2:var(--ok); --warn-2:var(--warn);
    --danger-tint:var(--bad-tint);
    /**
     * ── ⚠️⚠️ 11px FOR THE TEXT THAT CARRIES THE MEANING ──────────────────────────────────────────────────
     *
     * Athi, 2026-09-12: *"test report are good, but couldn't read, you kept the font size so small, can you
     * make it bigger."*
     *
     * ⚠️ AND --fs-1 WAS THE WORST PLACE TO BE SMALL. It is not just chips and badges: it is the PURPOSE
     * column, the row notes, the "on what evidence" column — every sentence on this board that a person is
     * actually meant to READ. I spent the day making sure those sentences were complete and then set them at
     * eleven pixels.
     *
     * ⭐ The whole scale moves together, which is what the tokens are for. ~1.18× across the board, and the
     * em-based grid tracks scale with it so nothing needs re-tuning.
     * ⭐ --ui is separate now: controls and chips do NOT need to grow with the prose, and growing them is what
     * makes a bumped page feel clumsy rather than legible.
     */
    /**
     * ⚠️⚠️ AND IN px THE CONTROL WOULD HAVE DONE NOTHING. I set the scale in pixels and then wrote an A−/A+
     * that scales the ROOT — and a percentage on the root moves rem and em, never px. The buttons would have
     * clicked, the value would have persisted, and not one character on the page would have changed size.
     *
     * ⭐ Caught before it shipped by asking what the wire actually carries rather than whether it was
     * connected. rem is what makes the root multiplier mean anything: 1rem = the root size, so every token
     * below moves with it. The px values in the comments are what each resolves to at the 16px default.
     */
    --fs-1:0.8125rem;   /* 13px  — the reading size: purposes, notes, evidence */
    --fs-2:0.9062rem;   /* 14.5px — table rows */
    --fs-3:1rem;        /* 16px  — base + section headings */
    --fs-4:1.1875rem;   /* 19px  — h1 */
    --fs-5:1.5rem;      /* 24px */
    --ui:0.7812rem;     /* 12.5px — chips, pills, controls: deliberately NOT the reading size */
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:var(--font-ui); color:var(--ink); background:var(--paper);
        font-size:var(--fs-3); font-variant-numeric:tabular-nums; -webkit-text-size-adjust:100%; }

  /**
   * ⭐ THE FROZEN BLOCK: title, tally chips and the five tabs. Sticky moves to the WRAPPER — two separately
   * sticky children each stick to the viewport top and overlap each other, which is why this is one element.
   */
  .frozen{ position:sticky; top:0; z-index:20; background:var(--card); box-shadow:0 1px 0 var(--line); }
  header{ background:var(--card); border-bottom:1px solid var(--line); padding:9px 14px; }
  .htop{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  h1{ font-size:var(--fs-4); margin:0; }
  .sub{ color:var(--grey-2); font-size:var(--fs-2); }
  .tally{ display:flex; gap:6px; flex-wrap:wrap; margin-top:7px; }
  .t{ font-size:var(--fs-1); padding:2px 8px; border-radius:99px; border:1px solid var(--grey-4);
        background:var(--paper); white-space:nowrap; }
  /* ⭐ these three are controls now, so they say so — see tally() */
  .t[onclick]{ cursor:pointer; }
  .t[onclick]:hover{ border-color:var(--blue); color:var(--blue); }
  .t[onclick]:focus-visible{ outline:2px solid var(--blue); outline-offset:1px; }
  .t.on{ border-color:var(--blue); background:var(--blue-tint); color:var(--blue); font-weight:600; }
  .t b{ font-size:var(--fs-2); }
  .t.pass{ background:var(--ok-tint); border-color:#bfe0c9; color:var(--ok); }
  .t.fail{ background:var(--bad-tint); border-color:#eccbc9; color:var(--bad); }
  .t.blocked{ background:var(--warn-tint); border-color:#e8d7ae; color:var(--warn); }
  .t.todo{ background:var(--neutral-tint); color:var(--grey-2); }

  /**
   * ⭐ AN ACTIVE FILTER CHANGES THE BAR ITSELF. Athi asked for “a difference in colour if filter active OR a
   * reset icon” — it is both, because a colour tells you THAT something is filtered and the control tells you
   * WHAT and gives you the way out. Either alone leaves you hunting.
   */
  .bar.filtered{ background:var(--blue-tint); border-bottom-color:var(--blue); }
  /**
   * ⭐ THE GRIP. 6px is the smallest target a person reliably hits without it becoming visible furniture —
   * it stays invisible until the pointer is in the header, then shows where the edge is.
   * ⚠️ z-index above the cell text, or a long heading swallows the handle and the column cannot be dragged.
   */
  th{ position:relative; }
  /* the grip's look (the always-visible "pipeline") lives with the control: app/table-resize.js */
  .fclear{ margin-inline-start:auto; display:inline-flex; align-items:center; gap:8px;
        font-size:var(--fs-1); color:var(--blue); font-weight:600; }
  #f_clear:disabled{ opacity:.45; cursor:default; }
  #f_clear:disabled:hover{ background:var(--card); color:var(--ink); }
  .bar{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; padding:8px 14px;
        border-bottom:1px solid var(--line); background:var(--card); }
  .bar label{ font-size:var(--ui); color:var(--grey-2); text-transform:uppercase; letter-spacing:.06em; }
  select, input[type=text]{ font:inherit; font-size:var(--ui); padding:5px 7px; border:1px solid var(--grey-4);
        border-radius:7px; background:#fff; color:var(--ink); min-height:32px; }
  input[type=text]{ min-width:120px; flex:1 1 140px; }
  .btn{ font:inherit; font-size:var(--ui); padding:6px 11px; border:1px solid var(--grey-4); border-radius:8px;
        background:var(--card); color:var(--ink); cursor:pointer; white-space:nowrap; min-height:32px; }
  .btn.pri{ background:var(--blue); color:#fff; border-color:var(--blue); }
  /* ⚠️ THE REPORT HAD NO PRESSABLE-EDGE TOKEN. --line is 1.19:1 on --card; this is the app's own value
     (app.html --grey-4), named here so the two surfaces can be checked against each other. */
  .btn:focus-visible, select:focus-visible, input:focus-visible{ outline:2px solid var(--blue); outline-offset:1px; }

/**
 * ── ⚠️⚠️ A 980px COLUMN ON A 2560px SCREEN, AND EVERY TABLE SQUEEZED INTO IT ────────────────────────────────
 *
 * Athi, 2026-09-11: *"you can see what the full screen size is and you bring it for the entire screen."*
 *
 * ⚠️ 980px is a READING measure, and it is the right one for a paragraph — but this board is mostly TABLES:
 * eleven engine rules each stating a full sentence of purpose beside four numeric columns, and the pivot with
 * a column per kind. Held at 980 the purpose column got maybe thirty characters of track and wrapped into a
 * tall grey block, on a screen with two thirds of its width empty.
 *
 * ⭐ So the measure moves OFF the page and ONTO the prose. `main` takes the screen (1760 is a runaway guard for
 * an ultrawide, not a layout); the paragraphs that are actually read keep ~78 characters via --prose. A table
 * wants width, a sentence does not, and they no longer have to agree.
 */
  /**
   * ⭐⭐ A CONTROL, NOT JUST A BIGGER NUMBER. Athi asked once for bigger text; the honest fix is that HE sets
   * it, because the right size depends on the screen he happens to be at and I cannot see that. The whole page
   * is driven by one scale, so a multiplier on the root moves everything together — prose, tables, tree and
   * chart labels — with no layout re-tuning, which is the payoff for having tokenised it in the first place.
   *
   * ⚠️ It persists per browser (localStorage), wrapped, because a private window or blocked site data throws
   * on read and the page must still render at the default rather than not at all.
   */
  html{ font-size:100%; }
  .tsize{ display:inline-flex; gap:0; margin-inline-start:auto; align-items:center; }
  .tsize button{ font:inherit; font-size:var(--ui); line-height:1; padding:5px 9px; cursor:pointer;
        border:1px solid var(--grey-4); background:var(--card); color:var(--ink-2); min-height:30px; }
  .tsize button:first-child{ border-radius:7px 0 0 7px; }
  .tsize button:last-child{ border-radius:0 7px 7px 0; border-inline-start:0; }
  .tsize button:hover{ background:var(--neutral-tint); }
  /* ⭐ outside #main, so a repaint cannot wipe it — see seed() */
  #notice.notice{ position:relative; margin:10px 18px 0; padding:11px 40px 11px 14px; border-radius:10px;
        background:var(--blue-tint); border:1px solid var(--blue); color:var(--ink);
        font-size:var(--fs-2); line-height:1.55; max-width:var(--prose); }
  #notice.notice.bad{ background:var(--bad-tint,#fdeceb); border-color:#eccbc9; }
  #notice .n2{ margin-top:4px; font-size:var(--fs-1); }
  #notice .x{ position:absolute; inset-block-start:6px; inset-inline-end:8px; border:0; background:none;
        font-size:var(--fs-3); line-height:1; cursor:pointer; color:var(--grey-2); padding:2px 6px; }
  #notice .x:hover{ color:var(--ink); }
  main{ padding:12px 18px 80px; max-width:1760px; margin:0 auto; }
  /* ⭐ the reading measure, kept for prose only — see above */
   .note, .lede, .prose{ max-width:var(--prose); }
  .mod{ margin:0 0 18px; }
  .case{ background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:8px; overflow:hidden; }
  .case.pass{ border-left:4px solid var(--ok); }
  .case.fail{ border-left:4px solid var(--bad); }
  .case.blocked{ border-left:4px solid var(--warn); }
  .case.skipped{ border-left:4px solid var(--grey); }
  /**
   * ── ⭐⭐⭐ THE ROW IS A TABLE, NOT A FLEX LINE ──────────────────────────────────────────────────────────────
   *
   * Athi, 2026-09-11: *"this is not properly aligned… can you keep as a proper tabular format, so we know the
   * status clearly."*
   *
   * ⚠️⚠️ AS FLEX, THE KEY SET THE FIRST COLUMN AND EVERY ROW SET IT DIFFERENTLY. While every case was a
   * five-character CTR-01 it looked like a table by luck; the moment the 464 file-backed cases arrived, a row
   * keyed `chitbridge-api/scripts/journey-supplier-hop.js` sat beside one keyed `gold-demo.js` and the titles
   * started at a different x on every line. There was nothing for the eye to run down.
   *
   * ⚠️ AND THE VERDICT WAS NESTED INSIDE THE TITLE, wrapping underneath it and moving with the text — so the
   * one column a person scans was the one column that never held still.
   *
   * ⭐ Fixed tracks: key, title, then the badges. `min-width:0` on the title is what lets a long one shrink
   * instead of shoving everything right of it off the edge.
   */
  /**
   * ── ⭐ FIVE NAMED TRACKS, so every value on a case row sits under a word that describes it ────────────────
   *
   * Athi, 2026-09-12: *"in the detail page you are showing unit under every item — if it is test type, then
   * make it as a column so it clearly states that. Also status, red every time, not able to understand."*
   *
   * ⚠️ THE VERDICT, THE KIND AND THE PRIORITY SHARED ONE `auto` TRACK with no header above any of them, and
   * because the case list lives inside a colspan they visually lined up under the PARENT table's PASSED /
   * FAILED / NOT RUN headings — which they have nothing to do with. A heading that belongs to different data
   * is worse than no heading: the reader trusts it.
   *
   * ⚠️ The three fact tracks are em-based so they hold their width whatever the title does. That is the whole
   * point of a column — a reader runs their eye DOWN it, and a column that moves per row is not one.
   */
  .chead{ display:grid;
        grid-template-columns:minmax(0,15em) minmax(0,1fr) 7.5em 6em 11em 5em auto; gap:9px;
        align-items:baseline; padding:9px 11px; cursor:pointer; }
  .chead .c-kind, .chead .c-status, .chead .c-todo, .chead .c-pri{ font-size:var(--fs-1); min-width:0; }
  /* ⭐ the action, not the adjective — short enough to hold a column, full sentence in the tooltip */
  .todo{ white-space:nowrap; font-weight:600; }
  .chead .c-pri{ color:var(--grey-2); }
  /* ⭐ the header row is the SAME grid, so it cannot drift from the rows beneath it */
  .chead.chhead{ cursor:default; font-size:var(--fs-1); text-transform:uppercase; letter-spacing:.06em;
        color:var(--grey-2); font-weight:700; padding:6px 11px 4px; border-bottom:1px solid var(--line);
        margin:0 0 4px; background:none; }
  .chead.chhead .key{ background:none; padding:0; color:var(--grey-2); font-weight:700; }
  .chead.chhead .ttl{ font-weight:700; }
  /**
   * ⚠️ THE LAST ELLIPSIS ON THE PAGE, and it was hiding the useful half. A case key is a PATH —
   * 'chitbridge-api/scripts/journey-supplier-hop.js' — and clipping the end of a path removes the filename,
   * which is the part that identifies it. Every row read 'chitbridge-api/scri…'.
   * ⭐ It wraps on its own separators now. The column is a fixed track, so the rows still line up.
   */
  .chead .key{ font-family:ui-monospace,Menlo,monospace; font-size:var(--fs-1); font-weight:700; color:var(--grey-2);
        background:var(--neutral-tint); border-radius:5px; padding:2px 6px;
        overflow-wrap:anywhere; word-break:break-word; }
  /**
   * ⚠️ AND THE SAME FAULT ONE LAYER UP: this clipped every case title to a single line with an ellipsis, which
   * is the other half of *"many of the text are only partly present"*. It was there to keep the rows on a grid
   * — but the grid comes from the fixed TRACKS, not from forcing one line, so a title can wrap and the columns
   * still line up. ⭐ It now wraps to as many lines as the title needs — nothing is hidden.
   */
  .chead .ttl{ min-width:0; font-weight:600; line-height:1.35; font-size:var(--fs-2);
        overflow-wrap:anywhere; }
  .chead .ttl.noclaim{ font-weight:400; color:var(--grey-2); }
  /* ⭐ the action under the finding — a line to copy, not a thing to go and look up */
  .chead .ttl.noclaim b{ font-family:ui-monospace,Menlo,monospace; font-weight:600; color:var(--ink-2); }
  .fixit{ display:block; font-size:var(--fs-1); color:var(--grey); margin-top:2px; }
  .fixit code{ font-family:ui-monospace,Menlo,monospace; background:var(--neutral-tint);
        border-radius:4px; padding:1px 5px; }
  /* ⭐ the verdict lives in the badge track now, so it is in the same place on every row */
  .chead .badges{ display:flex; gap:6px; align-items:center; white-space:nowrap; }
  .chead .last{ font-size:var(--fs-1); font-weight:700; }
  .chead .last.none{ font-weight:400; color:var(--grey-2); }
  .chead .ttl .last.fail{ color:var(--bad); }
  .pri{ font-size:var(--fs-1); color:var(--grey-2); white-space:nowrap; }
  .lay{ font-size:var(--fs-1); border:1px solid var(--line); border-radius:99px; padding:1px 7px; color:var(--grey-2);
        background:var(--paper); white-space:nowrap; }
  /* ⭐ the kind reads at a glance, and the WIDTH of the ladder is the point: acceptance is the darkest because
     it is the only evidence a customer would recognise; support is the faintest because it proves nothing. */
  .lay.ty{ font-weight:700; letter-spacing:.02em; }
  .lay.ty.acceptance { color:#1d4ed8; border-color:#c3d4fb; background:#f2f6ff; }
  .lay.ty.system     { color:#0f766e; border-color:#bfe0dc; background:#f1faf8; }
  .lay.ty.integration{ color:#7c4a03; border-color:#e8d7ae; background:#fdf8ee; }
  .lay.ty.unit       { color:#3f6212; border-color:#d3e3b8; background:#f6faf0; }
  .lay.ty.static     { color:#5b5b66; border-color:var(--line); background:var(--paper); }
  .lay.ty.support    { color:var(--grey-2); border-style:dashed; background:transparent; }

  .body{ padding:0 11px 11px; border-top:1px solid var(--line-2); }
  /* ⭐ the four project-manager facts, side by side and wrapping — a grid so the labels line up down the page */
    /* ⭐ the door, drawn like the menu itself — one quiet line, the same separator the rail uses */
  .where{font-size:12px;color:var(--grey-2);letter-spacing:.03em;margin:0 0 7px}
  .swept{font-size:12px;margin:0 0 8px;padding:6px 9px;border-radius:7px;
    background:#fff8ea;border:1px solid #f0e3c4;color:#7a5c17}
  .facts{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:1px;
          background:var(--line-2); border:1px solid var(--line-2); margin:9px 0 2px; }
  .facts > div{ background:var(--paper); padding:7px 9px; }
  .facts dt{ font-size:var(--fs-1); text-transform:uppercase; letter-spacing:.06em; color:var(--grey-2);
             font-weight:700; margin:0 0 2px; }
  .facts dd{ margin:0; font-size:var(--fs-1); color:var(--ink-2); line-height:1.5; }
  .facts dd.mono{ font-family:ui-monospace,Consolas,monospace; }
  .facts dd i.dim{ color:var(--grey-2); }
  .meta{ font-size:var(--fs-1); color:var(--grey-2); margin:8px 0; line-height:1.6; }
  .meta b{ color:var(--ink-2); }
  table.steps{ width:100%; border-collapse:collapse; font-size:var(--fs-2); margin:6px 0 2px; }
  table.steps th{ text-align:left; font-size:var(--fs-1); text-transform:uppercase; letter-spacing:.06em;
        color:var(--grey-2); border-bottom:1px solid var(--line); padding:4px 6px; font-weight:700; }
  table.steps td{ border-bottom:1px solid var(--line-2); padding:6px; vertical-align:top; line-height:1.45; }
  table.steps td.n{ width:22px; color:var(--grey); font-size:var(--fs-1); }
  .note{ font-size:var(--fs-1); color:var(--grey-2); line-height:1.55; background:var(--paper);
        border:1px solid var(--line-2); border-radius:8px; padding:7px 9px; margin:8px 0 0; }
  .acts{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  .acts .btn.pass{ background:var(--ok-tint); border-color:#bfe0c9; color:var(--ok); font-weight:700; }
  .acts .btn.fail{ background:var(--bad-tint); border-color:#eccbc9; color:var(--bad); font-weight:700; }
  .acts .btn.blocked{ background:var(--warn-tint); border-color:#e8d7ae; color:var(--warn); font-weight:700; }
  .acts input[type=text]{ flex:1 1 100%; }
  .hist{ font-size:var(--fs-1); color:var(--grey-2); margin-top:8px; line-height:1.6; }
  .hist .r{ display:block; }

  .say{ padding:14px; background:var(--card); border:1px solid var(--line); border-radius:10px; line-height:1.6; }
  .say b{ display:block; margin-bottom:5px; }
  /* ── the summary: coverage by area, and the sittings ── */
  .tabs{ display:flex; flex-wrap:wrap; gap:4px;   /* ⚠ five tabs need ~430px and a phone is 360 */ }
  .tabs button{ font:inherit; font-size:var(--fs-2); padding:6px 13px; border:1px solid var(--grey-4);
        background:var(--card); color:var(--grey-2); border-radius:8px; cursor:pointer; min-height:32px; }
  .tabs button.on{ background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600; }
  table.sum{ width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line);
        border-radius:11px; overflow:hidden; font-size:var(--fs-2); margin-bottom:22px; }
  table.sum th{ text-align:start; font-size:var(--fs-1); text-transform:uppercase; letter-spacing:.06em;
        color:var(--grey-2); font-weight:700; padding:9px 11px; background:var(--neutral-tint);
        border-bottom:1px solid var(--line); white-space:nowrap; }
  table.sum td{ padding:9px 11px; border-bottom:1px solid var(--line-2); vertical-align:middle; }
  table.sum tr:last-child td{ border-bottom:0; }
  /**
   * ── ⚠️⚠️ "CASESPASSEDFAILED" — HEADERS RUNNING INTO EACH OTHER ────────────────────────────────────────────
   *
   * Athi, 2026-09-12: *"text are overlapping."*
   *
   * ⚠️ `white-space:nowrap` was already here and is NOT enough. When a table's content needs more width than
   * its container has, the browser compresses cells as a last resort and nowrap does not save them — the words
   * end up touching. It never showed locally because this page is wide; at a bigger text size in a narrower
   * window the same table needs 1812px inside 1724px and starts squeezing.
   *
   * ⭐ A minimum width makes the columns INCOMPRESSIBLE, so the table overflows into .scroll — which exists for
   * exactly that — instead of folding in on itself. Overflowing is visible and scrollable; compressing is
   * silent and unreadable.
   */
  /**
   * ⚠️ 4.6em WAS THE LABEL'S WIDTH WITH NOTHING AROUND IT, so "CASES" rendered as "CASE" and "NOT RUN" ran
   * to the table edge. A minimum that exactly fits the text leaves no room for the padding that separates one
   * column from the next — which is what Athi is asking for: a character of air front and back.
   * ⭐ ch is the right unit for that, because it IS the width of a character: 1ch each side, plus a floor wide
   * enough for the longest heading these tables use.
   */
  table.sum td.num, table.sum th.num{ text-align:end; width:1%; white-space:nowrap;
        min-width:7.5ch; padding-inline:1ch; }
  /* ⭐ the first column too — a key or a name pressed against the table edge reads as clipped even when it is not */
  table.sum th:first-child, table.sum td:first-child{ padding-inline-start:1ch; }
  table.sum .area{ font-family:ui-monospace,Menlo,monospace; font-weight:700; font-size:var(--fs-1); }
  /* ⭐ the feature key is a code, so it keeps its own narrow track and never wraps */
  table.sum td .area{ white-space:nowrap; }
  table.sum .sub{ display:block; color:var(--grey-2); font-size:var(--fs-1); font-weight:400; }
  table.sum tr.clickable{ cursor:pointer; }
  table.sum tr.clickable:hover td{ background:var(--blue-tint); }
  /* ⭐ ONE BAR, READ AT A GLANCE. A row of numbers is arithmetic; a bar is a state. */
  .bar-cov{ display:flex; height:7px; border-radius:4px; overflow:hidden; background:var(--neutral-tint);
        min-width:90px; }
  .bar-cov i{ display:block; height:100%; }
  .big{ color:var(--ok); font-weight:700; } .bad{ color:var(--bad); font-weight:700; }
  .warnn{ color:var(--warn); font-weight:700; } .dim{ color:var(--grey-2); }

  /* ── ⭐ the totals ARE the third filter — see the note in the toolbar ── */
  .tot{ display:flex; gap:13px; align-items:baseline; margin-inline-start:auto; flex-wrap:wrap; }
  .tot b{ font-size:var(--fs-3); font-weight:700; font-variant-numeric:tabular-nums; cursor:pointer;
          border-bottom:2px solid transparent; padding-bottom:1px; }
  .tot b:hover{ border-bottom-color:var(--line); }
  .tot b.on{ border-bottom-color:var(--blue); color:var(--blue); }
  .tot b.bad{ color:var(--bad); } .tot b.bad.on{ border-bottom-color:var(--bad); }
  .tot span{ font-size:var(--fs-1); color:var(--grey-2); margin-inline-start:3px; }

  /* ── ⭐ the expansion line · chips say their own name and their own count, so they need no legend ── */
  .bar.chips{ gap:5px; padding-top:0; border-top:0; }
  .chip{ font-size:var(--fs-1); border:1px solid var(--grey-4); background:var(--card); color:var(--ink-2);
         border-radius:99px; padding:2px 9px; cursor:pointer; font-weight:600; }
  .chip i{ font-style:normal; color:var(--grey-2); font-variant-numeric:tabular-nums; margin-inline-start:3px; }
  .chip:hover{ border-color:var(--grey-2); }
  .chip.on{ background:var(--blue); border-color:var(--blue); color:#fff; }
  .chip.on i{ color:#fff; opacity:.75; }
  .chip.clear{ border-style:dashed; color:var(--grey-2); font-weight:400; }
  .chipnote{ font-size:var(--fs-1); color:var(--grey-2); align-self:center; margin-inline-start:6px; }

  /* ── ⭐ completion, as a bar and a number: a fraction is not a progress report ── */
  table.mtx td.sep, table.mtx th.sep{ border-inline-start:2px solid var(--line); width:6px; padding:0; }
  table.mtx tr.foot td{ background:var(--paper); font-weight:700; border-top:2px solid var(--line); }
  .pctcell{ min-width:88px; }
  .pbar{ height:5px; background:var(--line-2); border-radius:99px; overflow:hidden; margin-bottom:3px; }
  .pbar i{ display:block; height:100%; background:var(--ok); }
  .pnum{ font-size:var(--fs-1); font-variant-numeric:tabular-nums; color:var(--grey-2); }
  /* ⚠️ a column we KNOW should exist and does not carries its zero in the heading, so the gap is not silence */
  .zeroflag{ font-style:normal; color:var(--warn); font-weight:700; }
  /* ⭐ the caveat that has to be available without being in the way */
  .fine{ display:block; margin-top:3px; color:var(--grey-2); opacity:.85; }
  /* ⭐ a row’s own boundary, in its own words — prose, so it keeps the reading measure */
  /* ⭐ a name cell is a row: the name on the left, its chips against the right edge */
  table.inside td.named{ display:flex; align-items:baseline; gap:8px; }
  table.inside td.named .k{ min-width:0; overflow-wrap:anywhere; }
  table.inside td.named .chips{ margin-inline-start:auto; display:flex; gap:5px; align-items:baseline;
        flex:0 0 auto; }
  /* ⚠️ shared is NOT a warning — it is the correct state for reference data, so it must not look like one */
  .tag.tier-shared{ background:var(--neutral-tint); color:var(--grey-2); }
  .tag.tier-unguarded{ background:var(--warn-tint,#FDF1DC); color:var(--warn-2,#8A5A00); font-weight:700; }
  /**
   * ── ⭐⭐ THE AREA NOTE IS A LIST, BECAUSE IT WAS ALWAYS A LIST ─────────────────────────────────────────
   *
   * Athi, 2026-09-13: *"under database, big text is there, similarly for everything, engine and so on, can
   * you simplify and make it bullet point?"*
   *
   * ⚠️ THE STRUCTURE WAS ALREADY IN THE STRING and was being thrown away at render. Every one of these notes
   * separates its items with " · " and marks its warnings with ⚠ — the Database note has three RLS states
   * and three caveats in it — and all of it was poured into ONE paragraph, where a reader has to re-find the
   * boundaries the author already put there. Nothing needed rewriting; it needed not flattening.
   * ⚠️ --grey-4, not --line, on the rule: 1.19:1 is not an edge.
   */
  .areanote{ max-width:var(--prose); margin:2px 0 10px; padding:8px 11px; font-size:var(--fs-1);
        line-height:1.55; color:var(--ink-2); background:var(--paper);
        border-inline-start:3px solid var(--grey-4); border-radius:0 7px 7px 0; }
  .areanote p{ margin:0; }
  .areanote ul{ margin:6px 0 0; padding-inline-start:18px; }
  .areanote li{ margin:3px 0; }
  /* a warning bullet carries its meaning in the token, not only in the glyph */
  .areanote li.warn{ color:var(--warn); }
  .areafoot{ max-width:var(--prose); margin:-12px 0 22px; font-size:var(--fs-1); line-height:1.55;
        color:var(--grey-2); }

  /**
   * ── ⭐ THE TREE, BORROWING cap-network.js's SHAPE ─────────────────────────────────────────────────────────
   * Depth is padding-inline-start, the glyph carries the branch, the purpose sits underneath its own node.
   * ⚠️ The network tree clamps that purpose to one line with nowrap + ellipsis. Not copied — that is the exact
   * fault Athi reported on this board, and a pattern's bugs are not part of the pattern.
   */
  .tree{ background:var(--card); border:1px solid var(--line); border-radius:11px; padding:8px 4px;
        margin-bottom:14px; overflow-x:auto; }
  .tnode{ padding:6px 10px; border-radius:8px; font-size:var(--fs-2); line-height:1.4;
        display:flex; flex-wrap:wrap; align-items:baseline; gap:7px; }
  /**
   * ⭐ A FILE ROW IS A TABLE ROW. Four tracks, so the purpose column starts at one x down the whole tree.
   * ⚠️ minmax(0, …) on every flexible track — without the 0 floor a long word sets the minimum and the row
   * grows past the container instead of wrapping inside it.
   */
  .tnode.tleaf{ display:grid; gap:0 10px; align-items:baseline;
        grid-template-columns:auto minmax(0,15em) minmax(0,13em) minmax(0,1fr); }
  .tnode.tleaf .tnote{ margin:0; grid-column:4; }
  .tbadges{ display:flex; gap:5px; align-items:baseline; flex-wrap:wrap; min-width:0; }
  .tnode[onclick]{ cursor:pointer; }
  .tnode[onclick]:hover{ background:var(--neutral-tint); }
  .tnode.open{ background:var(--neutral-tint); font-weight:600; }
  .tglyph{ font-family:ui-monospace,Menlo,monospace; color:var(--grey); flex:0 0 auto; }
  .tlabel{ font-weight:600; }
  .tcount{ font-family:ui-monospace,Menlo,monospace; font-size:var(--fs-1); font-weight:700;
        background:var(--neutral-tint); border-radius:5px; padding:1px 6px; font-variant-numeric:tabular-nums; }
  .tof{ font-size:var(--fs-1); color:var(--grey-2); font-weight:400; }
  .ttier{ font-size:var(--fs-1); color:var(--grey); font-weight:400; margin-inline-start:auto;
        text-transform:uppercase; letter-spacing:.06em; }
  .tarea{ font-size:var(--fs-1); font-weight:700; border-radius:5px; padding:1px 6px;
        background:var(--blue-tint); color:var(--blue); }
  /* ⭐ the purpose WRAPS, and keeps the reading measure — it is a sentence, not a label */
  .tnote{ flex:1 1 100%; max-width:var(--prose); font-size:var(--fs-1); color:var(--grey-2);
        font-weight:400; line-height:1.55; margin-top:2px; }
  /**
   * ⚠️ AN AREA NOTE IS A BLOCK ON ITS OWN LINE, not a column beside the row. `.ttier` carries
   * `margin-inline-start:auto` to push "THE PRODUCT" to the right edge, and the note wrapping after it was
   * being read as a right-hand column with a hand-span of nothing to its left. `order` puts it after the
   * tier chip in the wrap order but at the start of its own line, which is where a paragraph belongs.
   */
  .tnote-area{ order:9; }
  .tnote-area .areanote{ margin:4px 0 2px; }
  /* ⭐ a grade as a POSITION, not a number to be averaged; hollow pips are the declared target */
  .pips{ display:inline-flex; gap:3px; align-items:center; }
  .pips i{ width:9px; height:9px; border-radius:50%; border:1.5px solid var(--line);
        background:transparent; display:inline-block; }
  .pips i.on{ background:var(--blue); border-color:var(--blue); }
  .pips i.want{ border-color:var(--blue); border-style:dashed; }
  .sumswitch{ display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin:0 0 12px; }
  .sumswitch .fine{ flex:1 1 100%; max-width:var(--prose); margin-top:2px; }
  /* ⭐ the journey position, shown so the ordering is legible rather than merely applied */
  /* ⭐ the core group, readable at a glance and comparable down a column */
  /* ── ⭐ folding ── */
  /* ⚠️ .lens is gone: the question each tab answers now rides on the tab's own title= */
  /* ── ⭐ the Cases tab as one table: a row per area, expandable in place ── */
  table.areas td{ vertical-align:middle; }
  /**
   * ⚠️⚠️ SCOPED TO THE WRONG TABLE. Athi: *"the mouse pointer is not coming when I go to expand the engine or
   * middleware."* These rules said `table.areas`, which is the Cases pivot; the matrix is `table.mtx`. Its
   * rows carried the same class, the same handler and the same caret — and looked completely inert, because
   * nothing under the cursor said it could be pressed.
   * ⭐ A control that does not look like a control is a control nobody presses. The rules are on the CLASS now,
   * so any table that builds a foldable row gets them without anybody remembering to.
   */
  .arow{ cursor:pointer; }
  .arow:hover td{ background:var(--neutral-tint); }
  .arow.open td{ background:var(--neutral-tint); }
  .arow:focus-visible td{ outline:2px solid var(--blue); outline-offset:-2px; }
  /* ⭐ and the caret turns, so the row says which way it is about to go */
  .arow .caret{ transition:transform .12s ease; display:inline-block; }
  .arow:hover .caret{ color:var(--ink-2); }
  table.areas .aname{ margin-inline-start:8px; font-weight:600; }
  table.areas .k{ font-family:ui-monospace,Menlo,monospace; font-size:var(--fs-1); color:#fff;
        background:var(--grey-2); border-radius:4px; padding:1px 6px; }
  table.areas .reach{ white-space:nowrap; }
  /* ⚠️ the expanded cases span every column, so opening one area cannot shift the columns of the others */
  table.areas .acases > td{ padding:2px 11px 12px; background:var(--paper); }
  table.areas tfoot td{ background:var(--neutral-tint); border-top:2px solid var(--line); font-weight:700; }
  /* ⭐ the pivot sits with the filters, because choosing the cut is the same kind of act as choosing a subset */
  /* ⭐ the two levels of the architecture, NAMED on the table rather than implied by the order */
  table.mtx tr.tier td{ background:var(--paper); font-size:var(--fs-1); font-weight:700; letter-spacing:.08em;
        text-transform:uppercase; color:var(--grey-2); padding:10px 11px 4px; border-bottom:0; }
  /* ⭐ how mature a rule is — the codebase has always known, and never been asked */
  .stage{ font-size:var(--fs-1); font-weight:700; border-radius:99px; padding:1px 8px;
        margin-inline-start:7px; text-transform:uppercase; letter-spacing:.04em; }
  .stage.proven{ color:var(--ok-2,var(--ok)); background:var(--ok-tint); }
  .stage.tested{ color:var(--blue); background:var(--blue-tint,var(--neutral-tint)); }
  .stage.held{ color:var(--warn-2,var(--warn)); background:var(--warn-tint); }
  /* ── ⭐ what an area CONTAINS, opened in place ── */
  .built{ font-size:var(--fs-3); font-variant-numeric:tabular-nums; }
  .builtwhat{ display:block; font-size:var(--fs-1); color:var(--grey-2); font-weight:400; margin-top:1px; }
  table.inside{ width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line-2);
        margin:4px 0 2px; }
  table.inside th{ text-align:start; font-size:var(--fs-1); text-transform:uppercase; letter-spacing:.07em;
        color:var(--grey-2); padding:7px 10px; border-bottom:1px solid var(--line-2); background:var(--paper); }
  table.inside td{ padding:6px 10px; border-bottom:1px solid var(--line-2); vertical-align:top;
        font-size:var(--fs-1); line-height:1.45; }
  table.inside tr:last-child td{ border-bottom:0; }
  table.inside .k{ font-family:ui-monospace,Menlo,monospace; font-weight:700; color:var(--ink); }
  .tag.tier-pure{ color:var(--ok-2,var(--ok)); border-color:var(--ok); margin-inline-start:6px; }
  .tag.tier-bound{ color:var(--grey-2); margin-inline-start:6px; }
  /* ⚠️ the unplaced are shown as an absence, not as an area — they are not part of the architecture */
  table.mtx tr.unplaced td{ background:var(--paper); }
  table.mtx tr.unplaced .area{ color:var(--grey-2); font-style:italic; }
  .pivotbar{ gap:7px; }
  .foldbar{ display:flex; gap:6px; align-items:center; margin:0 0 12px; }
  .foldbar .foldnote{ font-size:var(--fs-1); color:var(--grey-2); margin-inline-start:4px; }
  .caret{ font-size:var(--fs-2); color:var(--grey-2); width:.9em; display:inline-block; }
  /* ⭐ the counts on the header are what make a FOLDED section still worth looking at */
  .mod.shut{ margin-bottom:4px; }
  .grp{ display:inline-block; font-size:var(--fs-1); font-weight:600; color:var(--ink-2);
        background:var(--neutral-tint); border-radius:99px; padding:1px 8px; margin-inline-end:4px;
        white-space:nowrap; }
  .step{ font-family:ui-monospace,Menlo,monospace; font-size:var(--fs-1); color:var(--grey-2);
        background:var(--neutral-tint); border-radius:4px; padding:1px 5px; margin-inline-end:7px; }

  /**
   * ── ⭐⭐⭐ THE MATRIX AS A SMALL TABLE ───────────────────────────────────────────────────────────────────────
   *
   * Athi, 2026-09-11: *"this is not readable, area details can be in the same line, and make the header
   * vertical, so it takes less space and make the font bigger and so on, so it looks a small table."*
   *
   * ⚠️⚠️ TEN COLUMNS OF HORIZONTAL HEADING SET THE WIDTH OF THE WHOLE TABLE. "Integration", "Performance",
   * "Penetration" are each wider than the two-digit number underneath them, so every column was sized by a word
   * nobody re-reads — and the table scrolled sideways while the data in it would have fitted on a phone.
   *
   * ⭐ Turned on their side the headings cost one line of height ONCE, and each column shrinks to its number.
   * The width that frees is what pays for the larger type, which is the actual request: a table you can read.
   */
  table.mtx{ font-size:var(--fs-2); }
  /**
   * ── ⭐⭐ THE HEADINGS ARE UPRIGHT, AND THE TABLE GOT NARROWER, NOT WIDER ────────────────────────────────
   *
   * Athi: *"so the entire panel comes within single page no scrolling."*
   *
   * ⚠️ ROTATION WAS BUYING NOTHING. It was introduced because "Integration" and "Performance" are wider than
   * the two-digit number underneath — but `table.sum th.num` already sets `min-width:7.5ch`, so EVERY numeric
   * column is at least that wide whether the heading turns or not. Rotation only buys width for labels longer
   * than 7.5 characters, which is three of fourteen. What it cost: 7.5em of header (~109px, ~158px at A+),
   * text that reads about half as fast, and headings a reader has to turn the paper to read — on a document
   * whose whole purpose is to be printed.
   *
   * ⭐ SHORTEN THE THREE LONG LABELS AND THE ROTATION PAYS FOR NOTHING AT ALL. The longest honest label left
   * is "Security" at 8ch, already inside the 7.5ch floor, so no column grows and ~80px of vertical header
   * comes back. The full word stays in the heading's title=.
   */
  table.mtx th.num{ vertical-align:bottom; padding:6px 4px 7px; }
  table.mtx th.num span{ display:inline-block;
        text-transform:none; letter-spacing:.02em; font-size:var(--fs-1); font-weight:600; color:var(--ink-2); }
  table.mtx td.num{ padding:6px 4px; font-size:var(--fs-3); font-variant-numeric:tabular-nums; }
  table.mtx td.num .dim{ font-size:var(--fs-2); }
  /* ⭐ the area and what it means on ONE line — the description was a second line on every row, which doubled
     the height of the table to repeat what a tooltip already says */
  /**
   * ── ⭐⭐ THE NAME AND WHAT IT IS ARE TWO LINES, NOT ONE RUN-ON ─────────────────────────────────────────
   *
   * Athi, 2026-09-13: *"can you bring after - or : to the next line, make it distinct, so the entire panel
   * comes within a single page, no scrolling."*
   *
   * ⚠️ `white-space:nowrap` ON A CELL CONTAINING A SENTENCE. "Engine  The rules themselves — money, tax,
   * offers, numerals, document numbers. Provable with no database and no screen." was forced onto ONE
   * unbreakable line, so the first column claimed ~1000px and pushed ten numeric columns off the right edge
   * behind a horizontal scrollbar. The fix is not a wider table — it is letting the sentence wrap.
   *
   * ⭐ The name keeps nowrap (it is a label and must not break); the description becomes a BLOCK on the next
   * line and wraps inside a bounded column. The table then fits without scrolling, which is what was asked
   * for — the width was never the numbers' fault.
   */
  table.mtx td.areacell{ white-space:normal; max-width:26em; }
  table.mtx .areacell .area{ font-size:var(--fs-2); font-weight:700; white-space:nowrap; }
  table.mtx .areacell .what{ display:block; font-size:var(--fs-1); color:var(--grey-2);
        font-weight:400; line-height:1.45; margin-top:2px; }
  /* ⭐ the one figure a person outside this desk asks for, in the header, where it cannot be confused with */
  /*    the filtered numbers beside the filters — because there are no other numbers up there any more */
  .tally .pcwrap{ display:inline-flex; align-items:center; gap:5px; }
  .tally .pcwrap .pbar{ height:6px; }
  .tally .pcwrap .sub{ font-style:normal; font-size:var(--fs-1); color:var(--grey-2); }
  /* ⭐ n/a means NOBODY CAN, and it must not look like the dash that means nobody has yet */
  .na{ font-size:var(--fs-1); color:var(--grey-2); border-bottom:1px dotted var(--grey-2); cursor:help;
       font-style:italic; }
  .scroll{ overflow-x:auto; }

  /**
   * ── ⭐⭐⭐ THE COMPLETION REPORT IS A DOCUMENT, AND IS NOW DRAWN AS ONE ────────────────────────────────
   *
   * ⚠️ EVERY SECTION SAT IN ITS OWN ROUNDED CARD. That is how an APPLICATION groups things a person is going
   * to operate — and nobody operates this. It is read start to finish, by somebody who was not in the room,
   * often on paper. Eleven cards down one column read as eleven panels, so the reader looks for the controls
   * that are not there and never finds the through-line, which is the only thing a report has.
   *
   * ⭐ SO: a numbered heading over a 2px rule, and the section is just what follows it. That is what a
   * numbered clause looks like in every standard this report cites, ISO/IEC/IEEE 29119-3 included.
   */
  .rep h2{ font-size:var(--fs-4); margin:30px 0 0; letter-spacing:-.01em;
        border-bottom:2px solid var(--ink); padding-bottom:5px; }
  .rep h2:first-of-type{ margin-top:6px; }
  .rep .num-s{ font-family:ui-monospace,Menlo,monospace; color:var(--grey-2); font-size:var(--fs-2);
        margin-inline-end:7px; }
  /**
   * ⭐ THE VERDICT BLOCK — the two questions, above clause 1, and it PRINTS.
   * ⚠️ A rule and weight, not a tint: on paper backgrounds drop out, and this is the half of the document a
   * person actually reads. Same reasoning as .sec.ask.
   */
  .rep .repverdict{ border-top:3px solid var(--ink); border-bottom:1px solid var(--line);
        padding:14px 0 12px; margin:22px 0 4px; }
  .rep .repverdict h3{ font-size:var(--fs-1); font-weight:700; letter-spacing:.06em; text-transform:uppercase;
        color:var(--grey-2); margin:0 0 6px; }
  .rep .repverdict h3 ~ h3{ margin-top:16px; }
  .rep .repverdict .big-n{ margin:0 0 2px; }
  .rep .repverdict .caveat{ margin-top:10px; }
  .rep .repverdict .fine{ margin-top:10px; max-width:var(--prose); }
  .rep .sec{ padding:12px 0 4px; margin:0 0 6px; }
  /**
   * ⚠️⚠️ BUT A MEASURED SECTION AND A JUDGEMENT SECTION MUST STILL NOT LOOK ALIKE — that was the whole point
   * of the card, and it is load-bearing: a reader who takes a question for a finding quotes an opinion as a
   * number. It survives the flattening as a RULE DOWN THE SIDE plus the tint, which is what a document does
   * with an aside. The MEASURED / ASKED tag says it in words either way.
   */
  .rep .sec.ask{ background:var(--warn-tint); border-inline-start:3px solid var(--warn);
        border-radius:0 8px 8px 0; padding:12px 15px; margin:0 0 14px; }
  .rep .tag{ display:inline-block; font-size:var(--fs-1); font-weight:700; letter-spacing:.07em;
        text-transform:uppercase; border-radius:5px; padding:2px 8px; margin-bottom:9px; }
  .rep .tag.m{ background:var(--ok-tint); color:var(--ok); }
  .rep .tag.a{ background:var(--warn-tint); color:var(--warn); }
  .rep .kv{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:5px 16px; font-size:var(--fs-2); }
  .rep .kv dt{ color:var(--grey-2); white-space:nowrap; }
  /* ⭐ each block says what its rows ARE — a feature and a folder are not the same kind of row */
  .rep h4.repgrp{ font-size:var(--fs-2); margin:14px 0 6px; font-weight:700; color:var(--ink); }
  .rep h4.repgrp b{ font-family:ui-monospace,Menlo,monospace; color:var(--grey-2); font-weight:700; }
  .rep h4.repgrp span{ display:block; font-weight:400; font-size:var(--fs-1); color:var(--grey-2);
        margin-top:2px; max-width:var(--prose); }
  /* ⭐ our word → the standard's, one mapping per line */
  ul.names{ margin:8px 0 0; padding-inline-start:20px; font-size:var(--fs-1); color:var(--grey-2);
        line-height:1.8; max-width:var(--prose); }
  ul.names span{ font-weight:600; color:var(--ink-2); }
  .rep .kv dd{ margin:0; }
  .rep .big-n{ display:flex; gap:20px; flex-wrap:wrap; margin:4px 0 12px; }
  .rep .big-n div{ min-width:74px; }
  /* ⭐ rem, not 26px, so the A−/A+ control reaches the big report numbers too */
  .rep .big-n b{ display:block; font-size:1.625rem; line-height:1.15; letter-spacing:-.02em; }
  .rep .big-n span{ font-size:var(--fs-1); color:var(--grey-2); text-transform:uppercase; letter-spacing:.06em; }
  .rep .inc{ border-top:1px solid var(--line-2); padding:9px 0; font-size:var(--fs-2); }
  .rep .inc:first-of-type{ border-top:0; }
  .rep .inc .k2{ font-family:ui-monospace,Menlo,monospace; font-weight:700; font-size:var(--fs-1); }
  .rep .caveat{ margin-top:9px; font-size:var(--fs-2); line-height:1.55; }
  .rep .caveat li{ margin-bottom:4px; }
  .rep .sign{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:26px; margin-top:18px; }
  .rep .sign div{ border-top:1px solid var(--ink); padding-top:5px; font-size:var(--fs-1); color:var(--grey-2); }
  /* ⚠️ a report is printed and filed. Everything that is a CONTROL must not be on the paper. */
  @media print{
    body{ background:#fff; }
    header, .bar, .noprint{ display:none !important; }
    main{ padding:0; max-width:none; }
    .rep .sec{ break-inside:avoid; box-shadow:none; }
    .rep h2{ break-after:avoid; }
    /* ⚠️ a tint does not survive a mono printer or a "background graphics off" default — on paper the aside
       is carried by the rule, which does print, and by its own ASKED tag */
    .rep .sec.ask{ background:transparent; border-inline-start-width:4px; }
    /* the two signature rules are the point of printing it at all */
    .rep .sign{ break-inside:avoid; }
    /* ⭐ the verdict is the half a person actually reads — it must not break across a page */
    .rep .repverdict{ break-inside:avoid; }
    /**
     * ⚠️⚠️ `.scroll` IS `overflow-x:auto`, AND PAPER DOES NOT SCROLL. On screen it is the one legitimate use
     * of horizontal overflow; on paper it CLIPS at the page edge with no indication, so the very columns it
     * exists to protect — Total, Done, Left, Complete — were being cut off the right of every printed matrix,
     * silently, on the one surface this page is designed for. Visible and smaller beats cropped and confident.
     */
    .scroll{ overflow:visible !important; }
    table.sum{ font-size:9pt; }
    table.sum th, table.sum td{ padding-inline:4px; }
  }

  /* ── charts: inline SVG, theme tokens, no library ── */
  .charts{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; margin-bottom:22px; }
  .chart{ background:var(--card); border:1px solid var(--line); border-radius:11px; padding:14px 16px 12px; }
  .chart h3{ font-size:var(--fs-3); margin:0 0 2px; font-weight:600; letter-spacing:-.01em; }
  .chart .ask{ font-size:var(--fs-1); color:var(--grey-2); margin:0 0 11px; line-height:1.5; }
  .chart svg{ display:block; width:100%; height:auto; overflow:visible; }
  .chart .none{ font-size:var(--fs-2); color:var(--grey-2); padding:10px 0; }
  .legend{ display:flex; flex-wrap:wrap; gap:9px 15px; margin-top:11px; font-size:var(--fs-1); color:var(--grey-2); }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .legend i{ width:10px; height:10px; border-radius:2px; display:inline-block; }
  @media print{ .chart{ break-inside:avoid; } }

  /* ── reliability: what can be believed, as opposed to what should be tested ── */
  /* ⭐ the LABEL holds the column; its reasoning wraps under it — see the reliability row */
  .verdict{ font-size:var(--fs-1); font-weight:700; white-space:nowrap; display:block; }
  .verdict + .sub{ white-space:normal; max-width:24em; line-height:1.45; }
  .verdict.drift{ color:var(--bad); }
  .verdict.broke{ color:var(--warn); }
  .verdict.settled{ color:var(--ok); }
  .verdict.once{ color:var(--grey-2); font-weight:400; }
  /* ⭐ the sequence itself, because "3 failures" and "failed every other run" look identical as a number */
  .seq{ display:inline-flex; gap:2px; vertical-align:middle; }
  .seq i{ width:7px; height:14px; border-radius:2px; display:inline-block; }
  .why-note{ background:var(--card); border:1px solid var(--line); border-radius:11px;
        padding:13px 16px; margin-bottom:16px; font-size:var(--fs-2); line-height:1.6; color:var(--ink-2); }
  .why-note b{ color:var(--ink); }

  /* ── try it: run a pure function on your own input ── */
  .try{ background:var(--card); border:1px solid var(--line); border-radius:11px; padding:14px 16px;
        margin-bottom:12px; }
  .try h3{ font-size:var(--fs-3); margin:0 0 3px; font-weight:600; }
  .try .sig{ font-family:ui-monospace,Menlo,monospace; font-size:var(--fs-1); color:var(--grey-2);
        margin-bottom:9px; }
  .try .row{ display:flex; gap:7px; flex-wrap:wrap; align-items:center; }
  .try input[type=text]{ flex:1 1 220px; font-family:ui-monospace,Menlo,monospace; font-size:var(--fs-2); }
  .try .out{ margin-top:10px; padding:10px 12px; border-radius:8px; background:var(--paper);
        border:1px solid var(--line-2); font-family:ui-monospace,Menlo,monospace; font-size:var(--fs-2);
        white-space:pre-wrap; word-break:break-word; line-height:1.55; }
  .try .out.bad{ background:var(--bad-tint); border-color:#eccbc9; color:var(--bad); }
  .try .eg{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .try .eg button{ font:inherit; font-size:var(--fs-1); padding:3px 9px; border:1px solid var(--grey-4);
        background:var(--paper); border-radius:99px; cursor:pointer; color:var(--ink-2);
        font-family:ui-monospace,Menlo,monospace; }
  .try .eg button:hover{ background:var(--blue-tint); border-color:var(--blue); }
  .gone{ color:var(--grey-2); font-size:var(--fs-2); }

  .hide{ display:none !important; }
  @media (max-width:560px){ .chead{ flex-wrap:wrap; } .pri{ order:3; } }
</style>
<script src="/engine/screen.js"></script>
<script src="/app/avatar.js"></script>   <!-- CBAvatar: the one avatar (Profile · Support · Sign out) and the look it owns — the same on every page -->
<script src="/app/kbd-press.js"></script>   <!-- Enter and Space press the header chips (role=button) -->
<script src="/app/list-ctl-css.js"></script><script src="/app/list-ctl-click.js"></script><script src="/app/list-ctl-wire.js"></script><script src="/app/list-ctl.js"></script>   <!-- CBList.every: the board's lists page (T2-PAGING) and the board sums the whole set -->
</head>
<body>

<!--
  ── ⭐⭐ FREEZE THE CHROME, SCROLL THE REPORT ─────────────────────────────────────────────────────────────

  Athi, 2026-09-12: *"can you freeze until case summary report, reliability chip, the scroll bar to
  operate below that."*

  ⚠️ `header` was already sticky and the TAB BAR was not, so the five tabs and the tally chips scrolled
  away the moment you started reading — and on a board this long that is the one row you most need to
  still be able to reach. Half a sticky header is worse than none: it looks deliberate.

  ⭐ Both are one sticky block now. The FILTER bar below is deliberately NOT in it — it belongs to the
  Cases view, it is hidden on the others, and freezing a bar that disappears would make the page jump.
-->
<div class="frozen">
<header>
  <div class="htop">
    <h1>Test Report</h1>
    <span class="sub" id="who">…</span><span id="cbav"></span><script>if(window.CBAvatar)CBAvatar.mount(document.getElementById('cbav'),{person:CBAvatar.sessionPerson(),items:['profile','support','signout']});</script>
    <span class="sub" style="opacity:.75">· cases, results and the completion report — ISO/IEC/IEEE 29119-3</span>
  </div>
  <div class="tally" id="tally"></div>
</header>

<div class="bar">
  <!-- ⭐ Athi, 2026-09-11: "where can we see the summary result?" — the totals endpoint existed and nothing
       rendered it. An endpoint with no screen is a number nobody reads. -->
  <!-- ⭐ Athi, 2026-09-12: "couldn't read, you kept the font size so small". Bigger by default AND his to set,
       because the right size depends on the screen he is at and I cannot see that. -->
  <div class="tabs">
    <!-- ⭐ Athi: "we name it as per standard, reference the standard where possible?" — each tab says which
         of 29119-3's document types it corresponds to, so a reader can look ours up in theirs rather than
         learning our words. ⚠️ Only where it genuinely corresponds: the Summary is OURS, because 29119-3's
         Test Status Report is written DURING execution against a plan and we have no plan. -->
    <button data-cbsid="OWN003-B01" id="t_cases" class="on" onclick="setView('cases')"
      title="What should be true. Every case, in the order somebody would walk the product. This tab cannot
tell you whether any of it ran. — Test Case Specification (ISO/IEC/IEEE 29119-3)">Cases</button>
    <button data-cbsid="OWN003-B02" id="t_sum" onclick="setView('summary')"
      title="What has been run, and how far along. Done means a result exists — not that it passed. — ours,
not a named document of the standard">Summary</button>
    <button data-cbsid="OWN003-B03" id="t_rep" onclick="setView('report')"
      title="The same numbers as a document you could hand somebody. Counts are measured; the judgements
carry a question, never a generated answer. — Test Completion Report (ISO/IEC/IEEE 29119-3)">Report</button>
    <button data-cbsid="OWN003-B04" id="t_rel" onclick="setView('reliability')"
      title="Whether a test can be believed. Not pass or fail — how often each one changed its answer.">Reliability</button>
    <button data-cbsid="OWN003-B05" id="t_try" onclick="setView('try')"
      title="The engines themselves, on your own input, with no server in between to blame. Nothing here is
recorded.">Try it</button>
    <!-- ⭐ b292: read the Summary and the Report for ONE project. "All" is the whole board, as before. -->
    <span id="pview" style="display:none;margin-inline-start:12px"><label for="f_pview">Project</label>
      <select data-cbsid="OWN003-S01" id="f_pview" onchange="setProjectView(this.value)" data-testid="project-filter"><option value="">All</option></select></span>
    <span class="tsize"><button data-cbsid="OWN003-B06" onclick="textSize(-1)" title="Smaller text" aria-label="Smaller text">A−</button><button data-cbsid="OWN003-B07" onclick="textSize(1)" title="Bigger text" aria-label="Bigger text">A+</button></span>
  </div>
</div>
</div><!-- /.frozen -->
<!--
  ── ⭐⭐⭐ FIVE LENSES, ONE SET OF NUMBERS ──────────────────────────────────────────────────────────────────

  Athi, 2026-09-11: *"I understand it is all the same metrics in different format and different focus, so we
  have to give that significance."*

  ⚠️⚠️ HE WORKED THAT OUT BY READING FIVE TABS AND NOTICING THE NUMBERS AGREED. Nothing on the screen said it.
  Until you see it, five tabs look like five reports and the natural question is which one is right — which
  is exactly the confusion that made "everything shows as engine" hard to place.

  ⭐ So each tab states the QUESTION IT ANSWERS, in the same place, in the same voice. The data is one table
  of results; what changes is what you are asking it.
-->
<!--
  ── ⭐⭐⭐ TWO BOXES, NOT FIVE ────────────────────────────────────────────────────────────────────────────────

  Athi, 2026-09-11: *"I spent time to understand what each dropdown is."* There were five, and three of them
  answered questions nobody had asked: Show, By, and a Module list whose relationship to Reaches took a
  paragraph to explain.

  ⚠️⚠️ A FILTER A PERSON HAS TO DECODE IS NOT A FILTER, IT IS HOMEWORK. The board's own job is to make the
  shape of the testing obvious; five controls made finding anything an exercise in remembering which box meant
  what.

  ⭐ So: WHAT KIND of test, WHERE it reaches, and the totals — in one line, with the counts inside the options
  so the number and the choice are the same thing. The module breakdown became CHIPS on the line below, which
  need no legend: they say their own name and their own count.
-->
<div class="bar">
  <!--
    ⭐⭐ THE FIRST QUESTION IS WHAT KIND OF TEST, AND THE COUNT IS INSIDE THE CHOICE.

    Athi: *"in the filter itself eng - count."* A dropdown that makes you pick blind and then look elsewhere for
    the number is two steps where there should be one.

    ⚠️⚠️ THE KINDS ARE NOT INTERCHANGEABLE AND THE TITLES SAY SO. A green unit test and a green system test are
    not the same amount of evidence, and the commonest way a coverage figure lies is by adding them together.

    ⭐ PURPOSE WHERE A PERSON WOULD SAY PURPOSE. Athi: *"I guess it is only unit, integration, manual, pen,
    performance etc."* A load test is a system test and nobody looks for it there, so performance and security
    are their own entries — declared by name in classify-tests.cjs, because detecting them from the source put
    money.test.js under performance and returned eighty-nine security files.
  -->
  <label for="f_type">Kind</label>
  <select data-cbsid="OWN003-S02" id="f_type" onchange="paint()"></select>

  <!--
    ⭐⭐ AND THE SECOND IS WHERE IT REACHES — api · middleware · engine · web · database · connector. Read from
    what a file requires, reads off disk and calls over HTTP, so it is measured rather than filed by hand.
  -->
  <label for="f_area">Reaches</label>
  <select data-cbsid="OWN003-S03" id="f_area" onchange="paint()"></select>

  <input data-cbsid="OWN003-I01" type="search" id="f_q" placeholder="Search a path, a module, a claim…" oninput="paint()">

  <!--
    ── ⚠️⚠️ A FILTER YOU CANNOT SEE IS A BOARD THAT IS LYING ─────────────────────────────────────────────────

    Athi, 2026-09-12: *"when the reload completes it has to show all the cases — it is filtered on something,
    not sure why the filter stays. Either we show a difference in colour if a filter is active, or a reset
    filter icon, otherwise I keep searching how to reset the data to full."*

    ⚠️ HE SPENT TIME HUNTING FOR A CONTROL THAT DID NOT EXIST. Four filters — kind, reaches, search, and the
    hidden state set by the header chips — persist across a repaint, and NONE of them announced itself. After a
    refresh the counts looked wrong and there was no way to tell that the board was answering a narrower
    question than the one being asked.

    ⭐ Both of the things he suggested, because either alone is half a fix: the bar CHANGES COLOUR so an active
    filter is visible without reading anything, and there is one control that clears every filter at once,
    saying how many of how many are showing. It appears only when a filter is on — a permanent Clear button is
    noise, and noise is what you stop seeing.
  -->
  <!--
    ⚠️ I ARGUED FOR SHOWING THIS ONLY WHEN A FILTER WAS ON — "a permanent Clear button is noise, and noise is
    what you stop seeing" — and Athi said, plainly: *"no, give a clear filter button."* He is right and my
    reasoning was backwards for this case. A control that APPEARS is a control you have to notice before you
    can use it, and the whole complaint was that he could not tell a filter was on in the first place. You
    cannot go looking for a button whose existence depends on the thing you failed to spot.

    ⭐ So it is always here, always in the same place. The COUNT beside it still appears only when something is
    filtered — that is information, and information about nothing is the noise I was worried about.
  -->
  <button data-cbsid="OWN003-B08" class="btn" id="f_clear" onclick="clearFilters()"
    title="Clear every filter — kind, reaches, search, and the one the header chips set">Clear filters</button>
  <span id="f_state_show" class="fclear" hidden></span>

  <!--
    ⭐⭐⭐ THE TOTALS ARE THE THIRD FILTER, SO THERE IS NO THIRD FILTER.
    Athi: *"if we can bring the total cases / completed / remain in the same place we don't need a third filter
    box."* Exactly right — "show me the ones not yet tested" and "how many are not yet tested" are the same
    question asked twice, and it was a dropdown and a tally sitting in different places.
    ⚠️ The hidden input keeps the one piece of state the rest of the board already reads; what changed is that a
    person now clicks the number instead of decoding a menu.
  -->
  <span class="tot" id="f_tot"></span>
  <input type="hidden" id="f_state" value="">
</div>

<!--
  ── ⭐⭐⭐ THE PIVOT ────────────────────────────────────────────────────────────────────────────────────────────

  Athi, 2026-09-11: *"I guess it is the pivotal view of the data, so possibly you can provide based on pivotal
  format so the pivotal can change the results?"* — right after working out for himself that *"it is all the
  same metrics in different format and different focus."*

  ⭐⭐ HE IS DESCRIBING WHAT THE TABS ALREADY WERE. Cases grouped by area; Summary grouped by area against kind;
  the evidence table grouped by kind — three hardcoded cuts of ONE list, each written separately, each free to
  drift from the others. A pivot is not a feature added on top of that. It is the thing all three were
  approximations of, and having it means the next question does not need a fourth table.
-->
<div class="bar pivotbar">
  <label for="p_rows">Rows</label>
  <select data-cbsid="OWN003-S04" id="p_rows" onchange="paint()">
    <option value="area" selected>Area</option>
    <option value="kind">Kind</option>
    <option value="reaches">Reaches</option>
    <option value="priority">Priority</option>
    <option value="who">Run by</option>
    <option value="status">Status</option>
  </select>
  <label for="p_cols">Columns</label>
  <select data-cbsid="OWN003-S05" id="p_cols" onchange="paint()">
    <option value="area">Area</option>
    <option value="kind">Kind</option>
    <option value="reaches">Reaches</option>
    <option value="priority">Priority</option>
    <option value="who">Run by</option>
    <option value="status" selected>Status</option>
  </select>
</div>

<!--
  ⭐ THE EXPANSION LINE — Athi: *"in the second line the details about the ENG, expansion."* Chips need no
  legend: each says its own name and its own count, and they narrow to whatever the two boxes above have left.
-->
<div class="bar chips" id="f_chips"></div>

<div class="bar">
  <!--
    ⚠️⚠️ THIS DROPDOWN IS THE ORIGINAL COMPLAINT, UNTOUCHED UNTIL NOW. Athi: *"I spent time to understand what
    each dropdown is"* — and *"T1, T2 are the test yardsticks for YOU"*. T0-T3 are how much of the suite I run
    before shipping and who authorises it. They are MY working discipline, not a word a tester should have to
    decode while holding a shop's till.
    ⭐ So each option now says what it means in the option itself, and the internal ones say whose they are.
  -->
  <label for="f_kind">This run is</label>
  <select data-cbsid="OWN003-S06" id="f_kind" onchange="saveRun()">
    <option value="manual" title="A person working through cases on this screen.">Someone testing by hand</option>
    <option value="unit" title="An automated suite reporting itself — what the Post a run button records.">An automated run</option>
    <option value="regression" title="Everything, re-run to check nothing that worked has stopped working.">A full regression</option>
    <option value="t0" title="Claude's own ladder: browser check + parse + static guards, ~30s, run on every change.">T0 · Claude's quick check</option>
    <option value="t1" title="Claude's own ladder: the one spec for what just changed, ~50s.">T1 · Claude, one spec</option>
    <option value="t2" title="Claude's own ladder: every spec for that surface, ~7 min, run on leaving a panel.">T2 · Claude, one surface</option>
    <option value="t3" title="Claude's own ladder: everything, ~55 min. Athi decides when.">T3 · Claude, everything</option>
  </select>
  <input data-cbsid="OWN003-I02" type="text" id="f_run" placeholder="This sitting, e.g. v2.0 before release" oninput="saveRun()">
  <!-- ⭐ b292 · Athi, 2026-10-07: "it has to run against a project … so we can group against a sprint or project."
       Every result tapped or posted from here carries it. Kept on this device, like the tester. -->
  <label for="f_proj">Project</label>
  <input data-cbsid="OWN003-I03" type="text" id="f_proj" placeholder="e.g. 2026-10 Stage 1" maxlength="80" oninput="saveProj()" style="max-width:170px"
    title="The sprint or project these results belong to">
  <label for="f_who">Tester</label>
  <!-- ⚠️ THE ENTITY NAME IS NOT AN ANSWER TO "who tested this". The server always records the identity off
       the token, which cannot be typed in and is the evidence; this is who was at the keyboard, which only
       matters — and only differs — when one login is shared. Kept on this device. -->
  <input data-cbsid="OWN003-I04" type="text" id="f_who" placeholder="who is at the keyboard" oninput="saveWho()" style="max-width:150px">
  <button data-cbsid="OWN003-B09" class="btn" onclick="newRun()" title="Start a fresh run — the results already recorded stay where they are">New run</button>
  <span style="flex:1"></span>
  <!--
    ⭐⭐⭐ THE LOADER LIVES HERE NOW, AND IT HAS TO.
    ⚠️⚠️ It was rendered ONLY inside `if (!CASES.length)` — the empty-board message. So it was a one-time
    onboarding button that vanished the moment it worked, while its own copy said *"safe to press again later —
    it reloads the wording and leaves every result exactly where it is."* A board with 110 cases on it had no
    way to take the 498 new ones, and I spent an afternoon telling Athi to press a button that was not there.
    ⭐ An upsert that cannot be re-run is not an upsert. A control whose description says "press it again"
    belongs where a person can.
  -->
  <button data-cbsid="OWN003-B10" class="btn pri" onclick="seed()"
    title="Load the documented cases — an upsert. Safe to press again: it refreshes the wording and adds anything new, and leaves every result exactly where it is.">Load cases</button>
  <!-- ⭐ Gherkin: the spec clause and its cases as ONE text. The Feature description IS the clause, so a
       file that goes into the repository carries both arms of the V and neither can be edited alone. -->
  <button data-cbsid="OWN003-B11" class="btn" onclick="exportFeature()" title="Download the cases as a .feature file">Export .feature</button>
  <button data-cbsid="OWN003-B12" class="btn" onclick="document.getElementById('f_file').click()" title="Load a .feature file — the Feature description becomes the spec clause">Import .feature</button>
  <input data-cbsid="OWN003-I05" type="file" id="f_file" accept=".feature,.txt" style="display:none" onchange="importFeature(this)">
  <!--
