<!doctype html>
<html lang="en" data-tokens="list">
<!-- OWNS  the CB Finance page: dues · cash position · collections · reports (cap-finance.js · cap-mis.js paint the server's figures).
     CALLED BY Home's Finance card (app/manifest.json entry finance, route /finance.html) · app/shell.js (the trend link to /finance.html#/reports/trend/week) · app/cap-crm-record.js (the link to /finance.html#/terms).
     FLOW  load → whoPaint (CBFrame) → the section's read → paint
     CARD 16-finance/cb-finance -->
<head>
<meta charset="utf-8">
<script src="/app/device-id.js"></script>
<script src="/config.js"></script>   <!-- HX1: window.CB_API — this deploy's one api address -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finance</title>
<!-- ⭐ CB Finance — what the shop is owed, on its own page like CB Accounts and CB CRM (C:/dev/CB-FINANCE-PLAN.md round F1). The FRAME is theirs (sidebar · header ·
     tokens · CBAvatar · the kural band); the list is a CBList mount; the screen is app/cap-finance.js. Every figure (balance, limit, over-limit, interest) is the
     server's — the page paints, it computes nothing. Interest is SHOWN, never posted. Owner only: the server decides; anyone else sees the sentence, greyed. -->
<link rel="preload" href="/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="/fonts/ibm-plex-sans-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/fonts/cb-fonts.css">
<style>
/* CB Accounts' tokens, as shipped (accounts.html) — there is no shared stylesheet yet, so the shell's own lines are repeated here (named in the PR) */
:root{
  --ground:#fbf6ec; --surface:#fffdf8; --side:#f4ecdc; --sub:#fbf6ec;
  --ink:#2a2418; --ink-2:#3d3527; --muted:var(--grey); --muted-2:#5c5240;
  --line:#e6dcc6; --line-2:#efe6d3; --line-3:#d8ccb0; --hover:#f3ead7;
  --accent:#1f5f5b; --accent-ink:#fbf6ec;
  --mono:'IBM Plex Mono',ui-monospace,monospace; --serif:'Source Serif 4',Georgia,serif; --sans:var(--f-ui,'IBM Plex Sans',system-ui,sans-serif);   /* --f-ui is the reading font the avatar chooses (SHELL-ONE: one face) */
  --green:#16693F; --green-d:#0D4A2B; --green-t:#E8F4ED; --green-b:#A9D3BC;
  --amber:#E0A020; --amber-t:#FDF3DC; --amber-b:#EFD39A; --amber-i:#7A5205;
  --red:#C4562F; --red-t:#FBEAE3; --red-b:#E7B9A8; --red-i:#8E3517;
  --blue:#2468BD; --blue-t:#E4EEFA; --blue-b:#B9D2EF; --blue-i:#174A87;   /* #2F74C9 read 4.37:1 under cream text and as text on cream (the thread's External · Send); 5.1:1 now (CRM2 walk) */
  /* the names cap-books.js (the dues chip, the statement) and CBList paint with, mapped onto this palette */
  --fs-1:12px; --fs-2:13.5px; --fs-3:15px; --grey:#6f6450;   /* = the old --muted; --muted reads it, so a chosen theme's --grey reaches both */
  --page:#FCFAF5; --card:#fffdf8; --panel:#F3EFE6;
  --paper:var(--sub); --sel:var(--hover); --on-card:var(--ink); --on-accent:var(--accent-ink); --grey-2:var(--muted-2);
  /* ⚠️ LITERAL, not aliases of --amber-i / --green-t …: the avatar's data-tokens="list" rule points THOSE at these (--amber-t:var(--warn-tint)), so an alias back is a CYCLE, and a cycle is an invalid
     colour (a transparent chip) in every theme that does not carry the token. These are the Cream values the aliases resolved to. */
  --warn-2:#7A5205; --ok-2:#0D4A2B; --blue-d:#174A87; --blue-2:#174A87; --warn-tint:#FDF3DC; --blue-tint:#E4EEFA; --blue-tint-bg:#E4EEFA; --ok-tint:#E8F4ED;
  /* the few colours the shell paints that are not a palette entry — named here so a theme can re-point them */
  --accent-hover:#174a47; --accent-text:var(--accent); --tab-n:#e9dfc8; --shadow-menu:0 10px 24px rgba(42,36,24,.16); --shadow-toast:0 10px 24px rgba(42,36,24,.25); --scrim:rgba(42,36,24,.4); --line-side:#e2d6bc; --hover-nav:#ece1c9;
}
/* a chosen theme (CBAvatar stamps data-themed) re-points this page's own names; Cream is untouched (as accounts.html, web #36) */
:root{--red-text:var(--red-i)}   /* the red that carries WORDS: Cream's --red-i; in a chosen theme the theme's own --disp (its --disp-2 is a border red — 3:1 in Dark) */
:root[data-themed]{--red-text:color-mix(in srgb,var(--disp,var(--red-i)) 78%,var(--ink));--ground:var(--paper);--surface:var(--card);--side:var(--card);--sub:var(--paper);--line-2:var(--line);--line-3:var(--line);--line-side:var(--line);
  /* the names a theme does not (always) carry follow the theme's own: text steps from --ink / --grey, the accent from the theme's blue, hover from ink over the card.
     A value the theme DOES set inline (--ink-2, --hover …) wins over these, so they only fill what a theme leaves out. */
  --ink-2:var(--ink); --muted-2:var(--grey); --grey-2:var(--grey);
  --hover:color-mix(in srgb,var(--ink) 8%,var(--card)); --hover-nav:var(--hover);
  --accent:var(--blue-2); --accent-text:var(--blue-d); --accent-ink:var(--card); --accent-hover:color-mix(in srgb,var(--blue-2) 82%,var(--ink)); --tab-n:var(--ground);
  --green-d:color-mix(in srgb,var(--ok-2) 80%,var(--ink)); --amber-b:var(--gold-line); --amber:var(--prog);
  --shadow-menu:var(--shadow,0 10px 24px rgba(0,0,0,.4)); --shadow-toast:var(--shadow,0 10px 24px rgba(0,0,0,.4)); --scrim:color-mix(in srgb,var(--ink) 45%,transparent)}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;height:calc(100vh - var(--cbk-h,0px));overflow:hidden;position:relative}   /* the kural footer (CBKural) is outside the head: it takes its height off the window */

/* sidebar */
.side{width:232px;flex-shrink:0;height:100%;background:var(--side);border-right:1px solid var(--line-side);display:flex;flex-direction:column;transition:width .2s ease}
.side.collapsed{width:68px}
.side.collapsed .label{display:none}
.side.collapsed .nav-chev{transform:rotate(180deg)}
.side.collapsed .nav-btn{position:relative}.side.collapsed .nav-btn .n{position:absolute;margin:0;transform:translate(12px,-12px);padding:0 5px}   /* the rail keeps the badge inside its 68 px */
.brand{height:56px;padding:0 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line-side)}
.logo{width:32px;height:32px;flex-shrink:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
.brand-name{font-family:var(--serif);font-size:19px;font-weight:700;white-space:nowrap}
.nav{flex-grow:1;overflow-y:auto;padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.nav-btn{width:100%;height:44px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 12px;border:none;border-radius:8px;background:transparent;color:var(--ink-2);font-size:14px;font-weight:500;text-align:left;white-space:nowrap;text-decoration:none}
.nav-btn:hover{background:var(--hover-nav)}
.nav-btn.active{background:color-mix(in srgb,var(--accent) 14%,var(--side));color:var(--accent-text);font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
.nav-btn .n{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--amber-t);color:var(--amber-i)}
.nav-btn .n.quiet{background:transparent;color:var(--muted-2)}
.nav-chev{transition:transform .2s ease}
.side-foot{padding:8px;border-top:1px solid var(--line-side)}
.side-foot .nav-btn{font-size:13px;color:var(--muted-2)}

/* SHELL-ONE: the header is THE ONE FRAME (CBFrame → CBShell, #shell at the top of the main pane): mark · CB Finance · the screen chip · ⌂ Home · bell · avatar.
   Nothing of it is drawn or styled here. Under it the page's own tools row: the crumb and the page's one action. */
.main{flex-grow:1;min-width:0;height:100%;display:flex;flex-direction:column;overflow:hidden}
.tools{flex-shrink:0;min-height:44px;border-bottom:1px solid var(--line);padding:4px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tools:not(:has(.crumb:not(:empty))):not(:has(#crm-bar-act:not(:empty))){display:none}   /* nothing to say, no row */
.crumb{display:flex;align-items:center;gap:8px;min-width:0;font-size:13.5px;color:var(--muted)}
.crumb a{color:var(--accent-text);text-decoration:none;font-weight:600}
.crumb a:hover{text-decoration:underline}
/* ⭐ THE FROZEN HEAD (list-standard): on a list screen nothing of this page sits above the unit's own title row but the frame — the shop · Home · avatar
   are the frame's (SHELL-ONE); the crumb is the list's own title. */
@media (min-width:761px){
  .main{position:relative}
  .main.overbar .tools{display:none}
  .main.overbar .act.sm{min-height:32px}
  .main.overbar .screen .cbl:not(#_) .cbl-title{min-height:56px;box-sizing:border-box}
}
.screen{flex:1;min-height:0;overflow-y:auto}
.screen.flush{overflow:hidden;overflow:clip;padding:0;display:flex;flex-direction:column}
.screen.flush > #crm_list,.screen.flush > #chits_list,.screen.flush > #crm_fu{flex:1 1 auto;min-height:0;height:auto}
.content{padding:20px 24px 120px;display:flex;flex-direction:column;gap:16px}   /* no width cap (T17): the page takes the screen; only prose is capped */
.empty{padding:40px 20px;text-align:center;border:1px dashed var(--line-3);border-radius:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .t{font-family:var(--serif);font-size:19px;color:var(--ink);font-weight:700}
.card{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:22px 22px 20px;max-width:560px;display:flex;flex-direction:column;gap:12px;margin:24px}
.card h2{margin:0;font-family:var(--serif);font-size:21px;font-weight:700}
.card p{margin:0;color:var(--muted);font-size:14px}
.card.bad{border-color:var(--red-b);background:var(--red-t)}
.card.bad h2,.card.bad p{color:var(--red-i)}
.act{display:inline-flex;align-items:center;justify-content:center;gap:6px;align-self:flex-start;min-height:40px;padding:0 16px;border:1px solid var(--accent);border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap}
.act:hover{background:var(--accent-hover)}
.act.ghost{background:transparent;color:var(--accent-text)}
.act.quiet{background:transparent;border-color:var(--line-3);color:var(--ink)}
.act.sm{min-height:34px;padding:0 12px;font-size:13px}
.act[disabled]{opacity:.6;cursor:default}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 20px 6px}
.tab{height:36px;padding:0 12px;display:flex;align-items:center;gap:8px;border:1px solid var(--line-3);border-radius:999px;background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:600}
.tab .n{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.tab[aria-pressed="true"],.tab[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
.tab[aria-pressed="true"] .n,.tab[aria-current="page"] .n{color:var(--tab-n)}
.sec{font-size:var(--fs-1);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-2);margin:0 0 8px}
.mono{font-family:var(--mono)}
.inp{width:100%;border:1px solid var(--line-3);border-radius:9px;padding:10px 12px;font:inherit;font-size:14px;background:var(--surface);color:var(--ink)}
.optchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-3);border-radius:999px;padding:3px 10px;font-size:var(--fs-1);font-weight:600;background:var(--surface)}
.supacts{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.loadwrap{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:var(--fs-2);padding:18px 0}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--line-3);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;max-width:min(520px,92vw)}
#toast .toast{background:var(--ink);color:var(--ground);padding:12px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow-toast)}
#toast .toast.err{background:var(--red-i)}
#toast .toast.warn{background:var(--amber-i)}
#toast button{margin-left:10px;border:1px solid currentColor;background:transparent;color:inherit;border-radius:8px;padding:2px 10px}

/* chips: a status is an icon AND a word (cb-design) */
.tag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;border:1px solid var(--line-3);background:var(--surface);color:var(--ink-2);font-size:12px;font-weight:600;white-space:nowrap}
.tag svg{width:12px;height:12px}
.tag.role{background:var(--sub);color:var(--ink)}
.tag.on{background:var(--green-t);border-color:var(--green-b);color:var(--green-d)}
.tag.local{border-style:dashed}
.tag.walk{border-style:dotted}
.tag.seg{background:var(--blue-t);border-color:var(--blue-b);color:var(--blue-i)}
.tag.amber{background:var(--amber-t);border-color:var(--amber-b);color:var(--amber-i)}
.tag.red{background:var(--red-t);border-color:var(--red-b);color:var(--red-i)}
.tag.green{background:var(--green-t);border-color:var(--green-b);color:var(--green-d)}
.tag.blue{background:var(--blue-t);border-color:var(--blue-b);color:var(--blue-i)}
.pcell .l1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pcell .nm{font-weight:700}
.pcell .pno{font-family:var(--mono);font-size:12px;color:var(--muted)}
.pcell .l2{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.udot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.late{color:var(--amber-i);font-weight:700}
.late.red{color:var(--red-text)}
.sub{color:var(--muted)}
/* ⭐ one line per party: the name and its number, nothing stacked; Dues said the shop's way (symbol + word + colour); On ChitBridge a tick or a dash */
.pcell{display:inline-block;vertical-align:bottom;max-width:calc(100% - 20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcell .l1{display:inline-flex;align-items:baseline;gap:8px;max-width:100%}
.pcell .nm{overflow:hidden;text-overflow:ellipsis}
.due{white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums}
.due .w{font-weight:600;font-size:var(--fs-1)}
.rchips .due{display:inline-flex;align-items:center;gap:4px;min-height:22px;padding:0 8px;border-radius:999px;border:1px solid var(--line-3);background:var(--surface);font-size:12px;font-weight:600}
.rchips .due.get{border-color:var(--green-b)}.rchips .due.give{border-color:var(--red-b)}
.due.get{color:var(--green-d)}.due.give{color:var(--red-text)}.due.settled{color:var(--muted);font-weight:600}
.conn{font-weight:800;font-size:16px;line-height:1}.conn.on{color:var(--green-d)}.conn.off{color:var(--muted)}
.fu1{display:flex;align-items:center;gap:8px;min-width:0}.fut{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fua{display:inline-flex;gap:6px;flex:0 0 auto}
/* ⭐ THE MINI-CARD (what ▸ opens): three boxes of one height, then the action row — the same on a party, a chit and a follow-up */
.mc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.5fr);gap:10px;align-items:stretch;padding:2px 0 4px}
.mc-box{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 12px 10px;min-height:134px;min-width:0}
.mc-box h5{margin:0 0 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2);font-weight:700}
.mc-r{display:flex;gap:8px;align-items:center;min-height:26px;font-size:13.5px;min-width:0}
.mc-r .ic{flex:0 0 auto;display:inline-flex}.mc-r .ic svg{width:15px;height:15px;color:var(--muted)}
.mc-r .v{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-r a{color:var(--accent-text)}
.mc-r.kv{justify-content:space-between}.mc-r.kv .k{color:var(--muted);font-size:12.5px;flex:0 0 auto}
.mc-big{min-height:34px;font-size:18px;display:flex;align-items:center}
.mc-c{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:26px;font-size:13.5px;cursor:pointer;border-radius:6px;padding:0 4px;margin:0 -4px}
.mc-c:hover{background:var(--hover)}
.mc-c .d{color:var(--muted);font-variant-numeric:tabular-nums}.mc-c .w{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@container list (max-width:620px){.mc{grid-template-columns:minmax(0,1fr)}.mc-box{min-height:0}}
.crm-mini{height:30px;padding:0 10px;border:1px solid var(--line-3);border-radius:8px;background:var(--surface);color:var(--ink);font-size:12.5px;font-weight:600}
.crm-mini:hover{background:var(--hover)}

/* the record: header · identity block · Next · actions · sections */
.rec{display:flex;flex-direction:column;gap:14px;padding:16px 24px 120px}
.rec h1{margin:0;font-family:var(--serif);font-size:28px;font-weight:700;letter-spacing:-.01em}
.rec .legal{color:var(--muted);font-size:13.5px}
.rhead{display:flex;flex-direction:column;gap:6px}
.rchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.idblk{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.idblk.local,.idblk.walk{border-style:dashed}
.idblk .cells{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.idblk .c{padding:9px 13px;border-right:1px solid var(--line-2);min-width:0}
.idblk .c:last-child{border-right:0}
.idblk .k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-2)}
.idblk .v{font-weight:600;overflow-wrap:anywhere}
.idblk .v.none{color:var(--muted);font-weight:400}
.verdict{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 13px;border-top:1px solid var(--line-2);font-size:13.5px}
.verdict.on{background:var(--green-t);color:var(--green-d)}
.verdict.off{color:var(--ink-2)}
.next{border:1px solid var(--amber-b);border-radius:12px;background:var(--amber-t);overflow:hidden}
.next .nh{padding:7px 13px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--amber-i);border-bottom:1px solid var(--amber-b)}
.nx{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--amber-b);flex-wrap:wrap;color:var(--amber-i)}
.nx:last-child{border-bottom:0}
.nx .tx{flex:1 1 220px;min-width:0;overflow-wrap:anywhere}
.nx .tx .s{display:block;font-size:12.5px;color:var(--muted-2)}
.nx .btns{display:flex;gap:6px;flex-wrap:wrap}
.nx .ic{display:inline-flex}
.actbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actbar .more{position:relative}
.menu{position:absolute;top:calc(100% + 4px);right:0;z-index:20;min-width:220px;background:var(--surface);border:1px solid var(--line-3);border-radius:12px;box-shadow:var(--shadow-menu);padding:4px;display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border:0;background:none;border-radius:8px;text-align:left;font-size:14px;color:var(--ink)}
.menu button:hover:not([disabled]){background:var(--hover)}
.menu button[disabled]{color:var(--muted)}
.menu .why{margin-left:auto;font-size:12px;color:var(--amber-i)}
.menu .danger{color:var(--red-i)}
.rsec{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.rsec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:11px 14px;font-weight:700;min-height:44px}
.rsec>summary::-webkit-details-marker{display:none}
.rsec>summary::before{content:"▸";color:var(--muted);font-size:12px;transition:transform .15s}
.rsec[open]>summary::before{transform:rotate(90deg)}
.rsec>summary .fact{margin-left:auto;font-weight:400;color:var(--muted);font-size:13px;text-align:right}
.rsec .rbody{padding:4px 14px 14px;border-top:1px solid var(--line-2)}
.kv{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line-2);font-size:14px;flex-wrap:wrap}
.kv:last-child{border-bottom:0}
.kv b,.kv>label{min-width:130px;color:var(--muted-2);font-size:12px;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.mbody .kv>label{display:block;gap:0;font-size:12px;font-weight:700} /* the party sheet sits in .mbody, whose label rule (flex column, 13.5px) would otherwise win on equal specificity */

.entry{display:flex;gap:10px;align-items:flex-start;width:100%}
.entry .mk{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;background:var(--panel);color:var(--ink-2);flex-shrink:0}
.entry .mk svg{width:15px;height:15px}

.entry .tx .by{display:block;font-size:12.5px;color:var(--muted)}
.entry.theirs .tx{border-left:3px solid var(--blue-b);padding-left:8px}
.entry .unread-line{font-weight:700}
.tagi{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-2);border:1px solid var(--line-3);border-radius:6px;padding:0 5px;margin-left:6px}

/* a sheet (add party · log · follow-up · edit) — the same frame for each */
dialog.sheet{border:1px solid var(--line-3);border-radius:14px;padding:0;width:min(520px,94vw);max-height:92vh;background:var(--surface);color:var(--ink);font:15px/1.45 var(--sans)}
dialog.sheet::backdrop{background:var(--scrim)}
.mhd{padding:16px 20px 4px;display:flex;align-items:center;gap:10px}
.mhd .t{font-family:var(--serif);font-size:20px;font-weight:700;flex:1}
.mhd .sub{font-size:13px}
.mx{border:0;background:none;font-size:18px;min-width:40px;min-height:40px;border-radius:8px;color:var(--muted)}
.mbody{padding:8px 20px 12px;display:flex;flex-direction:column;gap:10px;overflow:auto;max-height:70vh}
.mbody label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:600}
.mfoot{padding:10px 20px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.mfoot button{min-height:40px;padding:0 16px;border:1px solid var(--line-3);border-radius:9px;background:transparent;color:var(--ink);font-weight:600}
.mfoot button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mfoot button[disabled]{opacity:.6}
.seg2{display:inline-flex;border:1px solid var(--line-3);border-radius:9px;overflow:hidden}
.seg2 button{border:0;background:var(--surface);padding:0 12px;min-height:38px;font-size:13.5px;border-left:1px solid var(--line-2)}
.seg2 button:first-child{border-left:0}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--ground);font-weight:600}
/* Reports (T3-P4-ACCOUNT, cap-mis.js): a figure that is a door reads as one; the row's next level is two short lines */
.fm-n{color:var(--accent-text);font-weight:700;text-decoration:underline;text-underline-offset:3px}

.result{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:10px 12px;flex-wrap:wrap}

<script>
'use strict';
/* ── the host globals the app's own files expect (app.html declares these with let/const; so does this page) ── */
const CFG = {

    try {
      var forced = localStorage.getItem('cb_api_base');
      if (forced) return forced === 'stage' ? window.CB_API : forced;
      var h = location.hostname;
      if (h === 'localhost' || h === '127.0.0.1') return 'http://localhost:3000';
    } catch (_) {}
    return window.CB_API;
  })()
};
let SESSION = { token: null, role: null, name: null, entity: null, bridgeId: null };
const EP = {};
let UI = { vp: 'lap', lw: 340, custs: [], sups: [] }; /* the rows cap-books.js's party editor reads — empty here: Finance edits no party */

  signedOut('Your session ended. Please sign in again.');

<script>
'use strict';
/* ═══ CB Finance — the page: gate · chrome. The screen is cap-finance.js. (The frame is crm.html's / accounts.html's.) ═════════════ */
const $ = (id) => document.getElementById(id);
let SESS = null,
  MINE = null;

function session() {
  try {
    const parsed = JSON.parse(localStorage.getItem('cb_sess') || 'null');
    return window.CBOnePerson && CBOnePerson.who(parsed) ? parsed : null;
  } catch (_) {
    return null;
  }
}
/* the SMALL APP a screen key hands over to (CB_HOMES, accounts-shell.js) — never the workshop (IX0) */
function navTo(k) {
  var h = CB_HOMES[k];
  if (h) location.href = h;
  else toast(tx('Not built outside the workshop yet.'));
}
function openChitPage(id) {
  location.href = chitPageHref(id);
} /* the sheet's "Open page": the chit page in CB CRM (CRM2), the same tab - Back returns (NAV-MAP 13) */
function openChit(id) {
  openChitSheet(id);
}
const confirmAsk = CBConfirm;

/* ── a sheet: the app's modal(html) / closeModal() signature on a native <dialog> (payOpen and Remind open here unchanged) ── */
function modal(html) {
  const node = $('fin_sheet');
  node.innerHTML = '<button data-cbsid="CMP005" class="mx" style="position:absolute;right:6px;top:6px" onclick="closeModal()" aria-label="Close" title="Close">✕</button>' + html;
  if (!node.open) {
    try {
      node.showModal();
    } catch (_) {
      node.setAttribute('open', '');
    }
  }
}
function closeModal() {
  const node = $('fin_sheet');
  try {
    node.close();
  } catch (_) {
    node.removeAttribute('open');
  }
  node.innerHTML = '';
  const paid = typeof PAY !== 'undefined' && PAY && PAY.id; /* a receipt was recorded: the list reads again, quietly */
  if (paid) {
    PAY = null;
    finLoad(true);
  }
  if (FIN.back) {
    const f = FIN.back;
    FIN.back = null;
    setTimeout(f, 0);
  }
}
$('fin_sheet').addEventListener('cancel', (e) => {
  e.preventDefault();
  closeModal();
});
$('fin_sheet').addEventListener('click', (e) => {
  if (e.target === $('fin_sheet')) closeModal();
});

/* ── the chrome ── */
$('toggleNav').addEventListener('click', () => {
  const open = $('side').classList.toggle('collapsed') === false;
  $('toggleNav').setAttribute('aria-expanded', String(open));
  $('toggleNav').setAttribute('aria-label', open ? 'Collapse sidebar' : 'Expand sidebar');
});
const railMq = window.matchMedia('(min-width:761px) and (max-width:1100px)');
function railFit() {
  const node = $('side'),
    t = $('toggleNav');
  node.classList.toggle('collapsed', railMq.matches);
  const open = !node.classList.contains('collapsed');
  t.setAttribute('aria-expanded', String(open));
  t.setAttribute('aria-label', open ? 'Collapse sidebar' : 'Expand sidebar');
}
if (railMq.addEventListener) railMq.addEventListener('change', railFit);
railFit();
/* SHELL-ONE: the frame, mounted once per session change (the shell mounts the bell and the avatar itself); signed out, the avatar's door scrolls to the sign-in card */
let FRAME = null;
function whoPaint() {
  const sessionToken = SESS ? SESS.token : null;
  if (FRAME && (FRAME.session ? FRAME.session.token : null) === sessionToken) return;
  FRAME = CBFrame.mount({
    app: 'finance',
    host: $('shell'),
    signin: false,
    avatar: {
      onSignIn: () => {
        const signinHost = $('signin-host');
        if (signinHost && signinHost.scrollIntoView) signinHost.scrollIntoView({ block: 'center' });
      }
    }
  });
  if (window.CBScreenId && !CBScreenId.current()) CBScreenId.here('finance');
}
function finCard(html, bad) {
  $('screen').className = 'screen';
  $('screen').innerHTML = `<div class="card${bad ? ' bad' : ''}" data-testid="fin-card">${html}</div>`;
}
function signedOut(why) {
  SESS = null;
  MINE = null;
  FIN.gen++;
  whoPaint();
  $('crumb').innerHTML = ''; /* the frame stays: its avatar is the Sign in door to the card below */
  finCard(`<h2>${esc(why || 'You are signed out')}</h2><div id="signin-host" data-testid="signin-host"></div>`);
  CBSignin.mount($('signin-host'), {
    apiBase: CFG.API_BASE,
    surface: 'finance',
    need: 'person',
    onIn: function () {
      start();
    }
  });
}
function closeFirst(r) {
  finCard(
    r.others
      .map(
        (item, index) => `<h2 data-testid="close-first">${esc(CBOnePerson.sentence(item))}</h2>
      <button data-cbsid="FIN001-B02" type="button" class="act" data-testid="close-first-go" data-i="${index}">${esc(CBOnePerson.buttonLabel(item))}</button>`
      )
      .join(''),
    true
  );
  $('screen')
    .querySelectorAll('[data-testid="close-first-go"]')
    .forEach((item) => {
      item.onclick = () => {
        $('screen')
          .querySelectorAll('button')
          .forEach((x) => {
            x.disabled = true;
          });
        item.textContent = 'Signing it out…';
        CBOnePerson.clearOut(r.others[+item.getAttribute('data-i')], MINE.name).then(start, start);
      };
    });
}

/* ═══ START ═══ */
async function start() {
  SESS = session();
  if (!SESS) return signedOut('');
  MINE = CBOnePerson.who(SESS);
  SESSION = Object.assign(
    { token: null },
    {
      entityId: MINE && MINE.ent,
      token: SESS.token,
      role: SESS.role,
      name: SESS.name,
      entity: SESS.entity,
      bridgeId: SESS.bridgeId,
      duty: SESS.duty,
      hat: SESS.hat,
      shop: SESS.shop
    }
  );
  const g = ++FIN.gen;
  whoPaint();
  finMount(true); /* the whole frame at once; only the rows change when the data arrives */
  let t;
  try {
    t = await CBOnePerson.traces(MINE);
  } catch (_) {
    t = { others: [] };
  }
  if (g !== FIN.gen || !MINE) return;
  if (t.others.length) return closeFirst(t);
  if (window.CBKural) CBKural.set('accounts');
  finLoad();
}

window.addEventListener('storage', (e) => {
  if (e.key !== null && e.key !== 'cb_sess') return;
  if (!MINE) return;
  const next = CBOnePerson.stored();
  if (next && next.ent === MINE.ent) return;
  signedOut(next ? 'Signed out — ' + CBOnePerson.shopName(next) + ' opened in another tab.' : 'Signed out — you signed out in another tab.');
});
CBOnePerson.attach({
  quiet: true,
  who: () => MINE,
  label: () => 'Finance',
  onLeave: (by) => {
    location.replace('/?left=' + encodeURIComponent(by || ''));
  },
  onWipe: () => {
    location.replace('/?cleaned=1');
  }
});
if (window.CBKural) CBKural.mount();
start();
</script>
