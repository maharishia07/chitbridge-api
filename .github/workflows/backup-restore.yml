# backup-restore.yml — A BACKUP NOBODY HAS RESTORED IS A RUMOUR (Athi, 2026-09-07: gap #2).
#
# Every night this takes a real dump of the production database, RESTORES IT into a throwaway Postgres in the same job, and counts what
# came back. So the thing we prove is not "a file exists" but "the file can bring the business back". The dump is kept as a build
# artifact, off Supabase and off Railway, which is the point of an off-platform copy.
#
# ⚠️ IT NEEDS ONE SECRET, and it does nothing until it is set:
#     GitHub → this repository → Settings → Secrets and variables → Actions → New repository secret
#     Name:  BACKUP_DATABASE_URL
#     Value: Supabase → Project Settings → Database → Connection string → **Session pooler** (IPv4; the direct host is IPv6-only
#            and GitHub runners have no IPv6). A read-only role is enough and is the better choice.
# ⚠️ THE SECRET IS NOT THE APP'S DATABASE_URL COPIED BLINDLY — the app connects through Railway's network; this one has to work from a
#    public runner, which is why the pooler URI is named above.
# ⚠️ Nothing here ever writes to production. It reads, and it restores into a container that is destroyed with the job.
name: backup-restore

on:
  schedule:
    - cron: '30 20 * * *'       # 20:30 UTC = 02:00 IST, the quietest hour for an Indian shop
  workflow_dispatch:

jobs:
  prove-the-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      scratch:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: scratch
          POSTGRES_DB: restored
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Is the secret set?
        run: |
          if [ -z "${{ secrets.BACKUP_DATABASE_URL }}" ]; then
            echo "BACKUP_DATABASE_URL is not set — see the header of this file. Nothing was backed up."
            exit 1
          fi

      - name: Postgres 16 client (the server is 15+; an older pg_dump refuses)
        run: |
          set -euo pipefail
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sed -i 's|deb |deb [signed-by=/usr/share/keyrings/pgdg.gpg] |' /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16

      - name: Take the dump
        env:
          URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y-%m-%d)
          pg_dump --no-owner --no-privileges --schema=public --format=custom --file="cb-$stamp.dump" "$URL"
          ls -lh "cb-$stamp.dump"
          echo "STAMP=$stamp" >> $GITHUB_ENV

      - name: Restore it into a throwaway database
        run: |
          set -euo pipefail
          export PGPASSWORD=scratch
          pg_restore --no-owner --no-privileges --dbname "postgresql://postgres@localhost:5432/restored" "cb-$STAMP.dump" 2>&1 | tail -20 || true
          psql "postgresql://postgres@localhost:5432/restored" -c "\dt" | head -30

      - name: Count what came back — the actual proof
        run: |
          set -euo pipefail
          export PGPASSWORD=scratch
          DB="postgresql://postgres@localhost:5432/restored"
          for t in identities chit_header chit_status products; do
            n=$(psql "$DB" -tAc "SELECT count(*) FROM $t" 2>/dev/null || echo "MISSING")
            echo "$t: $n"
            [ "$n" = "MISSING" ] && { echo "table $t did not come back"; exit 1; }
          done
          # a restore that brings back an empty shell passes a row count of zero; refuse that too
          n=$(psql "$DB" -tAc "SELECT count(*) FROM identities")
          [ "$n" -gt 0 ] || { echo "identities restored empty — the dump is not usable"; exit 1; }

      - name: Keep the dump off-platform
        uses: actions/upload-artifact@v4
        with:
          name: cb-backup-${{ env.STAMP }}
          path: cb-*.dump
          retention-days: 30
