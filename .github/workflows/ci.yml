name: CI

# A5 — gate every push/PR. The `static` job runs now and blocks merges on syntax/CRLF defects (it would have
# caught the smoke-script CRLF + the assist.js boot-breaker class). The `integration` job runs the smoke + A4
# isolation suites against a throwaway Postgres — it is GATED (see its `if:`) until the prerequisites land.
on:
  push:
    branches: ["**"]
  pull_request:
  # nightly, so the test board updates even when nobody pushes (Athi, 2026-10-07: "the test engine can exist" without us)
  schedule:
    - cron: '30 20 * * *'   # 02:00 IST
  workflow_dispatch:

jobs:
  static:
    name: static checks (syntax + LF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node --check every JS file (excl. node_modules)
        run: |
          set -e
          find . -path ./node_modules -prune -o -name '*.js' -print | while read -r f; do
            node --check "$f"
          done
      - name: bash -n every shell script
        run: |
          set -e
          for f in scripts/*.sh; do bash -n "$f"; done
      - name: shell scripts must be LF (no CRLF)
        run: |
          if grep -lUP '\r' scripts/*.sh; then
            echo "::error::CRLF found in a shell script (must be LF — see .gitattributes)"; exit 1
          fi

  guards:
    # ⭐⭐ THE GATE, ON EVERY PUSH (2026-09-28). Until today CI ran syntax only and scripts/guards.cjs ran when
    # somebody remembered to type it. The guards are offline by design — no DB, no network, no server — so they
    # need only the three repos side by side, exactly as they sit in C:\dev:
    #   chitbridge-api (this) · chitbridge-web (public) · chitbridge-engines (PRIVATE — needs ENGINES_READ_TOKEN)
    # Without the token, the two guards that read the engines repo are SKIPPED WITH A WARNING (never passed);
    # every other guard runs. Add the secret (a fine-grained read-only token for chitbridge-engines) to run all.
    name: guards (offline — no DB, no network)
    runs-on: ubuntu-latest
    env:
      CB_ENGINES_ABSENT_OK: "1"
      HAS_ENGINES_TOKEN: ${{ secrets.ENGINES_READ_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: chitbridge-api
          fetch-depth: 0     # READ-GUARD: tests/readability-guard.test.cjs diffs against origin/main (merge-base) — it needs the history
      # ⭐ TWIN BRANCHES (13 Oct): a branch that also exists in chitbridge-web is tested against THAT web branch, not web main — so twin
      # PRs (same branch name in both repos, e.g. integrate/1013, round/<NAME>-<run>) check each other instead of deadlocking. Else: main.
      - name: Twin web branch?
        id: twin
        env:
          B: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -n "$B" ] && git ls-remote --exit-code --heads https://github.com/maharishia07/chitbridge-web "$B" >/dev/null 2>&1; then
            echo "ref=$B" >> "$GITHUB_OUTPUT"; echo "twin: testing against chitbridge-web branch $B"
          else echo "ref=main" >> "$GITHUB_OUTPUT"; echo "no twin: chitbridge-web main"; fi
      - uses: actions/checkout@v4
        with:
          repository: maharishia07/chitbridge-web
          ref: ${{ steps.twin.outputs.ref }}
          path: chitbridge-web
      - name: chitbridge-engines (private — only when the token is set)
        if: ${{ env.HAS_ENGINES_TOKEN == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: maharishia07/chitbridge-engines
          token: ${{ secrets.ENGINES_READ_TOKEN }}
          path: chitbridge-engines
          fetch-depth: 0     # adopt --check verifies against the TAGS the lock pins
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install (api)
        working-directory: chitbridge-api
        run: npm ci
      - name: scripts/guards.cjs
        working-directory: chitbridge-api
        run: node scripts/guards.cjs --junit test-results/guards.xml
      # ⭐⭐ THE BOARD HEARS ABOUT IT (2026-10-07). The gate went green on every push and the test board read 0 results.
      # The guards now write JUnit keyed by the board's own case key; this posts it with the ONE poster we have
      # (chitbridge-web/e2e/post-results.cjs, already checked out above), on a key minted with the `testing` scope.
      # ⚠️ It never fails the build: no secret, no report or a refused post is a ::warning:: that names why.
      # ⚠️ main only — the board's "latest word" on a case is about main, not about somebody's branch.
      - name: post the guards to the test board
        if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        continue-on-error: true
        working-directory: chitbridge-api
        env:
          CB_BOARD_TOKEN: ${{ secrets.CB_BOARD_TOKEN }}
        run: |
          if [ -z "$CB_BOARD_TOKEN" ]; then
            echo "::warning::guards not posted to the test board — add the CB_BOARD_TOKEN secret (a key with the testing scope)"; exit 0
          fi
          if [ ! -f test-results/guards.xml ]; then
            echo "::warning::guards not posted to the test board — the run wrote no test-results/guards.xml"; exit 0
          fi
          node ../chitbridge-web/e2e/post-results.cjs --file "$PWD/test-results/guards.xml" --keys name \
            --kind unit --layer engine --label "guards ${GITHUB_SHA::7}" --build "${GITHUB_SHA::7}" --warn \
            --project "${{ vars.CB_BOARD_PROJECT }}"

  seams-drift:
    # DOC-68 (docs truth): docs/SEAMS.md is GENERATED (node C:/dev/seams.cjs --write), so a drift check fails the build the way MODULES.md does.
    # ONE copy of the logic: tools/vendor/seams.cjs in the web repo (run from a web checkout, a same-named branch wins like the other twin steps).
    # It reads only THIS repo's checkout, so a change in the sibling repo can never turn this red. Refresh: node C:/dev/seams.cjs --write (LF checkout).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Twin web branch?
        id: twin
        env:
          B: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -n "$B" ] && git ls-remote --exit-code --heads https://github.com/maharishia07/chitbridge-web "$B" >/dev/null 2>&1; then
            echo "ref=$B" >> "$GITHUB_OUTPUT"; else echo "ref=main" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        with:
          repository: maharishia07/chitbridge-web
          ref: ${{ steps.twin.outputs.ref }}
          path: .side/chitbridge-web
      - name: docs/SEAMS.md has not drifted (node .side/chitbridge-web/tools/vendor/seams.cjs --check --repo api)
        run: node .side/chitbridge-web/tools/vendor/seams.cjs --check --repo api

  pr-checklist:
    # ⭐ READ-GUARD (DISCIPLINES §6): a PR's body carries the §6 checklist WITH NUMBERS (.github/pull_request_template.md), filled from
    # `node ../chitbridge-web/tools/readability.cjs --changed --repo api --root . --ratchet --md`. ONE reader for both repos: the web's
    # tools/pr-checklist.cjs, run from a web checkout (main) — never a copy. Dependency bots and docs-only PRs skip. The body travels in an env var.
    name: pr-checklist (§6 numbers in the PR body)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: maharishia07/chitbridge-web
          path: .side/chitbridge-web
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: The PR body carries the §6 checklist with numbers (bots' dependency PRs and docs-only PRs skip)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ ! -f .side/chitbridge-web/tools/pr-checklist.cjs ]; then echo "::warning::pr-checklist skipped — chitbridge-web main has no tools/pr-checklist.cjs yet (READ-GUARD lands in the web first)"; exit 0; fi
          node .side/chitbridge-web/tools/pr-checklist.cjs --author "$PR_AUTHOR" --base "$PR_BASE" --root "$PWD"

  integration:
    name: integration (smoke + isolation) — DB-backed
    # GATED until the prerequisites land, then flip on by setting repo variable CI_INTEGRATION=true:
    #   1) db/index.js must honour a plain DATABASE_URL (it currently hardcodes the Supabase pooler host/ref and
    #      ignores the URL's host — so it cannot connect to this CI Postgres). See TECH-HARDENING-BACKLOG
    #      "Remove hardcodes in db/index.js".
    #   2) the schema bootstrap below must apply cleanly (order/extensions confirmed on a first real run).
    # Until then this job is skipped, so the build stays green while the static gate still protects every merge.
    if: ${{ vars.CI_INTEGRATION == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cb_test
      NODE_ENV: development
      JWT_SECRET: ci_test_secret_at_least_32_chars_padding
      DEV_OTP: "123456"
      PORT: "3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Bootstrap schema + migrations (MANIFEST order — confirm on first run)
        run: |
          set -e
          export PGPASSWORD=postgres
          PSQL="psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d cb_test -f"
          $PSQL db/schema.sql
          $PSQL db/schema_b2_migration.sql
          $PSQL db/schema_b3_pin_migration.sql
          for m in migration_b35 migration_b36 migration_b37 migration_b37a migration_b39 \
                   migration_b310 migration_b310a_freeze migration_b311_shop_status \
                   migration_gov01_protected_entity migration_fp01 migration_user_id_identities \
                   migration_chit_header_role migration_chit_direction migration_dispute_routing \
                   migration_chit_reads migration_check_constraints migration_otp_attempts \
                   migration_customer_contact; do
            $PSQL "$m.sql"
          done
          # cb_* network/catalogue schema (for the jest suites)
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d cb_test -c "CREATE EXTENSION IF NOT EXISTS ltree;"
          $PSQL migrations/archive/net01_network.sql
          $PSQL migrations/archive/net02_chit.sql
          $PSQL migrations/archive/net03_full_schema.sql
      - name: Jest DB suites (cb_* network/catalogue)
        run: npm run test:jest
      - name: Start API + wait for health
        run: |
          node server.js &
          for i in $(seq 1 20); do curl -sf http://localhost:3000/health && break || sleep 1; done
      - name: Smoke (review fixes)
        run: API_BASE=http://localhost:3000 bash scripts/smoke-review-fixes.sh
      - name: Isolation suite (A4)
        run: API_BASE=http://localhost:3000 bash scripts/isolation-suite.sh
      - name: E01 limits, with a real database (a planted pg_sleep is cancelled by the statement deadline)
        run: node tests/limits.test.cjs

  fresh-db:
    # SCHEMA-FIX1 (16 Oct): rule R11 of the schema lint cannot prove a chain builds — only an EMPTY Postgres can. Unlike `integration` this is
    # NOT gated: it needs no server and no Supabase pooler, only a plain Postgres service and psql (on the runner).
    #   1) tools/fresh-db-check.cjs → tools/migrate.cjs apply(): baseline + every bNNN in order on an empty database; fails on any file that
    #      errors outside migrations/fresh-db.accepted.json (shrink-only, now empty), and on an accepted file that now passes.
    #   2) tests/rls-fresh-db.test.cjs: the RLS isolation test on THAT database, as cb_app (no context → nothing; A never sees B).
    # cb_metrics is an ops role the owner creates by hand in production (b151's header); the job creates it the same way first.
    name: fresh-db (empty Postgres built from migrations/ + RLS isolation)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cb_fresh
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      CB_FRESH_DB_URL: postgres://postgres:postgres@localhost:5432/cb_fresh
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: ops role that production has by hand (b151 header)
        run: psql "$CB_FRESH_DB_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE cb_metrics NOLOGIN"
      - name: build the empty database from migrations/ (fails on any file outside fresh-db.accepted.json)
        run: node tools/fresh-db-check.cjs --db "$CB_FRESH_DB_URL"
      - name: RLS isolation test on the fresh database
        run: node tests/rls-fresh-db.test.cjs
      - name: the runner refuses a role that cannot see the ledger (K-DB)
        run: node tests/migrate-ledger-visible.test.cjs
      - name: the monthly test_result routine (summarise, purge) inside one rolled-back transaction (K-DB, DB-8)
        run: node tests/test-result-routine.test.cjs

  scan:
    # E02 — dependency + secret scanning on every push/PR.
    #  1) npm audit: shipped (production) dependencies must carry no high/critical advisory. Dev-only tooling is
    #     listed in RETIRED.md instead of gating (a dev tool is never deployed).
    #  2) gitleaks-action: the commits this push/PR adds.
    #  3) gitleaks on the WHOLE working tree (not history). .gitleaks.toml names the only allowed files.
    name: scan (npm audit + gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (production dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high
      - name: gitleaks (whole working tree, no history)
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          set -e
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o "$RUNNER_TEMP/gl.tgz" "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/gl.sum" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" "$RUNNER_TEMP/gl.sum" | sed "s|  .*|  $RUNNER_TEMP/gl.tgz|" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --no-git --source . --config .gitleaks.toml --redact --verbose --exit-code 2
      # 14 Oct: the commits of this push / PR through the FREE CLI (gitleaks-action@v2 demanded a paid licence whenever its owner lookup
      # failed — a flake that blocked green PRs). Same binary as the step above; same config.
      - name: gitleaks (commits in this push / PR)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -e
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then RANGE="$HEAD~1..$HEAD"; else RANGE="$BASE..$HEAD"; fi
          echo "scanning commits $RANGE"
          "$RUNNER_TEMP/gitleaks" detect --source . --log-opts="$RANGE" --config .gitleaks.toml --redact --verbose --exit-code 2
