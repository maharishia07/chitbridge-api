<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; background: #F3EFE6; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #16693F; }
    button { font-family: inherit; }
  </style>
</helmet>
<div style="width: 1180px; height: 820px; box-sizing: border-box; display: flex; background: #FCFAF5; color: #1D1B16;">
  <!-- rail -->
  <div style="width: 96px; flex-shrink: 0; box-sizing: border-box; padding: 16px 10px; display: flex; flex-direction: column; align-items: stretch; gap: 10px; background: #1D1B16; color: #FCFAF5;">
    <span style="text-align: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 800; padding-bottom: 8px;">CB</span>
    <sc-for list="{{rail}}" as="g" hint-placeholder-count="4">
      <span style="height: 76px; border-radius: 14px; background: {{g.bg}}; color: {{g.ink}}; border: {{g.border}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 700;">
        <span style="width: 22px; height: 22px; border-radius: 6px; border: 2px solid {{g.ink}}; display: flex; align-items: center; justify-content: center;">
          <sc-if value="{{g.on}}" hint-placeholder-val="{{ true }}">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
          </sc-if>
        </span>
        {{g.name}}
        <span style="font-weight: 500; font-size: 11px;">{{g.avail}}</span>
      </span>
    </sc-for>
    <span style="margin-top: auto; text-align: center; font-size: 11px; color: #BDB7AA;">Long-press a group to pick items</span>
  </div>

  <div style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800;">Sell</span>
      <span style="font-size: 13px; color: #5E594D;">Counter 1 · online · 11:42</span>
      <div style="flex-grow: 1;"></div>
      <span style="height: 40px; width: 220px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #CFC7B5; background: #FFFFFF; font-size: 14px; color: #6B6558; display: flex; align-items: center;">Search or scan</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 96px; gap: 10px;">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="16">
        <div style="position: relative; box-sizing: border-box; padding: 12px; border-radius: 14px; background: {{t.bg}}; display: flex; flex-direction: column; justify-content: space-between;">
          <span style="font-size: 15px; font-weight: 700; line-height: 1.2; padding-right: 22px;">{{t.name}}</span>
          <span style="font-size: 14px; font-weight: 600;">{{t.price}}</span>
          <span style="position: absolute; top: 8px; right: 8px; width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,0.75); display: flex; align-items: center; justify-content: center;">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#1D1B16" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </span>
          <sc-if value="{{t.inBill}}" hint-placeholder-val="{{ false }}">
            <span style="position: absolute; bottom: 10px; right: 10px; width: 28px; height: 28px; border-radius: 14px; background: #1D1B16; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center;">{{t.qty}}</span>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="width: 380px; flex-shrink: 0; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; border-left: 1px solid #DDD6C6;">
    <div style="padding: 18px 18px 10px; font-size: 15px; font-weight: 700;">3 products · 5 items</div>
    <div style="flex-grow: 1; padding: 0 18px;">
      <sc-for list="{{lines}}" as="l" hint-placeholder-count="3">
        <div style="min-height: 62px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #EDE8DC;">
          <span style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-size: 15px; font-weight: 600;">{{l.name}}</span><span style="font-size: 12px; color: #5E594D;">{{l.qty}} × {{l.unit}}</span></span>
          <span style="font-size: 16px; font-weight: 700;">{{l.total}}</span>
        </div>
      </sc-for>
    </div>
    <div style="padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 10px; border-top: 2px solid #1D1B16;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800;">TOTAL</span><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 32px; font-weight: 800;">₹220.00</span></div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
        <button style="height: 48px; border-radius: 11px; border: 1px solid #BDB4A1; background: #FFFFFF; font-size: 15px;">Cash</button>
        <button style="height: 48px; border-radius: 11px; border: 1px solid #BDB4A1; background: #FFFFFF; font-size: 15px;">Card</button>
        <button style="height: 48px; border-radius: 11px; border: 2px solid #16693F; background: #E8F4ED; color: #16693F; font-size: 15px; font-weight: 700;">UPI</button>
      </div>
      <button style="height: 60px; border-radius: 13px; border: none; background: #16693F; color: #FFFFFF; font-size: 18px; font-weight: 700;">Save &amp; print</button>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const m = [['Idli (2 pc)', 40], ['Masala Dosa', 70, 2], ['Medu Vada', 30, 1], ['Rava Upma', 45], ['Kesari Bath', 35], ['Filter Coffee', 25, 2], ['Masala Tea', 20], ['Rava Dosa', 75]];
    const a = [['South Indian Meals', 150], ['Veg Biryani', 140], ['Curd Rice', 70], ['Sambar Rice', 80], ['Lemon Rice', 65], ['Chapati Kurma', 75], ['Veg Pulao', 110], ['Buttermilk', 25]];
    const tiles = m.map((x) => ({ name: x[0], price: '₹' + x[1], qty: x[2] || 0, inBill: !!x[2], bg: '#FBE3A6' }))
      .concat(a.map((x) => ({ name: x[0], price: '₹' + x[1], qty: 0, inBill: false, bg: '#F9CDBD' })));
    const r = (name, avail, on, color) => ({ name, avail, on, bg: on ? color : 'transparent', ink: on ? '#1D1B16' : '#BDB7AA', border: on ? 'none' : '1px dashed #5E594D' });
    return {
      tiles,
      rail: [r('Morning', '7/10', true, '#F6C554'), r('Afternoon', '10/10', true, '#F58A6E'), r('Evening', '10/10', false), r('Night', '10/10', false)],
      lines: [{ name: 'Masala Dosa', qty: 2, unit: '₹70', total: '₹140.00' }, { name: 'Filter Coffee', qty: 2, unit: '₹25', total: '₹50.00' }, { name: 'Medu Vada', qty: 1, unit: '₹30', total: '₹30.00' }]
    };
  }
}
</script>
</body>
</html>
