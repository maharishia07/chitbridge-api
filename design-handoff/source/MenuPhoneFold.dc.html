<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; background: #E9E4D8; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #16693F; }
    button { font-family: inherit; }
    .hd:hover { background: #F0ECE2 !important; }
    button:focus-visible { outline: 2px solid #16693F; outline-offset: 2px; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FCFAF5; color: #1D1B16;">

  <div style="flex-shrink: 0; padding: 16px 16px 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #E6E0D2;">
    <div style="flex-grow: 1; display: flex; flex-direction: column;">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 800;">Counter 1</span>
      <span style="font-size: 12px; color: #5E594D;">Prestige Smart Kitchen · <span style="color: #16693F;">● online</span> · 11:28</span>
    </div>
    <button aria-label="Close" style="width: 40px; height: 40px; border-radius: 12px; border: 1px solid #CFC7B5; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;">
    <sc-for list="{{sections}}" as="s" hint-placeholder-count="4">
      <div style="border-radius: 14px; border: 1px solid {{s.line}}; background: {{s.bg}}; overflow: hidden;">
        <button class="hd" onClick="{{s.toggle}}" aria-expanded="{{s.expandedAttr}}" style="width: 100%; box-sizing: border-box; min-height: 60px; padding: 10px 12px; display: flex; align-items: center; gap: 12px; border: none; background: transparent; text-align: left; color: {{s.ink}}; cursor: pointer;">
          <span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; background: {{s.tint}}; color: {{s.iconInk}}; display: flex; align-items: center; justify-content: center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{s.icon}}"></path></svg>
          </span>
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 16px; font-weight: 700;">{{s.label}}</span>
            <span style="font-size: 12px; color: {{s.descInk}};">{{s.summary}}</span>
          </span>
          <span style="display: flex; transform: {{s.rot}}; color: #5E594D;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
          </span>
        </button>
        <sc-if value="{{s.expanded}}" hint-placeholder-val="{{ false }}">
          <div style="padding: 0 10px 10px; display: flex; flex-direction: column; gap: 8px;">
            <sc-for list="{{s.rows}}" as="r" hint-placeholder-count="3">
              <button style="width: 100%; box-sizing: border-box; min-height: 56px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; border-radius: 11px; border: 1px solid {{r.line}}; background: #FFFFFF; text-align: left; color: {{r.ink}}; cursor: pointer;">
                <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
                  <span style="font-size: 15px; font-weight: 600;">{{r.name}}</span>
                  <span style="font-size: 12px; color: {{r.descInk}};">{{r.desc}}</span>
                </span>
                <sc-if value="{{r.hasKey}}" hint-placeholder-val="{{ false }}">
                  <span style="height: 22px; padding: 0 7px; border-radius: 6px; border: 1px solid #D8D1C1; background: #F5F1E7; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #3E3A31; display: flex; align-items: center;">{{r.key}}</span>
                </sc-if>
              </button>
            </sc-for>
            <sc-if value="{{s.isLook}}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; flex-direction: column; gap: 8px;">
                <sc-for list="{{look}}" as="l" hint-placeholder-count="3">
                  <label style="display: flex; align-items: center; gap: 10px; font-size: 14px;">
                    <span style="flex-grow: 1; color: #3E4248;">{{l.label}}</span>
                    <span style="height: 40px; min-width: 132px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #CFC7B5; background: #FFFFFF; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 8px;">
                      {{l.value}}
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#5E594D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
                    </span>
                  </label>
                </sc-for>
                <sc-for list="{{shows}}" as="sh" hint-placeholder-count="6">
                  <label style="min-height: 46px; padding: 0 10px; display: flex; align-items: center; gap: 10px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E2DCCD; font-size: 14px;">
                    <span style="flex-grow: 1;">{{sh.name}}</span>
                    <span style="width: 46px; height: 26px; padding: 2px; box-sizing: border-box; border-radius: 13px; background: {{sh.track}}; display: flex; justify-content: {{sh.justify}};"><span style="width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF;"></span></span>
                  </label>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="flex-shrink: 0; padding: 12px 16px 24px; border-top: 1px solid #E6E0D2; font-size: 12px; color: #5E594D; display: flex; justify-content: space-between;">
    <span>Nobody signed in · <a href="#">Sign in · F7</a></span><span>v4.2.1</span>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const I = {
  bills: 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6',
  shop: 'M4 8h16l-1 12H5zM8 8V6a4 4 0 0 1 8 0v2',
  counter: 'M4 6h16v12H4zM8 10h8M8 14h5',
  look: 'M12 4a8 8 0 1 0 0 16zM12 4a8 8 0 0 1 0 16',
  careful: 'M12 4l9 16H3zM12 10v4M12 17h.01'
};
const SEC = [
  { id: 'bills', label: 'Bills', summary: "today's bills · stuck bills", icon: 'bills', tint: '#FDF3DC', iconInk: '#7A5205',
    rows: [['Today’s bills', 'print one again', 'F8'], ['Why is a bill stuck?', "this counter's store", '']] },
  { id: 'shop', label: 'Shop & prices', summary: 'read again · shop screen · ChitBridge', icon: 'shop', tint: '#E8F4ED', iconInk: '#16693F',
    rows: [['Read the shop again', 'new prices and products', 'F4'], ['Shop screen', 'offers as a TV sign', ''], ['ChitBridge', 'orders, suppliers, books', '']] },
  { id: 'counter', label: 'This counter', summary: 'settings · break · install', icon: 'counter', tint: '#EFEBE1', iconInk: '#3E3A31',
    rows: [['Settings', 'look, printer, this till', ''], ['Take a break', 'nothing is closed', ''], ['Install as an app', 'opens without a browser', '']] },
  { id: 'look', label: 'How it looks', summary: 'Normal · Light cream · 5 of 6 shown', icon: 'look', tint: '#EFEBE1', iconInk: '#3E3A31', rows: [], isLook: true },
  { id: 'careful', label: 'Careful', summary: 'clear and reload · close this counter', icon: 'careful', tint: '#F8E2D6', iconInk: '#8A3517', danger: true,
    rows: [['Clear and reload', 'reads the shop fresh', ''], ['Close this counter', 'sends and checks first', '']] }
];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: 'bills' }; }
  renderVals() {
    const open = this.state.open;
    return {
      sections: SEC.map((s) => {
        const ex = s.id === open;
        return {
          label: s.label, summary: s.summary, icon: I[s.icon], tint: s.tint, iconInk: s.iconInk,
          expanded: ex, expandedAttr: ex ? 'true' : 'false', rot: ex ? 'rotate(180deg)' : 'none',
          isLook: !!s.isLook && ex,
          bg: s.danger ? '#FDF3EE' : (ex ? '#F5F1E7' : '#FFFFFF'),
          line: s.danger ? '#F1C7AE' : (ex ? '#D8D1C1' : '#E6E0D2'),
          ink: s.danger ? '#6E2A0C' : '#1D1B16',
          descInk: s.danger ? '#A3542F' : '#5E594D',
          toggle: () => this.setState({ open: ex ? null : s.id }),
          rows: s.rows.map((r) => ({ name: r[0], desc: r[1], key: r[2], hasKey: !!r[2], line: s.danger ? '#E8B79C' : '#E2DCCD', ink: s.danger ? '#6E2A0C' : '#1D1B16', descInk: s.danger ? '#A3542F' : '#5E594D' }))
        };
      }),
      look: [
        { label: 'Text size', value: 'Normal' },
        { label: 'Theme', value: 'Light cream' },
        { label: 'Products', value: 'Everything' }
      ],
      shows: ['Search box', 'Categories', 'Quick keys', 'The product list', 'Keyboard shortcuts', 'Customer name and phone'].map((n, i) => {
        const on = i !== 4;
        return { name: n, track: on ? '#16693F' : '#CFC7B5', justify: on ? 'flex-end' : 'flex-start' };
      })
    };
  }
}
</script>
</body>
</html>
