<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
  <style>
    body { margin: 0; background: #F7F5F0; font-family: 'Schibsted Grotesk', system-ui, sans-serif; }
    a { color: #1F5FBF; } a:hover { color: #123F82; }
    button, input { font-family: inherit; }
    .it:hover { background: #F1EDE3 !important; }
    button:focus-visible, input:focus-visible { outline: 2px solid #1F5FBF; outline-offset: 2px; }
  </style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #F7F5F0; color: #151412;">
  <div style="height: 88px; flex-shrink: 0; box-sizing: border-box; padding: 0 32px; display: flex; align-items: center; gap: 16px; background: #FFFFFF; border-bottom: 1px solid #E2DDD2;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #6E695E;">POPUP OPTION · FULL-SCREEN PICKER</span>
      <span style="font-size: 28px; font-weight: 800; letter-spacing: -0.02em;">What's on the counter now?</span>
    </div>
    <button onClick="{{onlyNow}}" style="height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #CFC8B8; background: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer;">Reset to current time</button>
  </div>

  <div style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 24px 32px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px;">
    <sc-for list="{{cols}}" as="g" hint-placeholder-count="4">
      <div style="min-height: 0; display: flex; flex-direction: column; border-radius: 16px; background: #FFFFFF; border: 2px solid {{g.line}}; opacity: {{g.fade}}; overflow: hidden;">
        <label style="padding: 14px 16px; display: flex; align-items: center; gap: 12px; background: {{g.head}}; cursor: pointer;">
          <input type="checkbox" checked="{{g.on}}" onChange="{{g.toggle}}" style="width: 24px; height: 24px; margin: 0; accent-color: #151412;">
          <span style="flex-grow: 1; display: flex; flex-direction: column;">
            <span style="font-size: 20px; font-weight: 800;">{{g.name}}</span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #3E3A31;">{{g.win}}</span>
          </span>
          <sc-if value="{{g.isNow}}" hint-placeholder-val="{{ false }}">
            <span style="height: 22px; padding: 0 8px; border-radius: 11px; background: #151412; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center;">NOW</span>
          </sc-if>
        </label>
        <div style="padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #5A564D; border-bottom: 1px solid #ECE7DC;">
          <span>{{g.avail}}</span>
          <span style="display: flex; gap: 4px;">
            <button onClick="{{g.all}}" style="height: 30px; padding: 0 8px; border-radius: 6px; border: none; background: transparent; color: #1F5FBF; font-size: 13px; font-weight: 600; cursor: pointer;">All</button>
            <button onClick="{{g.none}}" style="height: 30px; padding: 0 8px; border-radius: 6px; border: none; background: transparent; color: #1F5FBF; font-size: 13px; font-weight: 600; cursor: pointer;">None</button>
          </span>
        </div>
        <div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 4px 8px 8px;">
          <sc-for list="{{g.items}}" as="it" hint-placeholder-count="10">
            <label class="it" style="min-height: 46px; padding: 0 8px; display: flex; align-items: center; gap: 10px; border-radius: 8px; cursor: pointer;">
              <input type="checkbox" checked="{{it.on}}" onChange="{{it.toggle}}" style="width: 20px; height: 20px; margin: 0; accent-color: #1F7A4C;">
              <span style="flex-grow: 1; font-size: 15px; font-weight: 500; color: {{it.ink}}; text-decoration: {{it.strike}};">{{it.name}}</span>
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #6E695E;">{{it.price}}</span>
            </label>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="height: 84px; flex-shrink: 0; box-sizing: border-box; padding: 0 32px; display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-top: 1px solid #E2DDD2;">
    <span style="flex-grow: 1; font-size: 16px;">Showing <strong>{{summary}}</strong> · until shift close</span>
    <button style="height: 52px; padding: 0 24px; border-radius: 12px; border: 1px solid #CFC8B8; background: #FFFFFF; font-size: 16px; font-weight: 600; cursor: pointer;">Cancel</button>
    <button style="height: 52px; padding: 0 36px; border-radius: 12px; border: none; background: #1F7A4C; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer;">Apply</button>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
const GROUPS = [
  { id: 'm', name: 'Morning', win: '06:00 – 11:30', head: '#FDF0D2', line: '#E0A020', items: [['Idli (2 pc)', 40], ['Masala Dosa', 70], ['Ven Pongal', 60], ['Poori Masala', 65], ['Medu Vada', 30], ['Rava Upma', 45], ['Rava Dosa', 75], ['Kesari Bath', 35], ['Filter Coffee', 25], ['Masala Tea', 20]] },
  { id: 'a', name: 'Afternoon', win: '11:30 – 15:30', head: '#FDE3DB', line: '#E4472B', items: [['South Indian Meals', 150], ['Veg Biryani', 140], ['Curd Rice', 70], ['Sambar Rice', 80], ['Lemon Rice', 65], ['Chapati Kurma', 75], ['Veg Pulao', 110], ['Paneer Butter Masala', 160], ['Buttermilk', 25], ['Gulab Jamun', 40]] },
  { id: 'e', name: 'Evening', win: '15:30 – 19:00', head: '#ECE8FB', line: '#7A62D9', items: [['Onion Bajji', 40], ['Samosa (2 pc)', 35], ['Mysore Bonda', 40], ['Pav Bhaji', 90], ['Veg Puff', 25], ['Veg Cutlet', 45], ['Sweet Corn Cup', 50], ['Chana Sundal', 30], ['Ginger Tea', 20], ['Badam Milk', 45]] },
  { id: 'n', name: 'Night', win: '19:00 – 23:00', head: '#E2EEFB', line: '#2F74C9', items: [['Chapati (2 pc)', 50], ['Parotta Salna', 70], ['Idiyappam', 60], ['Kothu Parotta', 120], ['Onion Uttapam', 80], ['Ghee Roast', 95], ['Veg Fried Rice', 130], ['Gobi Manchurian', 120], ['Veg Noodles', 125], ['Hot Milk', 25]] }
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { active: { m: true, a: true, e: false, n: false }, hidden: { 'm:2': true, 'm:3': true, 'm:6': true } };
  }
  setMany(g, hide) {
    this.setState((st) => { const h = { ...st.hidden }; g.items.forEach((_, i) => { const k = g.id + ':' + i; if (hide) h[k] = true; else delete h[k]; }); return { hidden: h }; });
  }
  renderVals() {
    const s = this.state;
    let keys = 0;
    const cols = GROUPS.map((g) => {
      const on = !!s.active[g.id];
      const vis = g.items.filter((_, i) => !s.hidden[g.id + ':' + i]).length;
      if (on) keys += vis;
      return {
        name: g.name, win: g.win, on, isNow: g.id === 'a',
        head: on ? g.head : '#F7F5F0', line: on ? g.line : '#E2DDD2', fade: on ? '1' : '0.72',
        avail: vis + ' of 10 items on',
        toggle: () => this.setState((st) => ({ active: { ...st.active, [g.id]: !st.active[g.id] } })),
        all: () => this.setMany(g, false), none: () => this.setMany(g, true),
        items: g.items.map((it, i) => {
          const k = g.id + ':' + i; const v = !s.hidden[k];
          return {
            name: it[0], price: '₹' + it[1], on: v,
            ink: v ? '#151412' : '#8A8578', strike: v ? 'none' : 'line-through',
            toggle: () => this.setState((st) => { const h = { ...st.hidden }; if (v) h[k] = true; else delete h[k]; return { hidden: h }; })
          };
        })
      };
    });
    const n = GROUPS.filter((g) => s.active[g.id]).length;
    return {
      cols, summary: n + ' groups · ' + keys + ' keys',
      onlyNow: () => this.setState({ active: { m: false, a: true, e: false, n: false } })
    };
  }
}
</script>
</body>
</html>
