<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; background: #E9E4D8; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #16693F; }
    button { font-family: inherit; }
  </style>
</helmet>
<div style="width: 390px; height: 1240px; box-sizing: border-box; display: flex; flex-direction: column; background: #FCFAF5; color: #1D1B16;">

  <!-- sticky header -->
  <div style="flex-shrink: 0; padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid #E6E0D2; background: #FCFAF5;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="flex-grow: 1; display: flex; flex-direction: column;">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 800;">Counter 1</span>
        <span style="font-size: 12px; color: #5E594D;">Prestige Smart Kitchen · <span style="color: #16693F;">● online</span> · 11:28</span>
      </div>
      <span style="width: 40px; height: 40px; border-radius: 12px; border: 1px solid #CFC7B5; display: flex; align-items: center; justify-content: center;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </span>
    </div>
  </div>

  <div style="flex-grow: 1; padding: 12px 14px 0; display: flex; flex-direction: column; gap: 14px;">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="padding-left: 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #8A8374;">{{c.label}}</span>
        <div style="border-radius: 14px; background: #F5F1E7; padding: 8px; display: flex; flex-direction: column; gap: 8px;">
          <sc-for list="{{c.rows}}" as="r" hint-placeholder-count="3">
            <span style="min-height: 60px; box-sizing: border-box; padding: 10px 12px; display: flex; align-items: center; gap: 12px; border-radius: 11px; border: 1px solid #E2DCCD; background: #FFFFFF;">
              <span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; background: {{r.tint}}; color: {{r.ink}}; display: flex; align-items: center; justify-content: center;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"></path></svg>
              </span>
              <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
                <span style="font-size: 15px; font-weight: 600;">{{r.name}}</span>
                <span style="font-size: 12px; color: #5E594D;">{{r.desc}}</span>
              </span>
              <sc-if value="{{r.hasKey}}" hint-placeholder-val="{{ false }}">
                <span style="height: 22px; padding: 0 7px; border-radius: 6px; border: 1px solid #D8D1C1; background: #F5F1E7; font-family: 'IBM Plex Mono', monospace; font-size: 11px; display: flex; align-items: center;">{{r.key}}</span>
              </sc-if>
            </span>
          </sc-for>
        </div>
      </div>
    </sc-for>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="padding-left: 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #8A8374;">HOW IT LOOKS</span>
      <div style="border-radius: 14px; background: #F5F1E7; padding: 12px; display: flex; flex-direction: column; gap: 10px;">
        <sc-for list="{{look}}" as="l" hint-placeholder-count="3">
          <label style="display: flex; align-items: center; gap: 10px; font-size: 14px;">
            <span style="flex-grow: 1; color: #3E4248;">{{l.label}}</span>
            <span style="height: 40px; min-width: 132px; box-sizing: border-box; padding: 0 12px; border-radius: 10px; border: 1px solid #CFC7B5; background: #FFFFFF; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 8px;">
              {{l.value}}
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#5E594D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
            </span>
          </label>
        </sc-for>
        <div style="height: 1px; background: #E2DCCD;"></div>
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #8A8374;">SHOW ON THIS COUNTER</span>
        <sc-for list="{{shows}}" as="s" hint-placeholder-count="6">
          <label style="min-height: 46px; padding: 0 10px; display: flex; align-items: center; gap: 10px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E2DCCD; font-size: 14px;">
            <span style="flex-grow: 1;">{{s.name}}</span>
            <span style="width: 46px; height: 26px; padding: 2px; box-sizing: border-box; border-radius: 13px; background: {{s.track}}; display: flex; justify-content: {{s.justify}};"><span style="width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF;"></span></span>
          </label>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="padding-left: 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #A3542F;">CAREFUL</span>
      <div style="border-radius: 14px; border: 1px solid #F1C7AE; background: #FDF3EE; padding: 8px; display: flex; flex-direction: column; gap: 8px;">
        <span style="padding: 0 4px; font-size: 12px; color: #8A4A2A;">These two stop billing for a moment. Everything is sent and checked first.</span>
        <span style="min-height: 56px; box-sizing: border-box; padding: 10px 12px; display: flex; align-items: center; gap: 10px; border-radius: 11px; border: 1px solid #E8B79C; background: #FFFFFF; color: #6E2A0C; font-size: 15px; font-weight: 700;">Clear and reload</span>
        <span style="min-height: 56px; box-sizing: border-box; padding: 10px 12px; display: flex; align-items: center; gap: 10px; border-radius: 11px; border: 1px solid #E8B79C; background: #FFFFFF; color: #6E2A0C; font-size: 15px; font-weight: 700;">Close this counter</span>
      </div>
    </div>
  </div>

  <div style="flex-shrink: 0; padding: 12px 16px 24px; border-top: 1px solid #E6E0D2; font-size: 12px; color: #5E594D; display: flex; justify-content: space-between;">
    <span>Nobody signed in · <a href="#">Sign in · F7</a></span><span>v4.2.1</span>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":1240}}'>
const I = {
  bills: 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6',
  stuck: 'M12 21a9 9 0 1 0-9-9M3 3v6h6M12 8v4l3 2',
  refresh: 'M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5',
  tv: 'M4 5h16v11H4zM9 20h6M12 16v4',
  book: 'M7 17L17 7M9 7h8v8',
  settings: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6M4 12h2M18 12h2M12 4v2M12 18v2M7 7l1.5 1.5M15.5 15.5L17 17M17 7l-1.5 1.5M8.5 15.5L7 17',
  install: 'M12 4v11M8 11l4 4 4-4M5 20h14',
  lock: 'M6 11h12v9H6zM9 11V8a3 3 0 0 1 6 0v3'
};
class Component extends DCLogic {
  renderVals() {
    const r = (name, desc, icon, key, tint, ink) => ({ name, desc, icon: I[icon], key: key || '', hasKey: !!key, tint, ink });
    return {
      cards: [
        { label: 'BILLS', rows: [
          r("Today's bills", 'print one again', 'bills', 'F8', '#FDF3DC', '#7A5205'),
          r('Why is a bill stuck?', "this counter's store", 'stuck', '', '#FDF3DC', '#7A5205')
        ] },
        { label: 'SHOP & PRICES', rows: [
          r('Read the shop again', 'new prices and products', 'refresh', 'F4', '#E8F4ED', '#16693F'),
          r('Shop screen', 'offers as a TV sign', 'tv', '', '#E4EEFA', '#174A87'),
          r('ChitBridge', 'orders, suppliers, books', 'book', '', '#E4EEFA', '#174A87')
        ] },
        { label: 'THIS COUNTER', rows: [
          r('Settings', 'look, printer, this till', 'settings', '', '#EFEBE1', '#3E3A31'),
          r('Take a break', 'nothing is closed', 'lock', '', '#EFEBE1', '#3E3A31'),
          r('Install as an app', 'opens without a browser', 'install', '', '#EFEBE1', '#3E3A31')
        ] }
      ],
      look: [
        { label: 'Text size', value: 'Normal' },
        { label: 'Theme', value: 'Light cream' },
        { label: 'Products', value: 'Everything' }
      ],
      shows: ['Search box', 'Categories', 'Quick keys', 'The product list', 'Keyboard shortcuts', 'Customer name and phone'].map((n, i) => {
        const on = i !== 4;
        return { name: n, track: on ? '#16693F' : '#CFC7B5', justify: on ? 'flex-end' : 'flex-start' };
      })
    };
  }
}
</script>
</body>
</html>
