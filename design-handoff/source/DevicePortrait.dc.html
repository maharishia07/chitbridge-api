<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; background: #F3EFE6; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #16693F; } a:hover { color: #0D4A2B; }
    button { font-family: inherit; }
    .tl:active { transform: scale(0.98); }
    button:focus-visible { outline: 3px solid #16693F; outline-offset: 2px; }
  </style>
</helmet>
<div style="width: 1080px; height: 1920px; box-sizing: border-box; display: flex; flex-direction: column; background: #FCFAF5; color: #1D1B16;">
  <div style="height: 110px; flex-shrink: 0; box-sizing: border-box; padding: 0 32px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #E6E0D2;">
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 34px; font-weight: 800;">CB Test Traders</span>
    <span style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #D8D1C1; font-size: 18px; color: #5E594D; display: flex; align-items: center;">Counter 1</span>
    <span style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #A9D3BC; background: #E8F4ED; font-size: 18px; color: #16693F; display: flex; align-items: center;">online</span>
    <div style="flex-grow: 1;"></div>
    <span style="font-size: 22px; font-weight: 600;">11:42</span>
  </div>

  <div style="flex-shrink: 0; box-sizing: border-box; padding: 20px 32px; display: flex; align-items: center; gap: 12px;">
    <button style="height: 72px; padding: 0 24px; border-radius: 16px; border: none; background: #1D1B16; color: #FCFAF5; font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 12px;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
      Quick keys
    </button>
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="2">
      <span style="height: 56px; padding: 0 12px 0 20px; border-radius: 28px; background: {{c.tint}}; border: 1px solid {{c.line}}; color: {{c.ink}}; font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 12px;">
        {{c.name}}
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </span>
    </sc-for>
  </div>

  <!-- keys -->
  <div style="flex-grow: 1; min-height: 0; overflow: hidden; box-sizing: border-box; padding: 0 32px 20px; display: flex; flex-direction: column; gap: 20px;">
    <sc-for list="{{sections}}" as="s" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <span style="font-size: 18px; font-weight: 700; letter-spacing: 0.08em; color: {{s.ink}};">{{s.name}}</span>
          <span style="font-size: 18px; color: #5E594D;">{{s.count}}</span>
          <div style="flex-grow: 1; height: 1px; background: #E6E0D2;"></div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px;">
          <sc-for list="{{s.tiles}}" as="t" hint-placeholder-count="8">
            <div class="tl" style="position: relative; height: 140px; box-sizing: border-box; padding: 18px; border-radius: 18px; background: #FFFFFF; border: 1px solid #DDD6C6; display: flex; flex-direction: column; justify-content: space-between;">
              <span style="width: 28px; height: 6px; border-radius: 3px; background: {{s.color}};"></span>
              <span style="font-size: 22px; font-weight: 700; line-height: 1.2; padding-right: 30px;">{{t.name}}</span>
              <span style="font-size: 18px; color: #5E594D;">{{t.price}}</span>
              <span style="position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #9C9483;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
              </span>
              <sc-if value="{{t.inBill}}" hint-placeholder-val="{{ false }}">
                <span style="position: absolute; bottom: 16px; right: 16px; min-width: 36px; height: 36px; border-radius: 18px; background: #16693F; color: #FFFFFF; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center;">{{t.qty}}</span>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <!-- bill -->
  <div style="height: 700px; flex-shrink: 0; box-sizing: border-box; padding: 24px 32px 32px; display: flex; flex-direction: column; gap: 16px; border-top: 3px solid #1D1B16; background: #FFFFFF;">
    <div style="display: flex; justify-content: space-between; font-size: 20px; font-weight: 700; color: #3E3A31;">
      <span>3 products · 5 items</span><span style="color: #16693F;">Park · Clear</span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column;">
      <sc-for list="{{lines}}" as="l" hint-placeholder-count="3">
        <div style="min-height: 88px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #EDE8DC;">
          <span style="flex-grow: 1; font-size: 24px; font-weight: 600;">{{l.name}}</span>
          <span style="display: flex; align-items: center; gap: 8px;">
            <span style="width: 56px; height: 56px; border-radius: 12px; border: 1px solid #CFC7B5; font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center;">−</span>
            <span style="width: 56px; text-align: center; font-size: 24px;">{{l.qty}}</span>
            <span style="width: 56px; height: 56px; border-radius: 12px; border: 1px solid #CFC7B5; font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center;">+</span>
          </span>
          <span style="width: 150px; text-align: right; font-size: 26px; font-weight: 700;">{{l.total}}</span>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 44px; font-weight: 800;">TOTAL</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 56px; font-weight: 800;">₹220.00</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px;">
      <button style="height: 80px; border-radius: 16px; border: 1px solid #BDB4A1; background: #FFFFFF; font-size: 26px;">Cash</button>
      <button style="height: 80px; border-radius: 16px; border: 1px solid #BDB4A1; background: #FFFFFF; font-size: 26px;">Card</button>
      <button style="height: 80px; border-radius: 16px; border: 2px solid #16693F; background: #E8F4ED; color: #16693F; font-size: 26px; font-weight: 700;">UPI</button>
    </div>
    <button style="height: 100px; border-radius: 18px; border: none; background: #16693F; color: #FFFFFF; font-size: 30px; font-weight: 700;">Save &amp; print</button>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
  renderVals() {
    const t = (n, p, q) => ({ name: n, price: '₹' + p, qty: q || 0, inBill: !!q });
    return {
      chips: [
        { name: 'Morning', tint: '#FDF3DC', line: '#EFD39A', ink: '#7A5205' },
        { name: 'Afternoon', tint: '#FCE9DF', line: '#F0C3AC', ink: '#8A3410' }
      ],
      sections: [
        { name: 'MORNING', ink: '#7A5205', color: '#E0A020', count: '7 of 10 showing', tiles: [t('Idli (2 pc)', 40), t('Masala Dosa', 70, 2), t('Medu Vada', 30, 1), t('Rava Upma', 45), t('Kesari Bath', 35), t('Filter Coffee', 25, 2), t('Masala Tea', 20)] },
        { name: 'AFTERNOON', ink: '#8A3410', color: '#D9602B', count: '10 of 10 showing', tiles: [t('South Indian Meals', 150), t('Veg Biryani', 140), t('Curd Rice', 70), t('Sambar Rice', 80), t('Lemon Rice', 65), t('Chapati Kurma', 75), t('Veg Pulao', 110), t('Buttermilk', 25)] }
      ],
      lines: [
        { name: 'Masala Dosa', qty: 2, total: '₹140.00' },
        { name: 'Filter Coffee', qty: 2, total: '₹50.00' },
        { name: 'Medu Vada', qty: 1, total: '₹30.00' }
      ]
    };
  }
}
</script>
</body>
</html>
