<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; background: #2A2823; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #16693F; }
    button { font-family: inherit; }
  </style>
</helmet>
<div style="width: 360px; height: 720px; box-sizing: border-box; display: flex; flex-direction: column; background: #FCFAF5; color: #1D1B16;">
  <div style="height: 44px; flex-shrink: 0; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; gap: 8px; background: #1D1B16; color: #FCFAF5;">
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 800;">CB · Handheld 3</span>
    <div style="flex-grow: 1;"></div>
    <span style="font-size: 12px; color: #BDB7AA;">Table 7 · 11:42</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid #DDD6C6;">
    <sc-for list="{{tabs}}" as="g" hint-placeholder-count="4">
      <span style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 700; color: {{g.ink}}; border-bottom: 3px solid {{g.bar}}; background: {{g.bg}};">
        {{g.name}}
        <span style="font-size: 10px; font-weight: 500;">{{g.state}}</span>
      </span>
    </sc-for>
  </div>
  <div style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 8px; display: flex; flex-direction: column; gap: 4px;">
    <sc-for list="{{rows}}" as="t" hint-placeholder-count="10">
      <div style="min-height: 48px; box-sizing: border-box; padding: 0 4px 0 12px; display: flex; align-items: center; gap: 8px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E6E0D2;">
        <span style="width: 4px; height: 24px; border-radius: 2px; background: {{t.color}};"></span>
        <span style="flex-grow: 1; font-size: 15px; font-weight: 600;">{{t.name}}</span>
        <span style="font-size: 13px; color: #5E594D;">{{t.price}}</span>
        <sc-if value="{{t.inBill}}" hint-placeholder-val="{{ false }}">
          <span style="min-width: 26px; height: 26px; border-radius: 13px; background: #16693F; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;">{{t.qty}}</span>
        </sc-if>
        <span style="width: 36px; height: 40px; display: flex; align-items: center; justify-content: center; color: #9C9483;">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </span>
      </div>
    </sc-for>
  </div>
  <div style="padding: 8px; display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px; border-top: 1px solid #DDD6C6;">
    <button style="height: 52px; border-radius: 12px; border: 1px solid #BDB4A1; background: #FFFFFF; font-size: 14px; font-weight: 700;">Bill · 5</button>
    <button style="height: 52px; border-radius: 12px; border: none; background: #16693F; color: #FFFFFF; font-size: 16px; font-weight: 700;">Charge ₹220</button>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":360,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const tab = (name, state, on, color) => ({ name, state, ink: on ? '#1D1B16' : '#8A8374', bar: on ? color : 'transparent', bg: on ? '#FFFFFF' : '#F3EFE6' });
    const m = [['Idli (2 pc)', 40], ['Masala Dosa', 70, 2], ['Medu Vada', 30, 1], ['Rava Upma', 45], ['Kesari Bath', 35], ['Filter Coffee', 25, 2], ['Masala Tea', 20]];
    const a = [['South Indian Meals', 150], ['Veg Biryani', 140], ['Curd Rice', 70]];
    return {
      tabs: [tab('Morning', '✓ 7', true, '#E0A020'), tab('Afternoon', '✓ 10', true, '#D9602B'), tab('Evening', 'off', false), tab('Night', 'off', false)],
      rows: m.map((x) => ({ name: x[0], price: '₹' + x[1], qty: x[2] || 0, inBill: !!x[2], color: '#E0A020' }))
        .concat(a.map((x) => ({ name: x[0], price: '₹' + x[1], qty: 0, inBill: false, color: '#D9602B' })))
    };
  }
}
</script>
</body>
</html>
