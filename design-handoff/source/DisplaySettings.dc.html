<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; background: #F4F2EC; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #16693F; } a:hover { color: #0D4A2B; }
    button { font-family: inherit; }
    .dv:hover { background: #FBFAF7 !important; }
    .opt:hover { border-color: #16181B !important; }
    button:focus-visible, a:focus-visible { outline: 2px solid #16693F; outline-offset: 2px; }
  </style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F2EC; color: #16181B;">
  <div style="height: 64px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; display: flex; align-items: center; gap: 16px; background: #16181B; color: #F2EFE8;">
    <a href="Maintenance.dc.html" style="height: 38px; padding: 0 12px; border-radius: 9px; border: 1px solid #3A3F46; color: #F2EFE8; text-decoration: none; font-size: 13px; display: flex; align-items: center;">← Quick keys</a>
    <span style="font-size: 13px; color: #9EA4AC;">Back office / Devices /</span>
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 19px; font-weight: 700;">Screen style</span>
    <div style="flex-grow: 1;"></div>
    <span style="font-size: 13px; color: #9EA4AC;">Applies at next sync · per device overrides per counter</span>
  </div>

  <div style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 24px 28px; display: flex; gap: 20px;">
    <!-- devices -->
    <div style="width: 300px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px;">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 700;">Devices</span>
      <sc-for list="{{devices}}" as="d" hint-placeholder-count="7">
        <button class="dv" onClick="{{d.pick}}" aria-pressed="{{d.pressed}}" style="box-sizing: border-box; width: 100%; padding: 12px 14px; border-radius: 12px; border: {{d.border}}; background: {{d.bg}}; color: #16181B; text-align: left; display: flex; align-items: center; gap: 12px; cursor: pointer;">
          <span style="width: 36px; height: 36px; border-radius: 9px; background: #EAE6DC; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;">{{d.icon}}</span>
          <span style="flex-grow: 1; display: flex; flex-direction: column;">
            <span style="font-size: 15px; font-weight: 600;">{{d.name}}</span>
            <span style="font-size: 12px; color: #5E636B;">{{d.summary}}</span>
          </span>
        </button>
      </sc-for>
    </div>

    <!-- settings -->
    <div style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 22px 24px; border-radius: 18px; background: #FFFFFF; border: 1px solid #E3DFD6; display: flex; flex-direction: column; gap: 18px; overflow-y: auto;">
      <div style="display: flex; align-items: baseline; gap: 12px;">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800;">{{cur.name}}</span>
        <span style="font-size: 13px; color: #5E636B;">{{cur.size}}</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #5E636B;">PRESET</span>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
          <sc-for list="{{presets}}" as="p" hint-placeholder-count="8">
            <button class="opt" onClick="{{p.pick}}" aria-pressed="{{p.pressed}}" style="min-height: 58px; padding: 8px 12px; border-radius: 10px; border: {{p.border}}; background: {{p.bg}}; color: #16181B; text-align: left; display: flex; flex-direction: column; justify-content: center; cursor: pointer;">
              <span style="font-size: 14px; font-weight: 700;">{{p.name}}</span>
              <span style="font-size: 11px; color: #5E636B;">{{p.desc}}</span>
            </button>
          </sc-for>
        </div>
      </div>

      <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
        <div style="display: flex; align-items: center; gap: 12px;">
          <span style="width: 150px; flex-shrink: 0; font-size: 14px; font-weight: 600;">{{r.label}}</span>
          <div style="display: flex; flex-wrap: wrap; gap: 6px;">
            <sc-for list="{{r.opts}}" as="o" hint-placeholder-count="4">
              <button class="opt" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="height: 36px; padding: 0 12px; border-radius: 18px; border: {{o.border}}; background: {{o.bg}}; color: {{o.ink}}; font-size: 13px; font-weight: 600; cursor: pointer;">{{o.name}}</button>
            </sc-for>
          </div>
        </div>
      </sc-for>

      <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; background: #F7F4ED;">
        <span style="width: 150px; flex-shrink: 0; font-size: 14px; font-weight: 600;">Photos on keys</span>
        <button onClick="{{togglePhotos}}" aria-pressed="{{photoPressed}}" aria-label="Photos on keys" style="width: 56px; height: 32px; padding: 3px; box-sizing: border-box; border-radius: 16px; border: none; background: {{photoTrack}}; display: flex; justify-content: {{photoJustify}}; cursor: pointer;">
          <span style="width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF;"></span>
        </button>
        <span style="font-size: 13px; color: #3E4248;">{{photoNote}}</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="width: 150px; flex-shrink: 0; font-size: 14px; font-weight: 600;">Cashier may change</span>
        <label style="display: flex; align-items: center; gap: 8px; font-size: 14px;"><input type="checkbox" checked="{{yes}}" style="width: 20px; height: 20px; margin: 0; accent-color: #16693F;"> Tile style &amp; photos for this device only</label>
      </div>
    </div>

    <!-- preview -->
    <div style="width: 360px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px;">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 700;">Preview</span>
      <div style="padding: 14px; border-radius: 16px; background: {{pv.bg}}; border: 1px solid #E3DFD6; display: flex; flex-direction: column; gap: 8px;">
        <div style="height: 10px; width: 50%; border-radius: 5px; background: {{pv.line}};"></div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;">
          <sc-for list="{{pv.tiles}}" as="t" hint-placeholder-count="6">
            <div style="box-sizing: border-box; border-radius: 8px; background: {{pv.tile}}; border: 1px solid {{pv.line}}; overflow: hidden; display: flex; flex-direction: column;">
              <sc-if value="{{pv.photos}}" hint-placeholder-val="{{ false }}">
                <span style="height: 44px; background: {{t.tint}};"></span>
              </sc-if>
              <span style="padding: 6px; font-size: 11px; font-weight: 700; color: {{pv.ink}};">{{t.name}}</span>
            </div>
          </sc-for>
        </div>
        <div style="height: 34px; border-radius: 8px; background: {{pv.accent}};"></div>
      </div>
      <span style="font-size: 12px; color: #5E636B; line-height: 1.5;">{{pv.caption}}</span>
      <div style="margin-top: auto; display: flex; gap: 8px;">
        <button style="flex-grow: 1; height: 46px; border-radius: 11px; border: 1px solid #D8D3C8; background: #FFFFFF; font-size: 14px; cursor: pointer;">Reset to counter</button>
        <button style="flex-grow: 1; height: 46px; border-radius: 11px; border: none; background: #16693F; color: #FFFFFF; font-size: 14px; font-weight: 700; cursor: pointer;">Save</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
const DEVICES = [
  { id: 'c1', name: 'Counter 1', icon: 'POS', size: 'Horizontal terminal · 1600×900', preset: 'classic', photos: true },
  { id: 'c2', name: 'Counter 2', icon: 'POS', size: 'Compact terminal · 1024×768', preset: 'compact', photos: false },
  { id: 'k1', name: 'Self-order kiosk', icon: 'KSK', size: 'Vertical terminal · 1080×1920', preset: 'kiosk', photos: true },
  { id: 't1', name: 'Waiter tablet', icon: 'TAB', size: 'Tablet · 1180×820', preset: 'tablet', photos: true },
  { id: 'p1', name: 'Owner phone', icon: 'PH', size: 'Phone · 390×844', preset: 'phone', photos: false },
  { id: 'h1', name: 'Handheld 1', icon: 'HH', size: 'Handheld · 360×720', preset: 'handheld', photos: false },
  { id: 'h2', name: 'Handheld 2', icon: 'HH', size: 'Handheld · 360×720', preset: 'handheld', photos: false }
];
const PRESETS = [
  { id: 'classic', name: 'Counter classic', desc: 'A · light', layout: 'Horizontal', tile: 'Classic', picker: 'Popup', theme: 'Light cream' },
  { id: 'dark', name: 'Counter dark', desc: 'B · dark', layout: 'Horizontal', tile: 'Classic', picker: 'Popup', theme: 'Dark' },
  { id: 'timeline', name: 'Counter timeline', desc: 'C · day bar', layout: 'Timeline', tile: 'Colour block', picker: 'Day timeline', theme: 'Paper' },
  { id: 'rail', name: 'Counter rail', desc: 'D · list keys', layout: 'Rail', tile: 'Compact row', picker: 'Group rail', theme: 'Navy' },
  { id: 'compact', name: 'Compact', desc: '15″ terminal', layout: 'Compact', tile: 'Classic', picker: 'Tab strip', theme: 'Light cream' },
  { id: 'kiosk', name: 'Kiosk', desc: 'vertical', layout: 'Vertical', tile: 'Photo', picker: 'Popup', theme: 'Light cream' },
  { id: 'tablet', name: 'Tablet waiter', desc: 'sell → pay', layout: 'Tablet', tile: 'Photo', picker: 'Side drawer', theme: 'Light cream' },
  { id: 'phone', name: 'Phone', desc: '3 steps', layout: 'Phone', tile: 'Classic', picker: 'Bottom sheet', theme: 'Light cream' },
  { id: 'handheld', name: 'Handheld', desc: '2 steps', layout: 'Handheld', tile: 'Compact row', picker: 'Tab strip', theme: 'Light cream' }
];
const OPTS = {
  layout: ['Horizontal', 'Vertical', 'Compact', 'Tablet', 'Phone', 'Handheld', 'Timeline', 'Rail', 'Auto'],
  tile: ['Classic', 'Colour block', 'Monogram', 'Compact row', 'Hotkey', 'Photo'],
  picker: ['Popup', 'Side drawer', 'Full screen', 'Bottom sheet', 'Day timeline', 'Group rail', 'Tab strip'],
  theme: ['Light cream', 'Dark', 'Paper', 'Navy'],
  density: ['Comfortable', 'Compact']
};
const THEME = {
  'Light cream': { bg: '#FCFAF5', tile: '#FFFFFF', line: '#DDD6C6', ink: '#1D1B16', accent: '#16693F' },
  'Dark': { bg: '#0E1012', tile: '#181B1F', line: '#2A2E34', ink: '#F2EFE8', accent: '#3FB6A8' },
  'Paper': { bg: '#FFFDF7', tile: '#F6C554', line: '#151412', ink: '#151412', accent: '#C2381F' },
  'Navy': { bg: '#0C1522', tile: '#0F1B2B', line: '#1C2A3E', ink: '#E8EEF6', accent: '#6FE3C1' }
};
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const cfg = {};
    DEVICES.forEach((d) => { const p = PRESETS.find((x) => x.id === d.preset); cfg[d.id] = { preset: p.id, layout: p.layout, tile: p.tile, picker: p.picker, theme: p.theme, density: 'Comfortable', photos: d.photos }; });
    this.state = { sel: 'c1', cfg };
  }
  set(patch) { this.setState((s) => ({ cfg: { ...s.cfg, [s.sel]: { ...s.cfg[s.sel], ...patch } } })); }
  renderVals() {
    const s = this.state;
    const c = s.cfg[s.sel];
    const dev = DEVICES.find((d) => d.id === s.sel);
    const chip = (on) => ({ border: on ? '1.5px solid #16181B' : '1px solid #D8D3C8', bg: on ? '#16181B' : '#FFFFFF', ink: on ? '#FFFFFF' : '#16181B', pressed: on ? 'true' : 'false' });
    const row = (key, label) => ({ label, opts: OPTS[key].map((n) => ({ name: n, ...chip(c[key] === n), pick: () => this.set({ [key]: n, preset: 'custom' }) })) });
    const th = THEME[c.theme];
    const names = ['Tata Filter coffee', 'Health drink', 'Green tea', 'Bread 400 g', 'Rusk 300 g', 'Butter 100 g'];
    const tints = ['#FDF3DC', '#FCE9DF', '#E4EEFA', '#EEEAFB', '#FDF3DC', '#FCE9DF'];
    return {
      yes: true,
      devices: DEVICES.map((d) => {
        const on = d.id === s.sel; const dc = s.cfg[d.id];
        return { name: d.name, icon: d.icon, summary: (dc.preset === 'custom' ? 'Custom' : PRESETS.find((p) => p.id === dc.preset).name) + ' · photos ' + (dc.photos ? 'on' : 'off'),
          pressed: on ? 'true' : 'false', border: on ? '1.5px solid #16181B' : '1px solid #E3DFD6', bg: on ? '#FFFFFF' : 'transparent', pick: () => this.setState({ sel: d.id }) };
      }),
      cur: { name: dev.name, size: dev.size },
      presets: PRESETS.slice(0, 8).map((p) => { const on = c.preset === p.id; return { name: p.name, desc: p.desc, pressed: on ? 'true' : 'false', border: on ? '2px solid #16693F' : '1px solid #D8D3C8', bg: on ? '#E8F4ED' : '#FFFFFF', pick: () => this.set({ preset: p.id, layout: p.layout, tile: p.tile, picker: p.picker, theme: p.theme }) }; }),
      rows: [row('layout', 'Layout'), row('tile', 'Tile style'), row('picker', 'Quick keys picker'), row('theme', 'Theme'), row('density', 'Density')],
      togglePhotos: () => this.set({ photos: !c.photos }),
      photoPressed: c.photos ? 'true' : 'false', photoTrack: c.photos ? '#16693F' : '#C9C3B6', photoJustify: c.photos ? 'flex-end' : 'flex-start',
      photoNote: c.photos ? 'On — items without a photo show initials. Fewer keys fit per screen.' : 'Off — text tiles, most keys per screen.',
      pv: { bg: th.bg, tile: th.tile, line: th.line, ink: th.ink, accent: th.accent, photos: c.photos,
        tiles: names.map((n, i) => ({ name: n, tint: tints[i] })),
        caption: c.layout + ' layout · ' + c.tile + ' tiles · ' + c.picker + ' picker · ' + c.theme + ' · ' + c.density + ' · photos ' + (c.photos ? 'on' : 'off') }
    };
  }
}
</script>
</body>
</html>
