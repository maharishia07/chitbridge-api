<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&amp;family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
  <style>
    body { margin: 0; background: #E9E4D8; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #16693F; }
    button, input { font-family: inherit; }
    .r:hover { background: #F5F1E7 !important; }
    button:focus-visible, input:focus-visible { outline: 2px solid #16693F; outline-offset: 2px; }
  </style>
</helmet>
<div style="width: 620px; height: 910px; box-sizing: border-box; display: flex; flex-direction: column; background: #FCFAF5; color: #1D1B16; border-radius: 18px; overflow: hidden;">

  <div style="flex-shrink: 0; padding: 16px 18px 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #E6E0D2;">
    <div style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #5E594D;">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 17px; font-weight: 800; color: #1D1B16;">Counter 1</span>
      <span style="color: #16693F;">● online</span><span>· prices as at 11:28</span>
      <span style="flex-grow: 1;"></span>
      <span style="font-family: 'IBM Plex Mono', monospace;">today 0 · ₹0.00</span>
    </div>
    <label style="height: 52px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; gap: 10px; border-radius: 12px; border: 2px solid #CFC7B5; background: #FFFFFF;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6558" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input type="text" placeholder="Type what you want to do…" aria-label="Search actions" style="flex-grow: 1; border: none; outline: none; background: transparent; font-size: 17px; color: #1D1B16;">
      <span style="height: 24px; padding: 0 8px; border-radius: 6px; border: 1px solid #D8D1C1; background: #F5F1E7; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #3E3A31; display: flex; align-items: center;">Ctrl K</span>
    </label>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 6px 8px 8px;">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
      <div style="padding: 10px 10px 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: {{g.color}};">{{g.label}}</div>
      <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
        <button class="r" style="width: 100%; box-sizing: border-box; min-height: 48px; padding: 6px 10px; display: flex; align-items: center; gap: 12px; border: none; border-radius: 10px; background: {{r.bg}}; text-align: left; color: {{r.ink}}; cursor: pointer;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; opacity: 0.75;"><path d="{{r.icon}}"></path></svg>
          <span style="flex-grow: 1; font-size: 15px; font-weight: 600;">{{r.name}}</span>
          <span style="font-size: 13px; color: {{r.descInk}};">{{r.desc}}</span>
          <sc-if value="{{r.hasKey}}" hint-placeholder-val="{{ false }}">
            <span style="height: 24px; padding: 0 8px; border-radius: 6px; border: 1px solid #D8D1C1; background: #FFFFFF; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #3E3A31; display: flex; align-items: center;">{{r.key}}</span>
          </sc-if>
        </button>
      </sc-for>
    </sc-for>

    <div style="padding: 10px 10px 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #8A8374;">HOW IT LOOKS</div>
    <div style="margin: 0 10px 4px; display: flex; flex-wrap: wrap; gap: 6px;">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="9">
        <span style="height: 32px; padding: 0 11px; border-radius: 16px; border: 1px solid {{c.line}}; background: {{c.bg}}; color: {{c.ink}}; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px;">{{c.name}}</span>
      </sc-for>
    </div>
  </div>

  <div style="flex-shrink: 0; padding: 10px 16px; border-top: 1px solid #E6E0D2; background: #F7F3EA; display: flex; align-items: center; gap: 14px; font-size: 12px; color: #5E594D;">
    <span><strong style="color: #1D1B16; font-family: 'IBM Plex Mono', monospace;">↑↓</strong> move</span>
    <span><strong style="color: #1D1B16; font-family: 'IBM Plex Mono', monospace;">Enter</strong> run</span>
    <span><strong style="color: #1D1B16; font-family: 'IBM Plex Mono', monospace;">Esc</strong> close</span>
    <span style="flex-grow: 1;"></span>
    <span>Nobody signed in · <a href="#">Sign in · F7</a></span>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":620,"height":910}}'>
const I = {
  bills: 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6',
  stuck: 'M12 21a9 9 0 1 0-9-9M3 3v6h6M12 8v4l3 2',
  refresh: 'M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5',
  tv: 'M4 5h16v11H4zM9 20h6M12 16v4',
  book: 'M7 17L17 7M9 7h8v8',
  settings: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6M4 12h2M18 12h2M12 4v2M12 18v2M7 7l1.5 1.5M15.5 15.5L17 17M17 7l-1.5 1.5M8.5 15.5L7 17',
  install: 'M12 4v11M8 11l4 4 4-4M5 20h14',
  lock: 'M6 11h12v9H6zM9 11V8a3 3 0 0 1 6 0v3',
  reload: 'M4 12a8 8 0 1 0 2.6-5.9M4 4v5h5',
  power: 'M12 4v8M7 6a8 8 0 1 0 10 0'
};
class Component extends DCLogic {
  renderVals() {
    const r = (name, desc, icon, key, danger, first) => ({
      name, desc, icon: I[icon], key: key || '', hasKey: !!key,
      bg: first ? '#F0ECE2' : 'transparent',
      ink: danger ? '#6E2A0C' : '#1D1B16',
      descInk: danger ? '#A3542F' : '#5E594D'
    });
    return {
      groups: [
        { label: 'BILLS', color: '#8A8374', rows: [
          r("Today's bills", 'print one again', 'bills', 'F8', false, true),
          r('Why is a bill stuck?', "this counter's store", 'stuck')
        ] },
        { label: 'SHOP & PRICES', color: '#8A8374', rows: [
          r('Read the shop again', 'new prices and products', 'refresh', 'F4'),
          r('Shop screen', 'offers as a TV sign', 'tv'),
          r('ChitBridge', 'orders, suppliers, books', 'book')
        ] },
        { label: 'THIS COUNTER', color: '#8A8374', rows: [
          r('Settings', 'look, printer, this till', 'settings'),
          r('Take a break', 'nothing is closed', 'lock'),
          r('Install as an app', 'opens without a browser', 'install')
        ] },
        { label: 'CAREFUL', color: '#A3542F', rows: [
          r('Clear and reload', 'reads the shop fresh', 'reload', '', true),
          r('Close this counter', 'sends and checks first', 'power', '', true)
        ] }
      ],
      chips: [
        { name: 'Text: Normal', bg: '#FFFFFF', line: '#D8D1C1', ink: '#1D1B16' },
        { name: 'Theme: Light cream', bg: '#FFFFFF', line: '#D8D1C1', ink: '#1D1B16' },
        { name: 'Products: Everything', bg: '#FFFFFF', line: '#D8D1C1', ink: '#1D1B16' },
        { name: '✓ Search box', bg: '#E8F4ED', line: '#A9D3BC', ink: '#0D4A2B' },
        { name: '✓ Categories', bg: '#E8F4ED', line: '#A9D3BC', ink: '#0D4A2B' },
        { name: '✓ Quick keys', bg: '#E8F4ED', line: '#A9D3BC', ink: '#0D4A2B' },
        { name: '✓ Product list', bg: '#E8F4ED', line: '#A9D3BC', ink: '#0D4A2B' },
        { name: 'Keyboard shortcuts', bg: '#FFFFFF', line: '#D8D1C1', ink: '#5E594D' },
        { name: '✓ Customer name and phone', bg: '#E8F4ED', line: '#A9D3BC', ink: '#0D4A2B' }
      ]
    };
  }
}
</script>
</body>
</html>
